    const tp = new THREE.Group(); tp.position.set(0, 2.0, -1.8); bg.add(tp); cyl(0, 0.75, 4, SK, 0, 0, -2, tp).rotation.x = -Math.PI / 2;
    const np = new THREE.Group(); np.position.set(0, 2.5, 1.4); bg.add(np); cyl(0.3, 0.55, 2.7, SK, 0, 1.35, 0, np);
    const head = sc(ball(0.5, SK, 0, 2.85, 0.1, np), 1, 0.85, 1.3); sc(ball(0.3, BE, 0, 2.75, 0.65, np), 1, 0.8, 1.1);
    for (const x of [-0.3, 0.3]) { ball(0.09, 0x222222, x, 2.97, 0.35, np); ball(0.1, 0xe89a9a, x * 1.25, 2.8, 0.4, np); }
    const WP = [[-7, -3.8], [-1, -3.0], [5, -3.8], [3, -1.6], [-4, -2]];
    const hearts = [0, 1, 2].map(() => { const h = glowBall(0.13, 0xff8aa0, 0, -9, 0, 0); h.visible = false; return h; }), hv = new THREE.Vector3();
    fx.push((dt, t) => {

      else if (B.wait > 0) B.wait -= dt;

  lamps: [],

    {id: 'egg', icon: '🥚', label: '알 지키기', spot: [7, 5.7], face: Math.PI, run(c, done) {

          const stop = () => { live = false; cancelAnimationFrame(raf); };
          setRound(); raf = requestAnimationFrame(tick);
          q('#qt').onclick = () => { stop(); close(); done(); };
          q('#go').onclick = () => { if (wait || !live) return; wait = true;
            const hit = Math.abs(p - 0.5) <= cfg(r).w / 2;
            egg.style.transition = 'left .7s, top .35s, opacity .7s';
            if (hit) { ok++; c.beep(600 + ok * 120, .12, 0, 'sine'); egg.style.left = '50%'; egg.style.top = '44px'; msg.textContent = '쏙! 둥지에 안착'; }
            else { c.beep(200, .15); egg.style.left = (p + Math.sign(v) * 0.5) * 100 + '%'; egg.style.top = '58px'; egg.style.opacity = 0; msg.textContent = '아앗, 굴러갔어요'; }
            setTimeout(() => { if (!live) return; r++;
              if (r >= 3) { stop(); c.DB.eggs = (c.DB.eggs || 0) + ok; c.count('egg'); msg.textContent = `알 ${ok}/3 지켰어요`;
                setTimeout(() => { close(); if (ok) c.wobble(); c.stamp(ok === 3 ? '완벽!' : ok ? `알 ${ok}개` : '아쉬워', ok ? '둥지가 따뜻해요' : '알은 내일도 굴러가요');
                  c.toast('🥚 ' + EGGF[(c.DB.total.egg || 0) % EGGF.length], 4200); done(); }, 1200); return; }
              wait = false; msg.textContent = ['첫 번째 알', '두 번째 알', '세 번째 알'][r]; setRound(); }, 900); };
        }); }},
    {id: 'fossil', icon: '🐾', label: '발자국', get spot() { const k = (C0?.DB.total.fossil || 0) % 8; return [-10.4 + k * 0.85, 5.1]; }, face: Math.PI, run(c, done) {
      const k = (c.DB.total.fossil || 0) % 8; c.doAct(c.player, 'crouch'); c.beep(180, .2, 0, 'sine', .06);
      setTimeout(() => { c.putPrint(k); const n = c.count('fossil'); c.stamp('콕', `오늘 ${n}번째 발자국`); c.toast('🐾 ' + FOOT[(c.DB.total.fossil - 1) % FOOT.length], 4200); setTimeout(done, 1000); }, 900); }},
    {id: 'pet', icon: '🦕', label: '쓰다듬기',
      // 가까이 가는 동안 공룡이 멈추고 이쪽을 보게 한다(spot 을 읽는 순간이 단추를 누른 순간)
      get spot() { const B = C0?.bronto; if (!B) return [0, 0]; B.holdT = 14; return [B.g.position.x + 0.5, B.g.position.z + 4.8]; }, face: Math.PI, run(c, done) {
      const B = c.bronto; B.holdT = 14;
      setTimeout(() => { c.doAct(c.player, 'wave'); B.nod = true; B.love = 2.6; const n = c.count('pet'); c.beep(150, .5, 0, 'sine', .08);
        c.toast(n >= 5 ? '🦕 이제 완전 친구예요' : PET[(n - 1) % PET.length], 3000); if (n === 1) c.stamp('쓰담', '고개를 숙였어요');
        setTimeout(() => { B.nod = false; B.holdT = 1.2; setTimeout(done, 500); }, 2600); }, 900); }},
    {id: 'today', icon: '🦖', label: '오늘의 공룡', spot: [-3, -7.6], face: Math.PI, run(c, done) {
      const d = c.now(), S = DINO[dayN(d) % DINO.length], seen = new Set(c.DB.seen || []), isNew = !seen.has(S.n); seen.add(S.n); c.DB.seen = [...seen]; c.count('today');
      if (isNew) c.stamp('만났다', S.n);
      setTimeout(() => c.dialog('오늘의 공룡', `${c.hm(d)} · 만난 공룡 ${seen.size}/${DINO.length}`,
        `<p style="font-size:21px"><b>${S.n}</b></p><p style="font-size:13px;color:#7a6e5e">${S.era}</p><p>${S.f}</p>` +
        (isNew ? '<p style="font-size:13px">새로 만났어요.</p>' : '<p style="color:#7a6e5e;font-size:13px">하루에 한 종. 내일은 다른 친구가 와요.</p>'), [['알겠어요', done, 'main']]), isNew ? 1600 : 200); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">지킨 알 ${c.DB.eggs || 0}개 · 남긴 발자국 ${c.DB.total.fossil || 0}개</p>` +
    `<p style="font-size:13px;color:#7a6e5e">만난 공룡 ${(c.DB.seen || []).length}/${DINO.length}: ${(c.DB.seen || []).join(' · ') || '아직 없음'}</p>`,
  onEnter(c) { c.toast(c.visits() > 1 ? `🦕 또 왔네요. ${c.visits()}번째 날` : '🦕 쿵, 쿵. 저기 긴 목이 보여요', 3000); },
});
</script></body></html>
