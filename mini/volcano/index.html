<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>화산 관측소</title></head><body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import {start} from '../mini.js';

// 일지에 적히는 한 줄 사실 — 날짜마다 하나씩 차례로
const FACT = [
  '용암 온도는 대략 700~1200℃예요. 화산마다, 용암 종류마다 달라요.',
  '화산재는 타고 남은 재가 아니에요. 잘게 부서진 암석과 유리 조각이에요.',
  '하와이 킬라우에아는 세계에서 가장 활발한 화산 가운데 하나예요.',
  '땅속에 있을 땐 마그마, 땅 위로 흘러나오면 용암이라고 불러요.',
  '구멍이 많아 가벼운 부석(속돌)은 물에 뜨기도 해요.',
  '하와이 제도는 바닷속에서 화산이 솟아 생긴 섬들이에요.',
  '식어서 굳은 용암은 현무암 같은 검은 돌이 되기도 해요.',
  '1815년 탐보라 화산이 크게 터진 뒤, 이듬해는 여름이 없는 해로 불릴 만큼 추웠어요.',
  '서기 79년 베수비오 화산이 터져 폼페이는 화산재 아래 묻혔어요.',
  '제주 한라산도 화산이 만든 산이에요. 지금은 쉬고 있는 화산으로 봐요.',
  '화산이 터지기 전엔 땅이 부풀고 작은 지진이 잦아지기도 해서, 관측소는 이걸 지켜봐요.',
  '1980년 미국 세인트헬렌스 화산이 크게 터지면서 산 윗부분이 무너졌어요.',
];
// 용암 줄기를 볼 때 들려주는 한 줄
const LAVA = [
  '용암은 대략 700~1200℃. 겉이 검게 식어도 속은 한참 뜨거워요.',
  '흘러나온 용암이 식어 굳으면 현무암 같은 검은 돌이 돼요.',
  '땅속에선 마그마, 땅 위로 나오면 용암. 이름이 달라요.',
];
// 화산재 채취 — [이름, 설명, 색]
const SAMPLES = [
  ['화산재', '잘게 부서진 암석·유리 조각이에요. 타고 남은 재가 아니에요', 0x8a8a90],
  ['부석(속돌)', '구멍이 많아 가벼워서 물에 뜨는 돌도 있어요', 0xc8c0b0],
  ['현무암 조각', '식은 용암이 굳으면 이런 검은 돌이 돼요', 0x2a2a2e],
  ['노란 황 가루', '화산 가스에서 나온 황이 구멍 둘레에 노랗게 붙기도 해요', 0xe0c030],
  ['화산유리 알갱이', '용암이 아주 빨리 식으면 유리처럼 굳어요', 0x1a1a24],
];
const NOTES = ['붉은 빛이 또렷하다', '연기가 바람에 눕는다', '땅은 고요하다'];
// 그날의 화산 상태 — smoke 연기 양, tone 연기 색, flow 용암 줄기 길이, erupt 분화 간격(초), ash 재 날림, quake 지진계 바늘 떨림
const STATES = [
  {n: '잠잠함', note: '오늘은 조용해요. 연기가 가늘게 올라요.', smoke: .25, tone: 0x9a9aa4, flow: .35, erupt: 0, ash: 0, quake: .04},
  {n: '김이 올라옴', note: '하얀 김이 모락모락. 수증기가 많은 날이에요.', smoke: .6, tone: 0xb8b8c4, flow: .35, erupt: 0, ash: 0, quake: .05},
  {n: '짙은 연기', note: '검은 연기가 한참 올라요. 바람 방향을 봐 둬요.', smoke: 1, tone: 0x58525a, flow: .5, erupt: 0, ash: 0, quake: .08},
  {n: '재가 날림', note: '가는 재가 마당까지 내려와요. 마스크를 챙겨요.', smoke: .9, tone: 0x3e383e, flow: .45, erupt: 0, ash: 1, quake: .1},
  {n: '작은 분화', note: '이따금 불꽃이 튀어요. 작은 분화가 이어지는 날이에요.', smoke: .8, tone: 0x58525a, flow: .7, erupt: 7, ash: 0, quake: .14},
  {n: '용암이 흘러내림', note: '붉은 줄기가 비탈을 타고 천천히 내려와요.', smoke: .5, tone: 0x6a5a5e, flow: 1, erupt: 0, ash: 0, quake: .1},
];
const ORDER = [2, 0, 4, 1, 5, 3];   // 하루씩 다른 상태가 이어지도록
function daily(d) {
  const dn = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
  return {dn, st: STATES[ORDER[dn % 6]], fact: FACT[dn % FACT.length], wx: ((dn * 5) % 7 - 3) * 0.4};
}
const S = {boost: 0, to: 0, flash: 0};   // 용암 보기 세기(0~1) · 분화 번쩍임

start({
  key: 'volcano', title: '화산 관측소', enter: '헬멧 쓰고 나가기', time: 'night', nickIcon: '🌋',
  nick: [['밤샘 중인', '헬멧 쓴', '장갑 낀', '붉은 빛 쬐는', '측정 중인', '커피 식은'], ['지진계', '시료병', '쌍안경', '관측봉', '방진마스크', '일지']],
  intro: '<p>멀리 화산이 붉게 숨 쉬는 관측소 앞마당.<br>용암 줄기 보고, 지진계 바늘 보고, 일지 한 줄 적고 가요.</p>',
  floor: {w: 26, d: 16, c1: '#322b2c', c2: '#3f3637', around: '#241c1e'},
  bg: {night: 0x140d14}, startPos: [0, 5], cam: {h: 9, back: 13},
  playerLook: {coat: 0xe0702a, pants: 0x2b2f3a, hat: {type: 'cap', c: 0xf2c230}},
  build(c) {
    const {box, cyl, ball, glowBall, sign, solid, fx, THREE, scene, npc} = c;
    const grp = (x, y, z) => { const g = new THREE.Group(); g.position.set(x, y, z); scene.add(g); return g; };
    const D = daily(c.now()), st = D.st;

    /* 화산 — 낮고 넓게(카메라 위쪽 끝에 걸리도록). 꼭대기엔 용암 호수, 비탈엔 붉은 줄기 */
    const VZ = -19, TOPR = 2.2, BASER = 11, VH = 5.5;
    const surf = (x, z) => { const r = Math.hypot(x, z - VZ); return r <= TOPR ? VH : r >= BASER ? 0 : VH * (BASER - r) / (BASER - TOPR); };
    cyl(TOPR, BASER, VH, 0x3a2c30, 0, VH / 2, VZ, undefined, 16);
    cyl(1.4, 5, 2.6, 0x33272b, -12, 1.3, -13.5, undefined, 12); cyl(1, 4, 2, 0x33272b, 13, 1, -14, undefined, 12);
    const pool = glowBall(1.9, 0xff6a20, 0, VH + 0.08, VZ, 0); pool.scale.y = 0.18;
    const lavaLight = new THREE.PointLight(0xff5a1f, 60, 40); lavaLight.position.set(0, VH + 1.5, VZ + 2); scene.add(lavaLight);
    const yardLight = new THREE.PointLight(0xff5a20, 14, 26); yardLight.position.set(0, 3.5, -6.5); scene.add(yardLight);
    const ANG = [-0.95, -0.5, -0.15, 0.2, 0.55, 0.95], LEN0 = [.55, .8, .65, .9, .7, .5];
    const streams = ANG.map((a, i) => { const segs = [];
      for (let j = 0; j < 16; j++) { const k = j / 15, r = TOPR + (BASER - TOPR) * k + 0.15, x = r * Math.sin(a) + Math.sin(j * .9 + i * 2) * .25 * k, z = VZ + r * Math.cos(a);
        const col = new THREE.Color(0xffe070).lerp(new THREE.Color(0xc02a10), Math.pow(k, .7)).getHex();
        const m = glowBall(0.3 - k * .08, col, x, surf(x, z) + 0.12, z, 0); m.scale.set(1, .45, 1.5); m.visible = false; segs.push(m); }
      return {segs, ph: i * 1.3}; });

    /* 연기 — 바람 쪽으로 눕는다. 불그스름하게 시작해 식으며 회색으로 */
    const TONE = new THREE.Color(st.tone), HOT = new THREE.Color(0xb06048), puffs = [];
    for (let i = 0; i < 22; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(.5, 8, 6), new THREE.MeshBasicMaterial({color: 0x999999, transparent: true, opacity: 0, depthWrite: false}));
      m.visible = false; scene.add(m); puffs.push({m, age: 9, life: 6, x: 0, y: 0, z: 0, s: 1}); }
    let acc = 0;
    // 분화 불꽃 — 비탈을 굴러 내려온다
    const sparks = []; for (let i = 0; i < 26; i++) { const m = glowBall(.14, 0xff9030, 0, -9, 0, 0); m.visible = false; sparks.push({m, vx: 0, vy: 0, vz: 0, on: false}); }
    function burst() { S.flash = 1; acc += 3;
      for (const p of sparks) { if (p.on) continue; p.on = true; p.m.visible = true; p.m.position.set((Math.random() - .5) * 1.6, VH + .2, VZ + (Math.random() - .5) * 1.6);
        p.vx = (Math.random() - .5) * 5; p.vy = 3 + Math.random() * 3; p.vz = .5 + Math.random() * 3.5; } }
    let nextErupt = st.erupt ? 3 + Math.random() * 3 : Infinity;
    // 재 — 재가 날리는 날만 마당에 내려온다
    const NA = 260, ag = new THREE.BufferGeometry(), ap = new Float32Array(NA * 3);
    for (let i = 0; i < NA; i++) { ap[i * 3] = (Math.random() - .5) * 28; ap[i * 3 + 1] = Math.random() * 7; ap[i * 3 + 2] = (Math.random() - .5) * 16; }
    ag.setAttribute('position', new THREE.BufferAttribute(ap, 3));
    const ashPts = new THREE.Points(ag, new THREE.PointsMaterial({color: 0xb0aaa8, size: 2.5, sizeAttenuation: false, transparent: true, opacity: .7})); ashPts.visible = st.ash > 0; scene.add(ashPts);

    /* 관측소 앞마당 — 건물(왼쪽 뒤) */
    box(6, 2.6, 3, 0x6a6e76, -7, 1.3, -5.2); box(6.2, 0.14, 3.2, 0x3a3e46, -7, 2.67, -5.2); solid(-7, -5.2, 6, 3);
    for (const x of [-8.6, -5.4]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.7), new THREE.MeshBasicMaterial({color: 0xf2b45a})); w.position.set(x, 1.6, -3.69); scene.add(w); }
    const dr = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.7), new THREE.MeshBasicMaterial({color: 0xd9902a})); dr.position.set(-7, 0.85, -3.69); scene.add(dr);
    sign(['화산 관측소', '관측 1호동'], 3.4, 0.8, '#f4ecdc', '#7a2a22', -7, 2.2, -3.68, 0, [38, 22]);
    // 울타리 + 경고판
    for (let x = -12; x <= 12; x += 2) cyl(0.04, 0.04, 1.1, 0x9aa0a8, x, 0.55, -7.4, undefined, 6);
    box(24.2, 0.04, 0.04, 0x9aa0a8, 0, 0.5, -7.4); box(24.2, 0.04, 0.04, 0x9aa0a8, 0, 1.0, -7.4);
    sign(['낙석·가스 주의', '이 너머 출입 금지'], 3.2, 0.8, '#e8c030', '#2b2620', 4.5, 0.75, -7.34, 0, [34, 22]);
    // 쌍안경 받침(용암 보기)
    const scope = grp(2.5, 0, -5.8);
    for (const [dx, dz] of [[-.3, .2], [.3, .2], [0, -.3]]) { const l = cyl(0.03, 0.03, 1.5, 0x555b63, dx * .6, 0.7, dz * .6, scope, 6); l.rotation.z = -dx * .5; l.rotation.x = dz * .5; }
    const tube = grp(0, 1.5, 0); scope.add(tube); tube.rotation.x = -Math.PI / 2 + 0.3; cyl(0.12, 0.16, 1.1, 0x2b3038, 0, 0.3, 0, tube); cyl(0.17, 0.17, 0.1, 0x8a8e96, 0, -.3, 0, tube); solid(2.5, -5.8, 0.8, 0.8);
    // 일지 책상 + 스탠드 등
    box(1.6, 0.1, 0.8, 0x7a6048, -1.5, 0.85, -5.8); for (const dx of [-.7, .7]) box(0.08, 0.85, 0.7, 0x5a4634, -1.5 + dx, 0.42, -5.8); solid(-1.5, -5.8, 1.6, 0.8);
    box(0.5, 0.05, 0.38, 0xf0e8d4, -1.7, 0.93, -5.7); box(0.5, 0.03, 0.38, 0xa8322a, -1.7, 0.9, -5.7); box(0.3, 0.04, 0.2, 0x333840, -1.1, 0.92, -5.9);
    glowBall(0.1, 0xffd27a, -.95, 1.35, -5.95, 0); cyl(0.02, 0.02, 0.5, 0x555b63, -.95, 1.1, -5.95, undefined, 6);
    // 지진계 — 종이 두루마리 통 + 흔들리는 펜대
    box(2, 0.9, 1, 0x5a6068, 7.5, 0.45, -5.6); box(1.8, 0.08, 0.9, 0xb8bcc2, 7.5, 0.94, -5.6); solid(7.5, -5.6, 2, 1);
    const drum = cyl(0.22, 0.22, 1.2, 0xf4f0e0, 7.5, 1.26, -5.6); drum.rotation.z = Math.PI / 2;
    const arm = grp(7.5, 1.05, -5.2); box(0.04, 0.04, 0.8, 0xc9472f, 0, 0, -.4, arm);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.4), new THREE.MeshBasicMaterial({color: 0x6ad08a})); scr.position.set(8.4, 1.4, -5.1); scr.rotation.y = -0.3; scene.add(scr);
    // 화산재 받이 — 낮은 평상 위 넓은 쟁반
    for (const [dx, dz] of [[-.6, -.4], [.6, -.4], [-.6, .4], [.6, .4]]) cyl(0.04, 0.04, 0.75, 0x6a6e76, -6.5 + dx, 0.37, 1.5 + dz, undefined, 6);
    box(1.5, 0.1, 1, 0x8a9098, -6.5, 0.78, 1.5); box(1.3, 0.05, 0.8, st.ash ? 0x9a9698 : 0x77747a, -6.5, 0.85, 1.5); solid(-6.5, 1.5, 1.5, 1);
    // 바람자루(풍향·풍속) · 안테나(깜빡이는 붉은 등)
    cyl(0.05, 0.05, 3.4, 0xb8bcc2, 11, 1.7, -3, undefined, 6);
    const sock = grp(11, 3.3, -3); sock.rotation.y = -Math.atan2(1.3, D.wx); const sk = cyl(0.1, 0.3, 1.1, 0xe8732a, 0.55, 0, 0, sock, 8); sk.rotation.z = -Math.PI / 2;
    cyl(0.07, 0.07, 5, 0x8a9098, -11.5, 2.5, -6, undefined, 6); const blink = glowBall(0.14, 0xff3030, -11.5, 5.1, -6, 0);
    // 돌덩이 · 주황 안전 삼각뿔
    for (const [x, z, r] of [[-11, 3, .7], [10.5, 4, .9], [-3.5, -2, .35], [5, -2.5, .4], [11.8, -6, .8]]) { const m = ball(r, 0x2a2428, x, r * .4, z); m.scale.y = .6; }
    for (const [x, z] of [[4.6, -3.8], [-4.2, -3.2], [9.6, -3.6]]) cyl(0.02, 0.2, 0.55, 0xe8732a, x, 0.28, z, undefined, 8);
    // 사람 — 쌍안경 옆 연구원, 마당 가장자리를 오가는 연구원
    const cap = {type: 'cap', c: 0xf2c230};
    npc({coat: 0x2f6f6a, pants: 0x2b2f3a, hat: cap, glasses: true}, [[3.7, -4.7]], {face: Math.PI, idle: ['sip', 'stretch']});
    npc({coat: 0xc9472f, pants: 0x2b2f3a, hat: cap}, [[-10.8, -1.5], [-10.8, 5.5]], {speed: 1.5, idle: ['wave', 'stretch']});

    /* 매 프레임 */
    fx.push((dt, t) => {
      // 용암 줄기 — 오늘 상태만큼 내려와 있고, 보는 동안 조금 더 내려온다
      S.boost += (S.to - S.boost) * Math.min(1, dt * (S.to > S.boost ? .5 : .25)); if (Math.abs(S.to - S.boost) < .005) S.boost = S.to;
      S.flash = Math.max(0, S.flash - dt * 1.5);
      streams.forEach((s, i) => { const len = Math.min(1, LEN0[i] * st.flow * (.9 + .1 * Math.sin(t * .3 + s.ph)) + S.boost * .45), n = Math.max(2, Math.round(len * 16));
        s.segs.forEach((m, j) => { m.visible = j < n; }); });
      lavaLight.intensity = 55 + 10 * Math.sin(t * 3.1) + 7 * Math.sin(t * 7.3) + S.flash * 80 + S.boost * 25;
      yardLight.intensity = 12 + 3 * Math.sin(t * 2.3) + S.flash * 14; pool.scale.x = 1 + Math.sin(t * 2) * .04;
      // 분화
      nextErupt -= dt; if (nextErupt <= 0) { burst(); nextErupt = st.erupt * (.8 + Math.random() * .5); }
      for (const p of sparks) { if (!p.on) continue; p.vy -= 7 * dt; const m = p.m.position; m.x += p.vx * dt; m.y += p.vy * dt; m.z += p.vz * dt;
        if (m.y < surf(m.x, m.z) + .05) { p.on = false; p.m.visible = false; } }
      // 연기
      acc += dt * (.5 + st.smoke * 3);
      if (acc >= 1) { acc -= 1; const p = puffs.find(q => q.age >= q.life); if (p) { p.age = 0; p.life = 5 + Math.random() * 2; p.x = (Math.random() - .5) * 1.2; p.y = VH + .3; p.z = VZ + (Math.random() - .5) * 1.2; p.s = .6 + Math.random() * .4; } }
      for (const p of puffs) { if (p.age >= p.life) { p.m.visible = false; continue; } p.age += dt; const k = p.age / p.life;
        p.x += D.wx * dt * (.5 + k); p.z += (1.2 + Math.abs(D.wx) * .2) * dt * (.6 + k); p.y += (.8 - k * .5) * dt;
        p.m.position.set(p.x, p.y, p.z); p.m.scale.setScalar(p.s * (1 + k * 3.2)); p.m.visible = true;
        p.m.material.opacity = Math.min(k * 6, 1) * (1 - k) * .55 * (.4 + st.smoke * .6); p.m.material.color.copy(TONE).lerp(HOT, Math.max(0, .6 - k)); }
      // 재
      if (ashPts.visible) { const a = ag.attributes.position.array;
        for (let i = 0; i < NA; i++) { let y = a[i * 3 + 1] - (.5 + (i % 5) * .08) * dt, x = a[i * 3] + D.wx * .4 * dt; if (y < 0) y = 7; if (x > 14) x -= 28; if (x < -14) x += 28; a[i * 3] = x; a[i * 3 + 1] = y; }
        ag.attributes.position.needsUpdate = true; }
      // 지진계 펜대 · 바람자루 · 안테나 불
      arm.rotation.y = Math.sin(t * 14) * (.05 + st.quake) + (Math.random() - .5) * .02;
      sk.rotation.x = Math.sin(t * 2.2) * .08; sock.rotation.z = Math.sin(t * 1.3) * .06;
      blink.visible = (t % 1.6) < .25;
    });
  },
  lamps: [[-1.5, -3], [7, -2.5], [-6, 3.5]],
  acts: [
    {id: 'lava', icon: '🔭', label: '용암 보기', spot: [2.5, -4.2], face: Math.PI, run(c, done) {
      c.doAct(c.player, 'crouch'); c.beep(160, .5, 0, 'sine', .03); S.to = 1; c.toast('쌍안경 너머로 붉은 줄기가 천천히 내려와요', 2800);
      setTimeout(() => { const n = c.count('lava'); c.toast(`🔥 ${LAVA[(n - 1) % LAVA.length]}`, 4200); }, 3200);
      setTimeout(() => { S.to = 0; done(); }, 7200); }},
    {id: 'seis', icon: '📈', label: '지진계', spot: [7.5, -4.2], face: Math.PI, run(c, done) {
      c.play(`<h3>지진계 바늘</h3><p style="font-size:13px;color:#7a6e5e">바늘이 크게 흔들릴 때 「지금!」을 눌러요. 작은 떨림엔 참아요.</p>
        <canvas id="cv" width="300" height="110" style="width:100%;max-width:300px;background:#fffaf0;border:1.5px solid #2b2620;border-radius:6px"></canvas>
        <p id="msg" style="min-height:22px;font-size:14px">큰 진동 0/5</p><div class="row" id="ro" style="justify-content:center"><button class="btn main" id="go">시작</button><button class="btn" id="qt">그만두기</button></div>`,
        (el, close) => {
          let dead = false, raf = 0, hits = 0, ended = false; const cv = el.querySelector('#cv'), g = cv.getContext('2d'), ro = el.querySelector('#ro'), msg = el.querySelector('#msg'), hist = new Array(300).fill(0);
          const draw = v => { hist.push(v); hist.shift(); g.fillStyle = '#fffaf0'; g.fillRect(0, 0, 300, 110); g.strokeStyle = '#d9a090'; g.setLineDash([4, 4]);
            for (const y of [55 - 36, 55 + 36]) { g.beginPath(); g.moveTo(0, y); g.lineTo(300, y); g.stroke(); }
            g.setLineDash([]); g.strokeStyle = '#2b2620'; g.lineWidth = 1.5; g.beginPath(); hist.forEach((h, i) => i ? g.lineTo(i, 55 - h * 50) : g.moveTo(0, 55 - h * 50)); g.stroke();
            g.fillStyle = '#c9472f'; g.beginPath(); g.arc(299, 55 - v * 50, 4, 0, 7); g.fill(); };
          const quit = () => { dead = true; cancelAnimationFrame(raf); close(); done(); };
          el.querySelector('#qt').onclick = quit; el.querySelector('#go').onclick = () => {
            ro.innerHTML = '<button class="btn main" id="tap" style="min-width:120px;font-size:17px">지금!</button><button class="btn" id="qt2">그만두기</button>'; el.querySelector('#qt2').onclick = quit;
            const BT = [3.2, 7.4, 11.8, 16.2, 20.6].map(x => x + Math.random() * 1.4), DUR = 1.5, END = 25, got = [0, 0, 0, 0, 0], t0 = performance.now(); let env = 0;
            el.querySelector('#tap').onpointerdown = () => { if (dead || ended) return;
              if (env > .55) { const i = BT.findIndex((b, k) => !got[k] && (performance.now() - t0) / 1000 >= b && (performance.now() - t0) / 1000 <= b + DUR);
                if (i >= 0) { got[i] = 1; hits++; c.beep(1100, .08, 0, 'sine', .06); msg.textContent = `포착! 큰 진동 ${hits}/5`; return; } }
              c.beep(220, .08, 0, 'square', .03); msg.textContent = `작은 떨림이었어요. 큰 진동 ${hits}/5`; };
            const loop = () => { if (dead) return; const t = (performance.now() - t0) / 1000; env = 0;
              for (const b of BT) if (t >= b && t <= b + DUR) env = Math.max(env, Math.sin(Math.PI * (t - b) / DUR));
              const quiet = .15 + .1 * Math.abs(Math.sin(t * 1.7)), A = quiet + (.95 - quiet) * env; draw(A * Math.sin(t * 19) + (Math.random() - .5) * .06);
              if (t >= END) { ended = true; dead = true; c.count('seis'); c.DB.seisBest = Math.max(c.DB.seisBest || 0, hits); c.save(); close();
                if (hits >= 4) { c.doAct(c.player, 'cheer'); c.stamp('큰 진동 포착', `${hits}/5`); } else c.toast(`📈 큰 진동 ${hits}/5. 바늘은 늘 한발 앞서요`);
                setTimeout(done, 1500); return; }
              raf = requestAnimationFrame(loop); };
            loop(); };
          draw(0);
        }); }},
    {id: 'ash', icon: '🧪', label: '화산재 채취', spot: [-6.5, 3], face: Math.PI, run(c, done) {
      c.doAct(c.player, 'crouch'); c.beep(220, .3, 0, 'sine', .03);
      setTimeout(() => {
        const got = new Set(c.DB.ashes || []), left = SAMPLES.filter(s => !got.has(s[0])), pool = left.length ? left : SAMPLES, s = pool[Math.random() * pool.length | 0], isNew = !got.has(s[0]);
        got.add(s[0]); c.DB.ashes = [...got]; c.count('ash'); c.save();
        const jar = new c.THREE.Group(); c.cyl(.1, .1, .26, 0xcfe0e8, 0, 0, 0, jar); c.cyl(.085, .085, .14, s[2], 0, -.05, 0, jar); c.cyl(.11, .11, .05, 0x6a4a2a, 0, .15, 0, jar);
        c.hand.add(jar); c.doAct(c.player, 'cheer'); c.toast(`🧪 ${s[0]} — ${s[1]}`, 3800);
        if (isNew && got.size === SAMPLES.length) setTimeout(() => c.stamp('시료 5종', '화산이 남긴 걸 다 모았어요'), 700);
        setTimeout(() => { c.hand.remove(jar); done(); }, 2400); }, 1800); }},
    {id: 'log', icon: '📓', label: '관측 일지', spot: [-1.5, -4.4], face: Math.PI, run(c, done) {
      const d = c.now(), D = daily(d), key = c.dkey(d); c.DB.logs = c.DB.logs || {}; const prev = c.DB.logs[key]; c.beep(700, .05);
      c.dialog('관측 일지', `${c.hm(d)} · ${c.visits()}번째 온 날`,
        `<p><b>오늘의 화산: ${D.st.n}</b></p><p style="font-size:13px;color:#7a6e5e">${D.st.note}</p><p style="font-size:15px">「${D.fact}」</p>` +
        (prev ? `<p style="font-size:13px;color:#7a6e5e">오늘 적은 줄: ${prev}</p>` : '') + '<p style="font-size:13px;margin-bottom:0">한 줄 남기기</p>',
        [...NOTES.map(t => [t, () => { c.DB.logs[key] = t; c.count('log'); c.stamp('기록 완료', `「${t}」`); setTimeout(done, 1200); }]), ['덮기', done]]); }},
  ],
  recExtra: c => { const L = c.DB.logs || {}, ks = Object.keys(L).sort().slice(-3).reverse();
    return `<p style="font-size:13px;color:#7a6e5e">모은 시료 ${(c.DB.ashes || []).length}/${SAMPLES.length}종: ${(c.DB.ashes || []).join(' · ') || '아직 없음'}<br>지진계 큰 진동 최고 ${c.DB.seisBest || 0}/5<br>${ks.map(k => k.slice(5) + ' ' + L[k]).join('<br>') || '일지는 아직 비어 있어요'}</p>`; },
  onEnter(c) { const D = daily(c.now()); c.toast(c.visits() > 1 ? `🌋 ${c.visits()}번째 야간 근무. 오늘 화산은 「${D.st.n}」` : `🌋 오늘 화산은 「${D.st.n}」. 멀리서 붉게 숨 쉬어요`, 3200); },
});
</script></body></html>
