        const m = box(Math.hypot(x1 - x0, y1 - y0) + 0.02, 0.035, 0.035, 0x6b5a4a, (x0 + x1) / 2, (y0 + y1) / 2, 0, g); m.rotation.z = Math.atan2(y1 - y0, x1 - x0); }

      const n = c.count('tea');
      setTimeout(() => { c.hand.remove(cup);
        if (n === 3) c.stamp('세 잔째', '셰르파가 한 잔 더 따라 줬어요');
        else c.toast(n === 1 ? '🍵 버터차예요. 차에 야크 버터와 소금을 넣어요. 짭짤해서 처음엔 놀라요' : n === 2 ? '🍵 두 잔째 — 어느새 입에 맞아요' : `🍵 ${n}잔째… 주전자가 비어 가요`, 3200);
        setTimeout(done, 900); }, 2300); }},
    {id: 'flag', icon: '🚩', label: '깃발 걸기', spot: [-8.6, 2], face: -Math.PI / 2, run(c, done) {
      const base = 5 * Math.min(c.DB.total.flag || 0, 1); let i = 0;
      c.toast('🚩 파랑, 하양, 빨강, 초록, 노랑 순서로 걸어요', 1500);
      const step = () => {
        if (i >= 5) { const n = c.count('flag'); c.doAct(c.player, 'cheer'); c.stamp('다섯 빛깔', `오늘 ${n}번째 줄`);
          setTimeout(() => c.toast('🚩 바람이 기도를 멀리 실어 간다고 해요', 3000), 1200); setTimeout(done, 1800); return; }
        const f = S.mine[base + i]; if (f) f.piv.visible = true;
        c.doAct(c.player, 'throw'); c.beep(500 + i * 90, .05, 0, 'sine', .04); c.toast(`🚩 ${FL[i][0]} — ${FL[i][1]}`, 1100); i++; setTimeout(step, 1000);
      };
      setTimeout(step, 1500); }},
    {id: 'view', icon: '🔭', label: '정상 날씨', spot: [6, -2.2], face: Math.PI, run(c, done) {
      const d = c.now(), D = daily(d), first = !c.today().view; c.doAct(c.player, 'crouch'); c.beep(1500, .05); c.count('view');
      const verdict = D.w >= 24 ? '정상 쪽이 몹시 사나워요. 오늘은 베이스캠프에서 구경만 해요.' : D.w >= 16 ? '바람이 센 편이에요. 서두르지 말아요.' : '비교적 잔잔한 날이에요. 이런 날을 기다리는 거죠.';
      setTimeout(() => c.dialog('오늘의 정상 날씨', `${c.hm(d)} · ${c.visits()}번째 온 날`,
        `<p style="font-size:28px;margin:4px 0"><b>${MI}${-D.t}°C</b></p><p style="font-size:13px;color:#7a6e5e;margin:0">바람 초속 ${D.w}m · 체감 ${MI}${-D.chill}°C</p>
         <p style="font-size:15px">${verdict}</p><p style="font-size:16px">「${FACT[D.dn % FACT.length]}」</p>
         <p style="color:#7a6e5e;font-size:12px">실제 관측값이 아니라 이 놀이 속 오늘의 날씨예요.${first ? '' : ' 하루에 하나, 내일 또 와요.'}</p>`, [['내려오기', done, 'main']]), 1000); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">걸어 둔 깃발 ${c.DB.total.flag || 0}줄 · 숨 고르기 최고 ${c.DB.breathBest || 0}/5<br>오늘 정상 바람 초속 ${daily(c.now()).w}m</p>`,
  onEnter(c) { c.toast(c.visits() > 1 ? `🏔 ${c.visits()}번째 날. 오늘도 공기가 얇아요` : '🏔 해발 5,300m대. 천천히 걸어요', 3000); },
});
</script></body></html>
