function daily(d) {

}

start({

    box(30, 1.2, 11.5, WALL, 0, 9.6, -7.25);

    for (let i = 0; i < 16; i++) { const L = 1 + R() * 2, r = 0.12 + L * 0.07, x = -13 + R() * 26, z = -12 + R() * 6.4; if (Math.abs(x - 7) < 1.5 && Math.abs(z + 4.5) < 2) continue; cyl(r, 0.03, L, CAL, x, 9 - L / 2, z); }
    // 지하 물웅덩이 — 오른쪽, 위 종유석에서 물방울이 떨어진다
    const PX = 7, PZ = -4.5;
    const pool = new THREE.Mesh(new THREE.CircleGeometry(2.7, 36), new THREE.MeshPhongMaterial({color: 0x0b2a38, specular: 0xaaccdd, shininess: 90, transparent: true, opacity: 0.88}));
    pool.rotation.x = -Math.PI / 2; pool.position.set(PX, 0.04, PZ); scene.add(pool); solid(PX, PZ, 4.8, 4.8);
    for (let i = 0; i < 15; i++) { const a = i / 15 * Math.PI * 2, r = 2.75 + R() * 0.3; ball(0.35 + R() * 0.25, ROCK, PX + Math.cos(a) * r, 0.15, PZ + Math.sin(a) * r).scale.y = 0.6; }
    cyl(0.3, 0.04, 1.8, CAL, PX, 8.1, PZ);

    // 낮은 바위 턱 — 아래로 종유석 하나(오늘 잴 것), 그 아래 석순. 박쥐 몇 마리가 매달려 있다

    const bat = open => { const g = new THREE.Group(), wl = grp(0, 0, 0), wr = grp(0, 0, 0); g.add(wl, wr); wl.position.x = -0.1; wr.position.x = 0.1;
      const b = ball(0.15, 0x4a3f48, 0, 0, 0, g); b.scale.set(1, 0.9, 1.5); ball(0.09, 0x4a3f48, 0, 0.02, 0.2, g);
      box(0.6, 0.02, 0.3, 0x3a3038, -0.3, 0, 0, wl); box(0.6, 0.02, 0.3, 0x3a3038, 0.3, 0, 0, wr);
      if (!open) { wl.scale.x = wr.scale.x = 0.3; wl.rotation.z = 1.2; wr.rotation.z = -1.2; } g.userData.w = [wl, wr]; return g; };
    for (const [x, z] of [[-9.8, -3.9], [-9.3, -4.4], [-6.9, -4.1], [-7.4, -4.7]]) { const b = bat(false); b.position.set(x, 3.03, z); b.rotation.x = Math.PI; scene.add(b); }
    // 줄자 — 종유석 옆으로 내려온다(재기 단추)
    const TX = -7.85, TZ = -3.15, tape = box(0.05, 1, 0.03, 0xf2c230, TX, 3.2, TZ), ticks = [];
    for (let i = 1; i <= 24; i++) ticks.push(box(0.14, 0.012, 0.04, 0x2b2620, TX, 3.2 - i * 0.1, TZ + 0.01));
    ball(0.08, 0xf2c230, TX, 3.18, TZ);
    // 매 프레임 — 헤드램프 · 물방울 · 물결 · 지나가는 박쥐 · 줄자
    const drops = [], rips = [], dGeo = new THREE.SphereGeometry(0.07, 8, 6), dMat = new THREE.MeshPhongMaterial({color: 0xcfe8ff, specular: 0xffffff, shininess: 100});
    const rGeo = new THREE.RingGeometry(0.1, 0.14, 28), flier = bat(true); flier.visible = false; scene.add(flier);
    let tNext = 1, fT = 5, fOn = false, fDir = 1;
    fx.push((dt, t) => {
      S.lamp += (S.to - S.lamp) * Math.min(1, dt * (S.to ? 14 : 10)); if (Math.abs(S.to - S.lamp) < 0.01) S.lamp = S.to;
      lamp.intensity = 160 * S.lamp * (S.lamp === 1 ? 1 + Math.sin(t * 23) * 0.012 : 1); hemi.intensity = 0.22 * S.lamp; sun.intensity = 0; bead.visible = S.lamp > 0.4;
      if (scene.fog) { scene.fog.near = 8; scene.fog.far = 42; }
      tNext -= dt;
      if (S.listen > 0) { S.lt -= dt; if (S.lt <= 0) { S.lt = S.gap; S.listen--; spawn(true); } }
      else if (tNext <= 0) { tNext = D.drip * (0.7 + Math.random() * 0.6); spawn(false); }
      for (let i = drops.length - 1; i >= 0; i--) { const q = drops[i]; q.v += 9 * dt; q.m.position.y -= q.v * dt;
        if (q.m.position.y <= 0.06) { scene.remove(q.m); drops.splice(i, 1); ripple(); if (q.loud) { c.beep(1700, 0.06, 0, 'sine', 0.05); c.beep(1500, 0.05, 0.2, 'sine', 0.025); c.beep(1400, 0.05, 0.42, 'sine', 0.012); } } }
      for (let i = rips.length - 1; i >= 0; i--) { const q = rips[i]; q.age += dt; const s = 1 + q.age * 7; q.m.scale.set(s, s, s); q.m.material.opacity = 0.6 * (1 - q.age / 1.6);
        if (q.age > 1.6) { scene.remove(q.m); q.m.material.dispose(); rips.splice(i, 1); } }
      fT -= dt;
      if (!fOn && fT <= 0) { fOn = true; fDir = Math.random() < 0.5 ? 1 : -1; flier.position.set(-fDir * 16, 4 + Math.random() * 2.5, -8 + Math.random() * 9); flier.rotation.y = fDir * Math.PI / 2; flier.visible = true; }

      S.tape += Math.sign(S.tapeTo - S.tape) * Math.min(Math.abs(S.tapeTo - S.tape), dt * 0.45);
      const h = H * S.tape; tape.visible = S.tape > 0.001; tape.scale.y = Math.max(h, 0.001); tape.position.y = 3.2 - h / 2; ticks.forEach((m, i) => m.visible = (i + 1) * 0.1 <= h);

  lamps: [],

        (el, close) => {

            setTimeout(() => { if (dead || !el.isConnected) return; msg.textContent = '박쥐는 모두 몇 마리였을까요?';

        }); }},
    {id: 'dark', icon: '🌑', label: '불 끄기', run(c, done) {
      const D = daily(c.now()); c.toast('🔦 헤드램프를 꺼요. 가만히 있어 봐요', 1800); S.to = 0; S.listen = 4; S.gap = 1.3; S.lt = 1.6;
      setTimeout(() => { S.to = 1; c.doAct(c.player, 'stretch'); const n = c.count('dark'); c.stamp('다시 켰다', `캄캄한 5초 · 오늘 ${n}번째`); c.toast('🌑 ' + pick(DARK, D, 1), 5200); setTimeout(done, 2400); }, 6000); }},
    {id: 'len', icon: '📏', label: '종유석 재기', spot: [-6.3, -2], face: -2.2, run(c, done) {
      const D = daily(c.now()); c.doAct(c.player, 'stretch'); S.tapeTo = 1; for (let i = 0; i < 6; i++) c.beep(2200, .03, i * .4, 'square', .025);
      setTimeout(() => {
        const n = c.count('len'); c.DB.meas = c.DB.meas || {}; c.DB.meas[c.dkey(c.now())] = D.len; c.save(); if (n === 1) c.stamp(D.len + 'cm', '오늘 잰 종유석');
        c.dialog('종유석 재기', D.name + ' · 오늘 잰 한 개', `<p style="font-size:26px;margin:4px 0"><b>${D.len} cm</b></p>
          <p style="font-size:13px;color:#7a6e5e;margin:0">1cm 자라는 데 50년쯤 걸린다고 어림하면, 이 종유석은 ${(D.len * 50).toLocaleString('ko-KR')}년쯤 걸려 자란 셈이에요.</p>
          <p style="font-size:15px">「${pick(LEN, D, 2)}」</p>`, [['줄자 감기', () => { S.tapeTo = 0; done(); }, 'main']]); }, 2800); }},
  ],
  recExtra: c => { const m = c.DB.meas || {}, ks = Object.keys(m), sum = ks.reduce((a, k) => a + m[k], 0);
    return `<p style="font-size:13px;color:#7a6e5e">다녀온 갈래 ${(c.DB.br || []).length}/${BR.length}곳 · 잰 종유석 ${ks.length}개(합쳐 ${(sum / 100).toFixed(1)}m)<br>박쥐 세기 맞힌 횟수 ${c.DB.batOk || 0}번</p>`; },
  onEnter(c) { const D = daily(c.now()); c.DB.br = [...new Set([...(c.DB.br || []), D.name])]; c.save();
    c.toast(`🔦 오늘은 「${D.name}」 — ${D.hint}`, 3600); },
});
</script></body></html>
