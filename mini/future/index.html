    sign(['날씨 창'], 1.5, .5, '#10203a', '#7fe9ff', 9, 2.6, 1, 0, [52]);
    const WN = 650, wpos = new Float32Array(WN * 3);
    for (let i = 0; i < WN; i++) { wpos[i * 3] = (Math.random() - .5) * 34; wpos[i * 3 + 1] = Math.random() * 11; wpos[i * 3 + 2] = (Math.random() - .5) * 28; }
    const wgeo = new THREE.BufferGeometry(); wgeo.setAttribute('position', new THREE.BufferAttribute(wpos, 3));
    const wmat = new THREE.PointsMaterial({color: 0x9fd0ff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: .8}), wpts = new THREE.Points(wgeo, wmat); wpts.frustumCulled = false; wpts.visible = false; scene.add(wpts);
    let W = 'clear';
    c.setW = w => { W = w; wpts.visible = w !== 'clear'; wmat.color.setHex(w === 'rain' ? 0x9fd0ff : 0xffffff); wmat.size = w === 'rain' ? 1.6 : 3.2; };
    fx.push((dt, t) => { if (W === 'clear') return; const a = wgeo.attributes.position.array;
      for (let i = 0; i < WN; i++) { a[i * 3 + 1] -= (W === 'rain' ? 15 : .8 + (i % 5) * .25) * dt; if (W === 'snow') a[i * 3] += Math.sin(t + i) * .4 * dt;
        if (a[i * 3 + 1] < 0) { a[i * 3 + 1] = 11; a[i * 3] = (Math.random() - .5) * 34; a[i * 3 + 2] = (Math.random() - .5) * 28; } }
      wgeo.attributes.position.needsUpdate = true; });
    if (c.DB.wd === c.dkey(c.now())) c.setW(c.DB.w);

    /* 벤치 · 네온 · 사람들 */
    for (const x of [-3.2, 3.2]) { box(2.2, .12, .7, 0x4a5568, x, .5, -2.3); box(2.2, .6, .1, 0x4a5568, x, .85, -2.65); box(.12, .5, .6, 0x2a3040, x - .9, .25, -2.3); box(.12, .5, .6, 0x2a3040, x + .9, .25, -2.3); solid(x, -2.3, 2.4, .9); }
    sign(['SKY STOP 07', '서울 하늘 정류장'], 7, 1.8, '#0a1226', '#4ff0ff', 0, 5.6, -9.6, 0, [64, 36]);
    box(.12, 5, .12, 0x8a95a8, -3.6, 2.5, -9.6); box(.12, 5, .12, 0x8a95a8, 3.6, 2.5, -9.6);
    nlight(0x4ff0ff, -7, 3, -6); nlight(0xff4fd8, 7, 3, -5); nlight(0x4ff0ff, -7, 3, 3); nlight(0xff9a3a, 0, 4, 5);
    npc({coat: 0x6a4a8a, scarf: 0xff6fb0, hairStyle: 'bob', hair: 0x2a1a3a}, [[-9.8, 4.2]], {face: 2.0, idle: ['wave', 'stretch']});
    npc({coat: 0x2a8a8a, goggles: true}, [[-5, 6.8], [5, 6.8]], {wait: 4, speed: 1.8});
  },
  lamps: [],
  acts: [
    {id: 'taxi', icon: '🚖', label: '택시', spot: [-4.2, 3], face: -Math.PI / 2, run(c, done) {
      const n = c.count('taxi'), P = c.player;
      c.toast('📡 하늘 택시를 불렀어요', 2000); c.beep(520, .1, 0, 'sine'); c.beep(780, .12, .12, 'sine');
      c.fly('in', () => { c.toast('🚖 도착했어요. 타세요', 1600);
        c.goTo(-5.4, 3, () => { P.position.y = .69; c.goTo(-7, 3, () => { P.rotation.y = Math.PI;
          setTimeout(() => { c.beep(300, .5, 0, 'sine', .06);
            c.fly('ride', () => { P.position.set(-7, .69, 3);
              c.goTo(-5.4, 3, () => { P.position.y = 0; c.goTo(-4.2, 3, () => { c.stamp('한 바퀴', n === 1 ? '첫 비행' : `오늘 ${n}번째`); c.fly('out'); setTimeout(done, 900); }); }); });
            setTimeout(() => c.toast('🌃 아래 불빛은 전부 창문이에요', 2600), 1500);
            setTimeout(() => c.doAct(P, 'cheer'), 4500);
            setTimeout(() => c.toast('🚖 ' + RIDE_FACT[(n - 1) % RIDE_FACT.length], 4200), 6500);
          }, 500); }); }); }); }},
    {id: 'coffee', icon: '☕', label: '커피', spot: [7, -4.7], face: Math.PI, run(c, done) {
      const ING = ['원두', '물', '우유', '얼음', '시럽', '뚜껑'], pick = [...ING].sort(() => Math.random() - .5).slice(0, 4), menu = MENU[dayNum(c.now()) % MENU.length];
      c.robot.say('talk'); c.robot.wave(1.6); c.beep(700, .08, 0, 'sine');
      c.play(`<h3>카페-7 의 주문</h3><p style="font-size:13px;color:#7a6e5e">오늘의 메뉴 「${menu}」 · 말한 순서대로 재료를 눌러요</p>
        <div id="ord" style="font-size:17px;font-weight:800;min-height:30px;margin:8px 0"></div>
        <div style="height:6px;background:#d9ceb8;border-radius:3px;overflow:hidden"><i id="bar" style="display:block;height:100%;width:100%;background:#c9472f"></i></div>
        <div id="pad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px"></div>
        <p id="msg" style="min-height:22px;font-size:14px;margin:4px 0"></p>
        <div class="row" style="justify-content:center"><button class="btn" id="again">다시 듣기</button><button class="btn" id="quit">그만두기</button></div>`,
        (el, close) => {
          const $q = s => el.querySelector(s), pad = $q('#pad'); let k = 0, live = true, hear = false, tm;
          const listen = sec => { k = 0; hear = true; $q('#ord').textContent = pick.join(' → '); pad.style.opacity = .35; c.robot.say('talk');
            const bar = $q('#bar'); bar.style.transition = 'none'; bar.style.width = '100%';
            requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${sec}s linear`; bar.style.width = '0'; }));
            clearTimeout(tm); tm = setTimeout(() => { if (!live) return; hear = false; $q('#ord').textContent = '? → ? → ? → ?'; pad.style.opacity = 1; $q('#msg').textContent = '이제 눌러요'; c.robot.say('hmm'); }, sec * 1000); };
          const press = n => { if (hear || !live) return;
            if (n !== pick[k]) { c.beep(180, .2, 0, 'sawtooth'); c.robot.say('err'); $q('#msg').textContent = '앗, 순서가 달라요. 다시 들려줄게요'; listen(3); return; }
            k++; c.beep(500 + k * 120, .1, 0, 'sine'); $q('#ord').textContent = pick.map((p, i) => i < k ? p : '?').join(' → ');
            if (k === pick.length) { live = false; clearTimeout(tm); win(); } };
          const win = () => { const n = c.count('coffee'); c.robot.say('ok'); c.robot.wave(2.6); c.beep(900, .1); c.beep(1200, .14, .1);
            const cup = new c.THREE.Group(); c.cyl(.1, .08, .22, 0xf4ecdc, 0, .1, 0, cup); c.hand.add(cup);
            close(); c.busy = true; c.doAct(c.player, 'sip'); c.stamp('☕', menu); c.toast(`☕ 「${menu}」 나왔습니다. ` + COFFEE_FACT[(n - 1) % COFFEE_FACT.length], 4200);
            setTimeout(() => { c.hand.remove(cup); c.robot.say('idle'); done(); }, 2600); };
          pad.innerHTML = ''; ING.forEach(n => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = n; b.style.padding = '14px 0'; b.onclick = () => press(n); pad.appendChild(b); });
          $q('#again').onclick = () => { if (live && !hear) listen(3); };
          $q('#quit').onclick = () => { live = false; clearTimeout(tm); c.robot.say('idle'); close(); done(); };
          listen(4.5);
        }); }},
    {id: 'museum', icon: '🏛', label: '옛날 물건', spot: [-7, -4.6], face: Math.PI, run(c, done) {
      const it = c.todayItem, got = new Set(c.DB.museum || []), isNew = !got.has(it.n); got.add(it.n); c.DB.museum = [...got]; c.count('museum');
      c.dialog('오늘의 전시 · ' + it.n, `2020년대 관 · 모은 물건 ${got.size}/${ITEMS.length}`,
        `<p style="font-size:16px">${it.d}</p><p style="font-size:13px;color:#7a6e5e">사실 하나 — ${it.f}</p>` + (isNew ? '<p style="font-size:13px;color:#c9472f">새로 본 물건이에요</p>' : '') + '<p style="font-size:12px;color:#7a6e5e">전시는 하루에 하나. 내일은 다른 물건.</p>',
        [['다음에 또', done, 'main']]); }},
    {id: 'weather', icon: '🌦', label: '날씨 창', spot: [7.4, 1], face: Math.PI / 2, run(c, done) {
      const pickW = w => () => { c.setW(w); c.DB.w = w; c.DB.wd = c.dkey(c.now()); c.count('weather'); c.doAct(c.player, 'stretch'); c.toast(`🌦 ${WEATHER[w][0]} — ${WEATHER[w][1]}`, 4200); c.beep(w === 'rain' ? 300 : 700, .15, 0, 'sine'); setTimeout(done, 1500); };
      c.dialog('날씨 창', '이 정류장 하늘만 바뀌어요 · 오늘 하루', '<p>오늘 하늘은 어떻게 할까요?</p>',
        [['맑음', pickW('clear')], ['비', pickW('rain')], ['눈', pickW('snow')], ['그만두기', done]]); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">모은 옛날 물건: ${(c.DB.museum || []).join(' · ') || '아직 없음'} (${(c.DB.museum || []).length}/${ITEMS.length})</p>`,
  onEnter(c) { c.toast(c.visits() > 1 ? `🌃 또 오셨네요. ${c.visits()}번째 정류장` : '🌃 2100년 서울, 하늘 정류장에 어서 오세요', 3200); },
});
