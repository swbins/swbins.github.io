            d.onclick = () => { if (!acc || dead) return;
              if (i !== seq[k]) { acc = false; d.classList.add('bad'); finish(false); return; }
              lit(i, 200); k++; if (k === seq.length) { acc = false; finish(true); } }; }
          let seq = [];
          function finish(ok) {
            c.count('find'); const got = new Set(c.DB.found || []), D = daily(c.now());
            if (ok) { const cand = CREA.filter(s => !got.has(s[0])), pool = cand.length ? cand : CREA, f = CREA[D.cr], s = pool.includes(f) ? f : pool[Math.random() * pool.length | 0], isNew = !got.has(s[0]);
              got.add(s[0]); c.DB.found = [...got]; c.DB.findOk = (c.DB.findOk || 0) + 1; c.save(); msg.innerHTML = `<b>${s[0]}</b>${isNew ? ' — 도감에 담았어요' : ''}`;
              setTimeout(() => { if (dead) return; close(); c.doAct(c.player, 'cheer'); c.stamp(s[0], `도감 ${got.size}/${CREA.length}`); c.toast(`✨ ${s[0]} — ${s[1]}`, 3600); setTimeout(done, 1800); }, 1200); }
            else { msg.textContent = '다른 자리였어요. 다음에 다시'; setTimeout(() => { if (dead) return; close(); c.toast('✨ 어둠 속에선 눈이 금방 속아요'); setTimeout(done, 800); }, 1300); }
          }
          el.querySelector('#go').onclick = () => {
            ro.innerHTML = ''; msg.textContent = '잘 봐요…'; seq = [];
            while (seq.length < 4) { const v = Math.random() * 9 | 0; if (v !== seq[seq.length - 1]) seq.push(v); }
            seq.forEach((v, i) => setTimeout(() => { if (!dead) lit(v, 500); }, 600 + i * 800));
            setTimeout(() => { if (dead) return; msg.textContent = '같은 순서로 눌러요'; acc = true; }, 600 + 4 * 800);
          };
        }); }},
    {id: 'whale', icon: '🐋', label: '고래 소리', run(c, done) {
      c.doAct(c.player, 'crouch'); c.whale(); c.toast('🐋 …멀리서 낮은 소리가 울려요', 2400);
      [98, 123, 147, 131, 110, 165, 147, 123].forEach((f, i) => { c.beep(f, 1.1, i * .75, 'sine', .09); c.beep(f * 2, .8, i * .75 + .05, 'sine', .025); });
      setTimeout(() => { const n = c.count('whale'); c.toast(WHALE[n % WHALE.length], 3600); c.stamp('들었다', `오늘 ${n}번째`); }, 6200);
      setTimeout(done, 7200); }},
    {id: 'fact', icon: '📋', label: '오늘의 심해', spot: [0, -8], face: Math.PI, run(c, done) {
      const d = c.now(), D = daily(d), first = !c.today().fact; c.beep(700, .05, 0, 'sine', .04); c.beep(900, .05, .07, 'sine', .04); c.count('fact');
      setTimeout(() => c.dialog('오늘의 심해', `${c.hm(d)} · ${c.visits()}번째 온 날`,
        `<p style="font-size:28px;margin:4px 0"><b>${D.depth.toLocaleString('ko-KR')} m</b></p><p style="font-size:13px;color:#7a6e5e;margin:0">수온 ${D.temp}°C · 압력 약 ${D.atm}기압 · 오늘 곁에 온 생물: ${CREA[D.cr][0]}</p>
         <p style="font-size:16px">「${FACT[D.dn % FACT.length]}」</p>` + (first ? '' : '<p style="color:#7a6e5e;font-size:13px">오늘의 수심과 한마디는 하루에 하나. 내일 또 와요.</p>'), [['계속 잠수', done, 'main']]), 500); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">발광 생물 도감 ${(c.DB.found || []).length}/${CREA.length}종: ${(c.DB.found || []).join(' · ') || '아직 없음'}<br>반짝임 찾기 맞힌 횟수 ${c.DB.findOk || 0}번</p>`,
  onEnter(c) { c.toast(c.visits() > 1 ? `🌊 ${c.visits()}번째 잠수. 오늘도 캄캄해요` : '🌊 바다 밑은 조용해요. 탐조등부터 켜 볼까요', 3000); },
});
</script></body></html>
