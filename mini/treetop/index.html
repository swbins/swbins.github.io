    const mkBird = kind => { const g = grp(0, 6, -2); g.visible = false; const mc = kind === 0;
      ball(0.22, mc ? 0xc9301f : 0x1c1c22, 0, 0, 0, g).scale.set(0.8, 0.8, 1.5); ball(0.15, mc ? 0xc9301f : 0x1c1c22, 0, 0.08, 0.3, g);
      if (mc) { box(0.06, 0.06, 0.1, 0xe8e0cf, 0, 0.04, 0.42, g); box(0.1, 0.03, 0.7, 0x2a5ac0, 0, -0.02, -0.55, g); }
      else { box(0.12, 0.1, 0.45, 0xf08a1c, 0, 0.06, 0.45, g); ball(0.1, 0xf4f0e0, 0, -0.04, 0.2, g); }
      const w = [-1, 1].map(s => { const p = grp(s * 0.18, 0.05, 0, g); box(0.7, 0.03, 0.35, mc ? 0x2a5ac0 : 0x2a2a30, s * 0.35, 0, 0, p); return p; }); return {g, w}; };
    const BR = [mkBird(0), mkBird(1)];

    // 비 줄기 · 무지개
    const RN = 480, rg = new THREE.BufferGeometry(), rp = new Float32Array(RN * 6), rv = new Float32Array(RN);
    for (let i = 0; i < RN; i++) { const x = (Math.random() - .5) * 34, z = (Math.random() - .5) * 28, y = Math.random() * 14; rv[i] = Math.random();
      rp.set([x + 0.15, y + 0.9, z, x, y, z], i * 6); }
    rg.setAttribute('position', new THREE.BufferAttribute(rp, 3));
    const rain = new THREE.LineSegments(rg, new THREE.LineBasicMaterial({color: 0xd5e8f0, transparent: true, opacity: 0})); rain.frustumCulled = false; rain.visible = false; scene.add(rain);
    const rbw = [0xe0453a, 0xf08a3a, 0xf2d24a, 0x6bc06a, 0x4a9ae0, 0x7a5ac8].map((col, i) => { const m = new THREE.Mesh(new THREE.TorusGeometry(12.5 - i * 0.55, 0.28, 5, 40, Math.PI), new THREE.MeshBasicMaterial({color: col, transparent: true, opacity: 0})); m.position.set(8, -9, -30); m.visible = false; scene.add(m); return m; });
    const baseC = new THREE.Color(0x9fd0c3), greyC = new THREE.Color(0x71878a);

    fx.push((dt, t) => {
      const k = Math.min(1, dt * 1.8); S.rain += (S.rainTo - S.rain) * k; S.rb += (S.rbTo - S.rb) * Math.min(1, dt * 1.2);
      if (Math.abs(S.rainTo - S.rain) < 0.01) S.rain = S.rainTo; if (Math.abs(S.rbTo - S.rb) < 0.01) S.rb = S.rbTo;
      if (S.last !== S.rain) { S.last = S.rain; const f = scene.fog; if (f) { f.color.copy(baseC).lerp(greyC, S.rain); scene.background = f.color.clone(); f.near = 40 - S.rain * 26; f.far = 110 - S.rain * 50; } }
      dim.style.opacity = S.rain * 0.38; rain.visible = S.rain > 0.02; rain.material.opacity = S.rain * 0.6;
      if (rain.visible) { const a = rg.attributes.position.array;
        for (let i = 0; i < RN; i++) { const o = i * 6; let y = a[o + 4] - (16 + rv[i] * 6) * dt, x = a[o + 3];
          if (y < -1) { y = 13 + Math.random() * 2; x = (Math.random() - .5) * 34; a[o + 5] = (Math.random() - .5) * 28; }
          a[o] = x + 0.15; a[o + 1] = y + 0.9; a[o + 2] = a[o + 5]; a[o + 3] = x; a[o + 4] = y; } rg.attributes.position.needsUpdate = true; }
      rbw.forEach(m => { m.visible = S.rb > 0.02; m.material.opacity = S.rb * 0.6; });
      for (const q of crowns) q.m.position.y = q.y + Math.sin(t * 0.8 + q.m.position.x * 0.2 + q.m.position.z * 0.15) * 0.06 * (1 + S.rain);
      br.rotation.x = S.roll * 0.05; pl.forEach((p, i) => { p.position.y = Math.sin(t * 1.8 + i * 0.5) * 0.025 * (0.4 + S.sw); });
      if (c.player.position.x > 12) c.player.position.y = Math.sin(t * 3) * 0.04 * S.sw; else c.player.position.y = 0;
      animal(t);
      for (const s of slothG) { s.g.rotation.z = Math.sin(t * 0.3) * 0.04; s.hd.rotation.y = Math.sin(t * 0.25) * 0.5; }
      if (S.hl > 0) { S.hl -= dt; ring.visible = S.hl > 0; ring.scale.setScalar(1 + Math.sin(t * 6) * 0.12); } else ring.visible = false;
      BR.forEach(b => b.g.visible = false);
      if (S.fly) { S.fly.t += dt; const b = BR[S.fly.k === 0 ? 0 : 1], u = S.fly.t / 6; if (u >= 1) S.fly = null;
        else { b.g.visible = true; b.g.position.set(-22 + 44 * u, 5.5 + Math.sin(S.fly.t * 1.6) * 0.6, -2 + Math.sin(S.fly.t) * 1.2); b.g.rotation.y = Math.PI / 2; const a = Math.sin(S.fly.t * 14) * 0.8; b.w[0].rotation.z = a; b.w[1].rotation.z = -a; } }
    });
  },
  onTime() { S.last = -1; },   // 틀이 30초마다 하늘·안개를 되돌리니 비 중이면 다시 입힌다
  acts: [
    {id: 'bridge', icon: '🌉', label: '흔들다리', spot: [10.3, 0], face: Math.PI / 2, run(c, done) {
      c.play(`<h3>흔들다리 건너기</h3>
        <p style="font-size:13px;color:#7a6e5e">다리가 흔들려요. 빨간 표시가 초록 칸을 지날 때 「한 걸음」! 여덟 걸음이면 건너요.</p>
        <div style="position:relative;height:34px;background:#e7e0c8;border:1.5px solid #2b2620;border-radius:6px;overflow:hidden"><div style="position:absolute;left:35%;width:30%;top:0;bottom:0;background:#9ccf86"></div><div id="mk" style="position:absolute;top:3px;bottom:3px;width:10px;margin-left:-5px;background:#c9472f;border-radius:3px;left:50%"></div></div>
        <p id="dots" style="letter-spacing:5px;margin:8px 0 2px;font-size:14px">○○○○○○○○</p><p id="msg" style="min-height:22px;font-size:14px;margin:4px 0"></p>
        <div class="row" id="ro" style="justify-content:center"><button class="btn main" id="go">시작</button><button class="btn" id="qt">그만두기</button></div>`,
        (el, close) => {
          let dead = false, raf = 0, ph = 0, sp = 2.4, steps = 0, good = 0; const mk = el.querySelector('#mk'), ro = el.querySelector('#ro'), msg = el.querySelector('#msg'), dots = el.querySelector('#dots'), res = [];
          const back = then => { dead = true; cancelAnimationFrame(raf); S.sw = 0.3; msg.textContent = '돌아가는 중…'; ro.innerHTML = ''; c.goTo(10.3, 0, then); };   // 돌아와 선 다음에야 창을 닫는다(난간 밖에 갇히지 않게)
          el.querySelector('#qt').onclick = () => { if (dead) return; back(() => { close(); done(); }); };
          el.querySelector('#go').onclick = () => {
            ro.innerHTML = '<button class="btn main" id="st" style="min-width:140px;height:52px;font-size:17px">왼발</button>'; msg.textContent = '';
            let last = performance.now(); const tick = now => { if (dead || !el.isConnected) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; ph += dt * sp;
              const s = Math.sin(ph); mk.style.left = (50 + s * 46) + '%'; S.roll = s; S.sw = 0.35 + Math.abs(s) * 0.8; raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick);
            const st = el.querySelector('#st');
            st.onclick = () => { if (dead) return; const ok = Math.abs(Math.sin(ph)) < 0.34; steps++; if (ok) good++; res.push(ok ? '●' : '×');
              dots.textContent = res.join('') + '○'.repeat(8 - steps); msg.textContent = ok ? '좋아, 균형!' : '휘청!'; c.beep(ok ? 660 : 160, 0.07, 0, ok ? 'sine' : 'sawtooth', 0.04);
              c.goTo(12.4 + steps * 1.6, 0); sp = 1.9 + Math.random() * 1.3; st.textContent = steps % 2 ? '오른발' : '왼발';
              if (steps >= 8) back(() => { const n = c.count('bridge'); close(); if (good >= 6) { c.DB.steady = (c.DB.steady || 0) + 1; c.save(); c.doAct(c.player, 'cheer'); c.stamp('건넜다', `여덟 걸음 중 ${good}번 안정`); }
                else { c.doAct(c.player, 'crouch'); c.stamp('겨우 건넜다', `${8 - good}번 휘청했어요`); }
                setTimeout(() => c.toast(GF[(daily(c.now()).dn + n) % GF.length], 3800), 1400); setTimeout(done, 1800); }); };
          };
        }); }},
    {id: 'sloth', icon: '🦥', label: '나무늘보', spot: [0, -1], face: Math.PI, run(c, done) {
      c.doAct(c.player, 'stretch'); const tried = new Set(); c.beep(900, .05); c.beep(1200, .05, .08);
      const ask = msg => c.dialog('나무늘보 찾기', '쌍안경으로 가지를 훑어 봐요',
        `<p>가지마다 번호표가 달려 있어요. 나무늘보는 가만히 매달려 있어서 한참 봐야 보여요. 어느 가지일까요?</p>` + (msg ? `<p style="color:#c9472f">${msg}</p>` : ''),
        [...[0, 1, 2, 3, 4].filter(j => !tried.has(j)).map(j => [`${j + 1}번 가지`, () => pick(j)]), ['그만 보기', done, 'main']]);
      const pick = j => {
        if (j === S.si) { const n = c.count('sloth'), days = new Set(c.DB.sloDays || []); days.add(c.dkey(c.now())); c.DB.sloDays = [...days]; c.save(); S.hl = 4;
          c.doAct(c.player, 'cheer'); c.beep(880, .08); c.beep(1320, .1, .1); c.stamp('찾았다', `나무늘보 · 오늘 ${n}번째`);
          setTimeout(() => c.toast('🦥 ' + SLOTH[(c.DB.total.sloth || 0) % 2], 3800), 800); setTimeout(done, 2400); }
        else { tried.add(j); c.beep(300, .08); ask(`${j + 1}번은 ${S.names[j][0]}. ${S.names[j][1]}`); } };
      setTimeout(() => ask(), 500); }},
    {id: 'squall', icon: '🌧', label: '스콜', spot: [0, 3], face: Math.PI, run(c, done) {
      c.toast('하늘이 갑자기 어두워져요…', 2000); S.dimHold = true;
      setTimeout(() => { S.rainTo = 1; c.doAct(c.player, 'crouch'); for (let i = 0; i < 45; i++) c.beep(2200 + Math.random() * 2800, .03, i * 0.1, 'triangle', .006); c.toast('쏴아— 한꺼번에 쏟아져요', 2200); }, 1600);
      setTimeout(() => c.beep(65, 1, 0, 'sawtooth', .03), 3600);
      setTimeout(() => { S.rainTo = 0; S.rbTo = 1; const n = c.count('squall'); c.doAct(c.player, 'cheer'); c.stamp('스콜 끝', `오늘 ${n}번째 · 금세 맑아졌어요`);
        setTimeout(() => c.toast('☔ 열대 우림은 거의 매일 비가 와요. 소나기가 지나가면 금방 환해져요', 3600), 900);
        setTimeout(() => S.rbTo = 0, 9000); setTimeout(done, 2200); }, 6600); }},
    {id: 'bird', icon: '🦜', label: '새 소리', spot: [-9.4, 3], face: -Math.PI / 2, run(c, done) {
      const k = (c.today().bird || 0) % 3, b = BIRD[k]; c.count('bird'); S.fly = {t: 0, k};
      if (k === 0) { c.beep(1400, .18, 0, 'sawtooth', .03); c.beep(1100, .22, .22, 'sawtooth', .03); c.beep(1550, .15, .5, 'sawtooth', .03); }
      else if (k === 1) for (let i = 0; i < 5; i++) c.beep(360 + (i % 2) * 40, .07, i * .1, 'square', .03);
      else for (let i = 0; i < 9; i++) c.beep(2000 + (i % 3) * 320, .06, i * .08, 'sine', .04);
      c.toast(`🦜 ${b[0]} — ${b[1]}`, 3800);
      const heard = new Set(c.DB.heard || []); const had = heard.size; heard.add(k); c.DB.heard = [...heard]; c.save();
      if (had < 3 && heard.size === 3) setTimeout(() => c.stamp('새 소리 셋', '세 가지 소리를 다 들었어요'), 1200);
      setTimeout(done, 4200); }},
  ],
  recExtra: c => { const A = AN[daily(c.now()).a]; return `<p style="font-size:14px;margin:6px 0"><b>오늘 만난 동물 · ${A.n}</b><br>${A.f}</p>
    <p style="font-size:13px;color:#7a6e5e">나무늘보 찾은 날 ${(c.DB.sloDays || []).length}일 · 다리 안정 건넘 ${c.DB.steady || 0}번 · 들은 새 소리 ${(c.DB.heard || []).length}/3</p>`; },
  onEnter(c) { const A = AN[daily(c.now()).a]; c.toast(c.visits() > 1 ? `🌴 오늘 만난 동물: ${A.n}. ${A.f}` : `🌴 발밑은 땅에서 한참 위. 오늘 만난 동물: ${A.n}`, 4600); },
});
</script></body></html>
