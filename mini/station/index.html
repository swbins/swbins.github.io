<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import {start} from '../mini.js';

// 하루에 하나 — 오늘의 사실 · 오늘의 우주식
const FACTS = [
  '정거장은 90분쯤에 지구를 한 바퀴 돌아요. 그래서 하루에 해돋이를 16번쯤 봐요.',
  '정거장은 지상 약 400km 위를 시속 2만 8천 km쯤으로 날아요.',

  '빵 대신 토르티야를 먹어요. 빵가루가 떠다니면 위험하니까요.',

  '정거장에는 2000년 11월부터 사람이 계속 머물고 있어요.',
  '큐폴라라는 전망 창에는 창문이 일곱 개 있어요.',
  '우주인은 근육과 뼈가 약해지지 않게 하루 두 시간쯤 운동해요.',

  '무중력에서는 물이 컵에 담기지 않고 둥근 방울로 떠다녀요.',

  '토르티야 + 땅콩버터 — 빵가루가 안 날려서',
  '튜브 사과 소스',
  '스크램블 에그 — 가루에 물을 부어서',
  '김치 파우치 — 한국에서 우주용으로 만든 것',
  '초콜릿 한 입 — 후식',
  '차 한 팩 — 빨대 달린 파우치로',
];
// 지금 한낮인 곳을 가늠하는 도시(경도)
const CITY = [['서울', 127], ['도쿄', 140], ['시드니', 151], ['베이징', 116], ['델리', 77], ['두바이', 55], ['모스크바', 38], ['카이로', 31], ['런던', 0],
  ['리우데자네이루', -43], ['뉴욕', -74], ['시카고', -88], ['로스앤젤레스', -118], ['앵커리지', -150], ['호놀룰루', -158]];
const near = lon => CITY.reduce((b, c) => { const d = Math.abs(((c[1] - lon + 540) % 360) - 180); return d < b[0] ? [d, c[0]] : b; }, [999, ''])[1];
const dayNo = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);

let floating = false;

start({
  key: 'station', title: '우주정거장 한 칸', enter: '해치 열고 들어가기', time: 'night', nickIcon: '🛰',
  nick: [['둥실한', '궤도 도는', '튜브 먹는', '조용한', '창가의', '무중력의'], ['우주인', '볼펜', '물방울', '손잡이', '위성', '별빛']],
  intro: '<p>지구 위 400km, 정거장의 작은 모듈.<br>둥실 떠서 창밖 보고, 튜브 하나 먹고 가요.</p>',
  floor: {w: 22, d: 18, c1: '#6b7380', c2: '#7a8392', pattern: 'tile'},
  bg: {night: 0x02030a}, startPos: [0, 5], cam: {h: 10, back: 12},
  playerLook: {coat: 0x2f5aa8, pants: 0xcfd4dc, hair: 0x2a2018, hat: {type: 'cap', c: 0xf4f4f0}},
  build(c) {
    const {box, cyl, ball, glowBall, sign, solid, npc, fx, THREE, scene, night} = c;
    const glow = (col, k = 0.8) => new THREE.MeshLambertMaterial({color: col, emissive: col, emissiveIntensity: k});
    const WALL = 0xdfe3ea, DARK = 0x3a4252;

    // 별(사방) · 지구
    const N = 1400, sg = new THREE.BufferGeometry(), sp = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u);
      sp[i * 3] = Math.cos(a) * r * 100; sp[i * 3 + 1] = u * 100; sp[i * 3 + 2] = Math.sin(a) * r * 100 - 20; }
    sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    const stars = new THREE.Points(sg, new THREE.PointsMaterial({color: 0xffffff, size: 2, sizeAttenuation: false, transparent: true, fog: false})); scene.add(stars);
    fx.push((dt, t) => { stars.material.opacity = 0.8 + Math.sin(t * 1.5) * 0.15; });
    {
      const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512; const g = cv.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, '#2a6ab8'); gr.addColorStop(.5, '#1d4f9c'); gr.addColorStop(1, '#2a6ab8'); g.fillStyle = gr; g.fillRect(0, 0, 1024, 512);
      let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < 16; i++) { const cx = rnd() * 1024, cy = 90 + rnd() * 330, col = rnd() < .65 ? '#3f8a4a' : '#9a8f55', n = 7 + (rnd() * 6 | 0), pts = [];
        for (let k = 0; k < n; k++) pts.push([cx + (rnd() - .5) * 130, cy + (rnd() - .5) * 70, 18 + rnd() * 32]);
        for (const dx of [-1024, 0, 1024]) { g.fillStyle = col; for (const [x, y, r] of pts) { g.beginPath(); g.arc(x + dx, y, r, 0, 7); g.fill(); } } }
      g.fillStyle = '#eef4fa'; g.fillRect(0, 0, 1024, 26); g.fillRect(0, 486, 1024, 26);
      for (let i = 0; i < 70; i++) { const x = rnd() * 1024, y = rnd() * 512, r = 10 + rnd() * 26; g.fillStyle = 'rgba(255,255,255,.55)';
        for (const dx of [-1024, 0, 1024]) { g.beginPath(); g.ellipse(x + dx, y, r * 2, r * .6, 0, 0, 7); g.fill(); } }
      const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace;
      const earth = new THREE.Mesh(new THREE.SphereGeometry(20, 48, 32), new THREE.MeshBasicMaterial({map: tx, fog: false})); earth.position.set(0, 5, -42); earth.rotation.z = 0.3; scene.add(earth);
      const atm = new THREE.Mesh(new THREE.SphereGeometry(20.9, 40, 24), new THREE.MeshBasicMaterial({color: 0x6fb0ff, transparent: true, opacity: .22, side: THREE.BackSide, fog: false, depthWrite: false})); atm.position.copy(earth.position); scene.add(atm);
      const shade = new THREE.Mesh(new THREE.SphereGeometry(20.1, 40, 24, -Math.PI / 2, Math.PI), new THREE.MeshBasicMaterial({color: 0x000612, transparent: true, opacity: .55, fog: false, depthWrite: false})); shade.position.copy(earth.position); scene.add(shade);
      fx.push(dt => { earth.rotation.y += dt * 0.03; });
    }

    // 바닥 두께 · 뒷벽(둥근 창) · 옆벽
    box(22, 1, 18, 0x4a5262, 0, -0.52, 0);
    { const sh = new THREE.Shape(); sh.moveTo(-11, 0); sh.lineTo(11, 0); sh.lineTo(11, 8); sh.lineTo(-11, 8); sh.lineTo(-11, 0);
      const hole = new THREE.Path(); hole.absarc(0, 4.2, 3.2, 0, Math.PI * 2, true); sh.holes.push(hole);
      const w = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, {depth: 0.4, bevelEnabled: false, curveSegments: 36}), new THREE.MeshLambertMaterial({color: WALL})); w.position.set(0, 0, -9.4); w.castShadow = w.receiveShadow = true; scene.add(w); }
    const ring = new THREE.Mesh(new THREE.TorusGeometry(3.3, 0.22, 10, 40), new THREE.MeshLambertMaterial({color: 0xb8bcc2})); ring.position.set(0, 4.2, -9); scene.add(ring);
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; ball(0.1, 0x555b66, Math.cos(a) * 3.3, 4.2 + Math.sin(a) * 3.3, -8.75); }
    for (const x of [-8, -5.8, 5.8, 8]) box(0.06, 7.4, 0.06, 0xb0b6c0, x, 3.9, -9.0);
    box(22, 0.1, 0.1, glow(0x9fd0ff, 0.9), 0, 7.4, -8.95);
    for (const sx of [-1, 1]) {
      box(0.4, 5, 18, WALL, sx * 11, 2.5, 0); box(0.1, 0.16, 17, glow(0xcfe6ff, 0.9), sx * 10.78, 4.3, 0); box(0.1, 0.5, 17.6, DARK, sx * 10.78, 0.25, 0);
      for (let z = -6; z <= 6; z += 4) box(0.06, 3.4, 0.06, 0xb0b6c0, sx * 10.78, 2.4, z);
    }
    // 손잡이 막대(노란 색) — 창 아래 가로 · 세로
    const rail = cyl(0.07, 0.07, 8, 0xf2c14e, 0, 1.2, -8.4); rail.rotation.z = Math.PI / 2;
    for (const x of [-4, 4]) { cyl(0.07, 0.07, 3.4, 0xf2c14e, x, 1.7, -8.4); }
    for (const x of [-2, 2]) { cyl(0.07, 0.07, 6, 0xf2c14e, x, 3, -8.7); }

    // 오른쪽 벽 — 도킹 해치와 안내판
    { const r = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.18, 10, 32), new THREE.MeshLambertMaterial({color: 0xb8bcc2})); r.rotation.y = Math.PI / 2; r.position.set(10.74, 1.9, -2); scene.add(r);
      const d = cyl(1.35, 1.35, 0.1, 0x4a5a78, 10.72, 1.9, -2, undefined, 28); d.rotation.z = Math.PI / 2; const w = cyl(0.35, 0.35, 0.06, 0xf2c14e, 10.66, 1.9, -2, undefined, 14); w.rotation.z = Math.PI / 2; }
    sign(['도킹 포트', 'PORT 2'], 3.2, 1, '#2a3550', '#dfe9ff', 10.78, 4, -2, -Math.PI / 2, [46, 24]);
    // 오른쪽 앞 — 조종 책상
    box(1.4, 1.2, 3.2, 0x4a5262, 9.9, 0.6, 2); box(1.2, 0.08, 3, glow(0x66e0a8, 0.5), 9.9, 1.24, 2); solid(9.9, 2, 1.4, 3.2);
    for (let i = 0; i < 4; i++) glowBall(0.07, [0xff8a5a, 0x66e0a8, 0x9fd0ff, 0xffd27a][i], 9.4, 1.3, 0.8 + i * 0.8, 0);

    // 왼쪽 벽 — 식당 칸(선반 · 주머니 포장 · 벨크로 판)
    box(1.6, 1, 5, 0x9aa3b0, -9.8, 0.5, -3.5); box(1.7, 0.08, 5.1, 0xcfd4dc, -9.8, 1.03, -3.5); solid(-9.8, -3.5, 1.6, 5);
    box(0.12, 2.2, 5, DARK, -10.7, 2.6, -3.5);
    const pc = [0xe8732a, 0xf2c14e, 0x6fb07a, 0xc9472f, 0x9fd0ff, 0xf4ecdc];
    for (let i = 0; i < 12; i++) box(0.08, 0.55, 0.35, pc[i % 6], -10.6, 2.1 + (i % 2) * 0.9, -5.4 + (i / 2 | 0) * 0.75);
    sign(['식당 칸', '튜브 · 파우치'], 3.2, 1, '#2a3550', '#dfe9ff', -10.78, 4.1, -3.5, Math.PI / 2, [46, 24]);
    for (let i = 0; i < 3; i++) box(0.22, 0.5, 0.22, [0xe8732a, 0x6fb07a, 0xc9472f][i], -9.8, 1.35, -5 + i * 0.5);

    // 뒤쪽 양옆 — 장비 선반(깜빡이는 불) · 텃밭
    for (const [x, col] of [[-7.4, 0x66e0a8], [-9.2, 0x9fd0ff]]) {
      box(1.6, 3.6, 1.2, 0xcfd4dc, x, 1.8, -8.2); solid(x, -8.2, 1.6, 1.2);
      for (let i = 0; i < 5; i++) box(1.3, 0.28, 0.06, glow(col, 0.6), x, 0.7 + i * 0.6, -7.58);
    }
    c.leds = [];
    for (let i = 0; i < 5; i++) c.leds.push(glowBall(0.07, [0xff8a5a, 0x66e0a8, 0xffd27a][i % 3], -7.4 + (i - 2) * 0.28, 3.3, -7.55, 0));
    fx.push((dt, t) => c.leds.forEach((l, i) => { l.visible = Math.sin(t * 2.4 + i * 1.7) > -0.3; }));
    box(2.4, 1, 1.6, 0xcfd4dc, 7.2, 0.5, -7.9); box(2.2, 0.08, 1.4, glow(0xff5ad0, 0.9), 7.2, 1.04, -7.9); solid(7.2, -7.9, 2.4, 1.6);
    for (let i = 0; i < 6; i++) { const lf = ball(0.28, 0x4fb05a, 6.5 + (i % 3) * 0.7, 1.35 + (i % 2) * 0.12, -7.6 - (i / 3 | 0) * 0.5); lf.scale.set(1, .7, 1); }
    sign(['텃밭', '상추'], 1.6, 0.7, '#2a3550', '#dfe9ff', 7.2, 2.3, -8.75, 0, [38, 22]);
    box(0.08, 0.5, 0.06, glow(0xff5ad0, 0.9), 7.2, 1.7, -8.2);

    // 천장 대신 작은 등 · 조명(흰빛)
    for (const [x, z] of [[0, -3], [-6, 3], [6, 3]]) { const l = new THREE.PointLight(0xdfeaff, 20, 16); l.position.set(x, 5.5, z); scene.add(l); night.push(l); }

    // 둥둥 떠다니는 물건 — 물방울 · 볼펜 · 귤
    const fl = [];
    const bub = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 12), new THREE.MeshLambertMaterial({color: 0x9fd0ff, transparent: true, opacity: .55, emissive: 0x204060})); bub.position.set(-3.5, 2.6, -2.5); scene.add(bub); fl.push([bub, 2.6]);
    const pen = box(0.08, 0.08, 0.7, 0xc9472f, 3.4, 2.2, -3.5); fl.push([pen, 2.2]); box(0.1, 0.1, 0.18, 0x222222, 0, 0, 0.3, pen);
    const orn = ball(0.22, 0xf08a2a, 4.8, 2.9, 1.2); fl.push([orn, 2.9]);
    fx.push((dt, t) => fl.forEach(([m, y0], i) => { m.position.y = y0 + Math.sin(t * 0.8 + i * 2) * 0.28; m.rotation.x += dt * (0.3 + i * 0.1); m.rotation.z += dt * 0.25; }));

    // 정거장 사람들(둥둥) — 창가 한 명, 오가는 한 명
    const A = {coat: 0xe8ecf2, pants: 0xe8ecf2};
    const a1 = npc({...A, hairStyle: 'bun', hair: 0x2a2018}, [[-4.2, -6.4]], {face: Math.PI, idle: ['wave', 'stretch']});
    const a2 = npc({...A, hat: {type: 'cap', c: 0xe8732a}, glasses: true}, [[-5, -0.5], [4, -0.5]], {speed: 0.9, wait: 3, idle: ['wave']});
    fx.push((dt, t) => [a1, a2].forEach((n, i) => { n.o.position.y = 0.45 + Math.sin(t * 1.1 + i * 2.2) * 0.16; n.o.rotation.z = Math.sin(t * 0.7 + i) * 0.06; }));
    // 나도 늘 살짝 떠 있다
    fx.push((dt, t) => { if (!floating) c.player.position.y = 0.2 + Math.sin(t * 1.3) * 0.1; });
  },
  lamps: [],
  acts: [
    {id: 'float', icon: '🫧', label: '둥둥', spot: [0, 1.5], face: Math.PI, run(c, done) {
      const n = c.count('float'); floating = true; let t = 0, said = false; c.beep(300, .6, 0, 'sine', .04); c.toast('🫧 발이 바닥에서 떨어져요', 1600);
      const p = c.player, f = dt => { t += dt;
        const up = Math.min(1, t / 1.2), down = Math.min(1, Math.max(0, (t - 4) / 1)), h = (up * up * (3 - 2 * up)) * (1 - down * down * (3 - 2 * down));
        p.position.y = 0.2 + h * 2.2 + Math.sin(t * 2) * 0.08 * h; const sp = Math.min(1, Math.max(0, (t - 1.2) / 2.6));
        p.rotation.x = Math.PI * 2 * (sp * sp * (3 - 2 * sp)); p.rotation.z = Math.sin(t * 1.6) * 0.25 * h;
        if (!said && t > 2) { said = true; c.doAct(p, 'cheer'); c.toast(['🫧 위아래가 없어요. 어느 쪽이 천장이죠?', '🫧 머리카락이 둥실…', '🫧 한 바퀴 더 돌았어요'][n % 3], 2400); }
        if (t > 5) { c.fx.splice(c.fx.indexOf(f), 1); p.position.y = 0.2; p.rotation.x = p.rotation.z = 0; floating = false; if (n === 1) c.stamp('무중력', '첫 둥실'); done(); } };
      c.fx.push(f); }},
    {id: 'earth', icon: '🌍', label: '창밖', spot: [0, -6.4], face: Math.PI, run(c, done) {
      const d = c.now(), ut = d.getUTCHours() + d.getUTCMinutes() / 60, noon = ((12 - ut) * 15 + 540) % 360 - 180;
      const fi = dayNo(d) % FACTS.length, got = new Set(c.DB.facts || []); const isNew = !got.has(fi); got.add(fi); c.DB.facts = [...got]; c.count('earth');
      c.dialog('창밖 — 지금 지구', `${c.hm(d)} · 이 시각 기준`,
        `<p>한낮인 곳: <b>${near(noon)}</b> 근처<br>한밤중인 곳: <b>${near(noon + 180)}</b> 근처</p>
         <p style="font-size:14px;border-top:1.5px dashed #2b2620;padding-top:8px"><b>오늘의 사실</b><br>${FACTS[fi]}</p>
         <p style="color:#7a6e5e;font-size:12px">${isNew ? '새로 알게 된 사실이에요 · ' : ''}모은 사실 ${got.size}/${FACTS.length} · 내일은 다른 이야기</p>
         <p style="color:#7a6e5e;font-size:12px">정거장은 90분쯤에 지구를 한 바퀴 돌아요.</p>`, [['닫기', done, 'main']]); }},
    {id: 'meal', icon: '🥤', label: '우주식', spot: [-8.2, -3.5], face: -Math.PI / 2, run(c, done) {
      const d = c.now(), m = MENU[dayNo(d) % MENU.length], tube = new c.THREE.Group();
      c.box(0.1, 0.5, 0.1, 0xd9dde4, 0, 0.1, 0, tube); c.box(0.12, 0.14, 0.12, 0xe8732a, 0, 0.38, 0, tube); c.hand.add(tube);
      c.beep(500, .1, 0, 'sine', .05); const n = c.count('meal');
      setTimeout(() => { c.doAct(c.player, 'sip'); c.beep(260, .2, .5, 'sine', .04); }, 700);
      setTimeout(() => { c.hand.remove(tube); c.toast(`🥤 오늘의 우주식 — ${m}`, 3600);
        const w = new c.THREE.Mesh(new c.THREE.SphereGeometry(0.22, 12, 8), new c.THREE.MeshLambertMaterial({color: 0x9fd0ff, transparent: true, opacity: .6, emissive: 0x204060}));
        w.position.set(c.player.position.x + 0.4, 1.4, c.player.position.z); c.scene.add(w); let t = 0;
        const f = dt => { t += dt; w.position.y = 1.4 + t * 0.35; w.position.x += dt * 0.25; w.position.z += Math.sin(t * 1.3) * dt * 0.3; w.visible = t < 8; if (t > 8) { c.fx.splice(c.fx.indexOf(f), 1); c.scene.remove(w); } }; c.fx.push(f);
        if (n === 1) setTimeout(() => c.toast('🫧 흘린 방울은 떠다녀요. 입으로 잡아야 해요', 2800), 3800); done(); }, 3000); }},
    {id: 'dock', icon: '🛰', label: '도킹', spot: [8.2, -2], face: Math.PI / 2, run(c, done) {
      c.play(`<h3>도킹</h3><p style="font-size:13px;color:#7a6e5e">움직이는 십자가가 가운데 원에 들어왔을 때 「맞추기」 (스페이스) · 3단계 · 30초</p>
        <div id="dk" style="position:relative;width:240px;height:240px;margin:8px auto;background:radial-gradient(#16224a,#070b1c);border-radius:6px;overflow:hidden;touch-action:none">
          <div id="rg" style="position:absolute;left:50%;top:50%;border:3px solid #66e0a8;border-radius:50%;transform:translate(-50%,-50%)"></div>
          <div id="cx" style="position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;color:#ffd27a;font-size:26px;line-height:26px;font-weight:800;text-align:center">+</div></div>
        <p id="dm" style="min-height:22px">1 / 3</p>
        <div class="row" style="justify-content:center"><button class="btn" id="dq">그만두기</button><button class="btn main" id="dg">맞추기</button></div>`,
        (el, close) => {
          const R = [34, 26, 19], W = [1.5, 2.1, 2.8], rg = el.querySelector('#rg'), cx = el.querySelector('#cx'), msg = el.querySelector('#dm');
          let st = 0, fails = 0, t = 0, over = false, raf = 0, last = performance.now(), px = 120, py = 120;
          const setRing = () => { rg.style.width = rg.style.height = R[st] * 2 + 'px'; msg.textContent = `${st + 1} / 3 · 실패 ${fails}/3`; }; setRing();
          const loop = now => { if (over) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
            px = 120 + Math.sin(t * W[st]) * 92 + Math.sin(t * W[st] * 2.3 + 1) * 14; py = 120 + Math.cos(t * W[st] * 0.8 + st) * 92 + Math.sin(t * W[st] * 1.7) * 14;
            cx.style.left = px + 'px'; cx.style.top = py + 'px';
            if (t > 30) return finish(false, '시간이 다 됐어요'); raf = requestAnimationFrame(loop); };
          const key = e => { if (e.code === 'Space') { e.preventDefault(); hit(); } };
          const finish = (ok, why) => { if (over) return; over = true; cancelAnimationFrame(raf); document.removeEventListener('keydown', key);
            if (ok === null) { close(); done(); return; }
            msg.textContent = ok ? '도킹 완료. 해치가 열려요' : `도킹 취소 — ${why}`;
            setTimeout(() => { close(); if (ok) { c.count('dock'); c.DB.dockClean = (c.DB.dockClean || 0) + (fails === 0 ? 1 : 0); c.save(); c.doAct(c.player, 'cheer'); c.stamp('도킹', fails === 0 ? '한 번에 성공' : `실패 ${fails}번 끝에`); } else c.toast('🛰 연료는 아껴 둬요. 다음에 다시', 2400); done(); }, 1100); };
          const hit = () => { if (over) return; const dist = Math.hypot(px - 120, py - 120);
            if (dist <= R[st]) { c.beep(500 + st * 200, .12, 0, 'sine'); st++; if (st >= 3) return finish(true); setRing(); }
            else { c.beep(200, .12); fails++; if (fails >= 3) return finish(false, '많이 벗어났어요'); setRing(); msg.textContent += ' · 벗어났어요'; } };
          document.addEventListener('keydown', key); el.querySelector('#dg').onclick = hit; el.querySelector('#dk').onpointerdown = hit; el.querySelector('#dq').onclick = () => finish(null);
          raf = requestAnimationFrame(loop);
        }); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">오늘의 우주식: ${MENU[dayNo(c.now()) % MENU.length]}<br>모은 사실 ${(c.DB.facts || []).length}/${FACTS.length} · 도킹 성공 ${c.DB.total.dock || 0}번 (한 번에 ${c.DB.dockClean || 0}번)</p>`,
  onEnter(c) { c.toast('🛰 어서 와요. 여기는 위아래가 없어요', 3000); },
});
</script></body></html>
