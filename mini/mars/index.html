        <canvas id="cv" width="240" height="300" style="border:1.5px solid #2b2620;border-radius:6px;touch-action:none"></canvas>
        <p id="msg" style="min-height:22px;font-size:14px;margin:6px 0"></p>
        <div class="row" id="ro" style="justify-content:center"><button class="btn main" id="go">시작</button><button class="btn" id="qt">그만두기</button></div>`,
        (el, close) => {
          const cv = el.querySelector('#cv'), g = cv.getContext('2d'), ro = el.querySelector('#ro'), msg = el.querySelector('#msg');
          const W = 240, H = 300, L = 1000, V = 70, RY = H - 60;
          let dead = false, raf = 0, go = false, prog = 0, x = W / 2, stall = 0, bumps = 0, t0 = 0, last = 0; const held = {l: 0, r: 0};
          const rocks = [], specks = [];
          for (let y = 140; y < L - 120; y += 62 + Math.random() * 30) { const a = 30 + Math.random() * (W - 60); rocks.push({x: a, y, r: 11 + Math.random() * 7, hit: false});
            if (Math.random() < .3 && Math.abs(a - W / 2) >= 40) { const b = a < W / 2 ? a + 110 + Math.random() * (W - 140 - a) : a - 110 - Math.random() * (a - 140); rocks.push({x: b, y: y + Math.random() * 16 - 8, r: 9 + Math.random() * 6, hit: false}); } }
          for (let i = 0; i < 90; i++) specks.push([Math.random() * W, Math.random() * (L + H)]);
          const kd = e => { const k = e.key.toLowerCase(); if (k === 'arrowleft' || k === 'a') held.l = 1; if (k === 'arrowright' || k === 'd') held.r = 1; };
          const ku = e => { const k = e.key.toLowerCase(); if (k === 'arrowleft' || k === 'a') held.l = 0; if (k === 'arrowright' || k === 'd') held.r = 0; };
          addEventListener('keydown', kd); addEventListener('keyup', ku);
          const stop = () => { dead = true; cancelAnimationFrame(raf); removeEventListener('keydown', kd); removeEventListener('keyup', ku); };
          const draw = () => {
            g.fillStyle = '#a4482a'; g.fillRect(0, 0, W, H); g.fillStyle = '#b95c36';
            for (const [sx, sy] of specks) { const y = RY - (sy - prog); if (y > -4 && y < H + 4) g.fillRect(sx, y, 3, 3); }
            const gy = RY - (L - prog);
            if (gy > -40) { g.fillStyle = '#f4ecdc'; for (let i = 0; i < W; i += 20) g.fillRect(i, gy, 10, 4); g.fillRect(W / 2 - 1, gy - 34, 3, 34); g.fillStyle = '#e8892a'; g.beginPath(); g.moveTo(W / 2 + 2, gy - 34); g.lineTo(W / 2 + 24, gy - 27); g.lineTo(W / 2 + 2, gy - 20); g.fill(); }
            for (const r of rocks) { const y = RY - (r.y - prog); if (y < -30 || y > H + 30) continue; g.fillStyle = r.hit ? '#4a2216' : '#6a301c'; g.beginPath(); g.ellipse(r.x, y, r.r, r.r * 0.85, 0, 0, 7); g.fill(); g.fillStyle = 'rgba(255,220,190,.18)'; g.beginPath(); g.ellipse(r.x - r.r * .25, y - r.r * .3, r.r * .4, r.r * .25, 0, 0, 7); g.fill(); }
            g.fillStyle = '#222'; for (const sx of [-16, 10]) for (let i = 0; i < 3; i++) g.fillRect(x + sx, RY - 17 + i * 13, 6, 10);
            g.fillStyle = '#e8e4dc'; g.fillRect(x - 11, RY - 20, 22, 40); g.fillStyle = '#6a6e76'; g.fillRect(x - 6, RY - 6, 12, 12); g.fillStyle = '#2b2f3a'; g.fillRect(x - 5, RY - 16, 10, 5);
            g.fillStyle = 'rgba(244,236,220,.7)'; g.fillRect(8, 8, W - 16, 5); g.fillStyle = '#e8892a'; g.fillRect(8, 8, (W - 16) * Math.min(1, prog / L), 5);
          };
          const end = (ok, now) => { stop(); draw(); ro.innerHTML = ''; const sec = +now.toFixed(1);
            msg.innerHTML = ok ? `<b>표본 지점 도착 · ${sec}초</b> · 부딪힘 ${bumps}번` : '<b>시간이 다 됐어요</b> · 깃발이 조금 남았어요';
            c.count('rover'); if (ok) { c.DB.roverBest = Math.min(c.DB.roverBest || 99, sec); c.DB.roverOk = (c.DB.roverOk || 0) + 1; c.save(); }
            setTimeout(() => { close(); if (ok) { S.drive = 2.6; c.doAct(c.player, 'cheer'); c.stamp(bumps === 0 ? '무사고' : '도착', `표본 지점 · ${sec}초`); } else c.toast('🛞 다음엔 바위 사이로. 한 번 더 몰고 가요'); setTimeout(done, 1600); }, 1400); };
          const tick = ts => { if (dead || !el.isConnected) return; if (!last) last = ts; const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
            if (go) { const now = (performance.now() - t0) / 1000;
              x = Math.max(16, Math.min(W - 16, x + (held.r - held.l) * 120 * dt));
              if (stall > 0) stall -= dt; else prog += V * dt;
              for (const r of rocks) if (!r.hit && Math.abs(r.y - prog) < r.r + 16 && Math.abs(r.x - x) < r.r + 11) { r.hit = true; bumps++; stall = 0.9; x += (x >= r.x ? 1 : -1) * 8; c.beep(130, .15, 0, 'square', .05); }
              if (prog >= L) return end(true, now);
              if (now > 28) return end(false, now); }
            draw(); raf = requestAnimationFrame(tick); };
          const quit = () => { stop(); close(); done(); };
          el.querySelector('#qt').onclick = quit; draw();
          el.querySelector('#go').onclick = () => {
            ro.innerHTML = '<button class="btn" id="bl" style="padding:12px 28px;font-size:20px">◀</button><button class="btn" id="br" style="padding:12px 28px;font-size:20px">▶</button><button class="btn" id="qt2">그만두기</button>';
            ro.querySelector('#qt2').onclick = quit;
            for (const [id, k] of [['bl', 'l'], ['br', 'r']]) { const b = ro.querySelector('#' + id);
              b.onpointerdown = () => { held[k] = 1; }; for (const ev of ['onpointerup', 'onpointerleave', 'onpointercancel']) b[ev] = () => { held[k] = 0; }; }
            go = true; t0 = performance.now(); last = 0; msg.textContent = ''; raf = requestAnimationFrame(tick); };
        }); }},
    {id: 'potato', icon: '🥔', label: '감자 돌보기', spot: [9.5, -2.4], face: Math.PI, run(c, done) {
      const P = c.DB.potato, first = !c.today().potato, TH = c.THREE;
      c.doAct(c.player, 'crouch'); c.beep(600, .06, 0, 'sine', .03); c.beep(740, .06, .1, 'sine', .03);
      const ds = []; for (let i = 0; i < 6; i++) { const m = new TH.Mesh(new TH.SphereGeometry(.07, 8, 6), new TH.MeshBasicMaterial({color: 0x7fc8ff})); m.visible = false; c.scene.add(m); ds.push(m); }
      let t = 0; const f = dt => { t += dt;
        ds.forEach((m, i) => { const u = (t - 0.1 - i * 0.12) / 0.55; if (u < 0 || u > 1) { m.visible = false; return; } m.visible = true; m.position.set(9.5 + (i - 2.5) * 0.3, 1.1 + 0.6 * Math.sin(u * Math.PI) - 0.6 * u, -2.9 - u * 2.0); });
        if (t > 1.6) { ds.forEach(m => c.scene.remove(m)); c.fx.splice(c.fx.indexOf(f), 1); } };
      c.fx.push(f);
      setTimeout(() => { c.count('potato');
        if (first) { const fresh = P.days >= MAXD; if (fresh) P.days = 0; P.days++; c.save(); S.gTo = gOf(P.days);
          if (P.days === MAXD) { P.harvest++; c.save(); c.doAct(c.player, 'cheer'); c.stamp('수확', `감자 ${P.harvest}번째`); c.toast('🥔 다 자랐어요. 내일 새로 심을게요', 3200); }
          else c.toast(`🥔 ${fresh ? '새로 심었어요' : POT[P.days % POT.length]} · ${P.days}/${MAXD}일째`, 3400); }
        else c.toast('🥔 물은 오늘 이미 줬어요. 잎만 살짝 만져 봐요', 2600);
        setTimeout(done, 1700); }, 1300); }},
    {id: 'dusk', icon: '🌅', label: '해 질 녘', face: Math.PI, run(c, done) {
      const d = c.now(), D = daily(d), first = !c.today().dusk; c.beep(400, .5, 0, 'sine', .02); c.beep(300, .6, .5, 'sine', .02); S.dTo = 1; c.count('dusk'); c.toast('🌅 해가 기울어요…', 3000);
      setTimeout(() => c.dialog('화성의 노을', `${c.hm(d)} · 화성 날짜 ${D.msd}`,
        `<p style="font-size:15px;margin:4px 0"><b>오늘의 화성</b>: 낮 ${MI}${-D.hi}°C · 밤 ${MI}${-D.lo}°C · 바람 초속 ${D.w}m</p>
         <p style="font-size:12px;color:#7a6e5e;margin:0">${D.sky}. 화성 노을은 해 둘레가 파랗게 보여요. 고운 먼지가 푸른빛을 해 쪽으로 더 퍼뜨려서예요. 하늘의 작은 점 둘은 포보스와 데이모스.</p>
         <p style="font-size:16px">「${FACT[D.dn % FACT.length]}」</p>` + (first ? '' : '<p style="color:#7a6e5e;font-size:13px">오늘의 날씨와 한마디는 하루에 하나. 내일 또 와요.</p>'),
        [['잘 봤어요', () => { S.dTo = 0; done(); }, 'main']]), 3800); }},
  ],
  recExtra: c => { const P = c.DB.potato || {days: 0, harvest: 0}, b = c.DB.roverBest;
    return `<p style="font-size:13px;color:#7a6e5e">감자 ${P.days}/${MAXD}일째 · 수확 ${P.harvest}번<br>로버 최고 기록 ${b ? b + '초' : '아직 없음'} · 표본 지점 도착 ${c.DB.roverOk || 0}번</p>`; },
  onEnter(c) { const P = c.DB.potato; c.toast(c.visits() > 1 ? `🔴 ${c.visits()}번째 근무. 감자는 ${P.days}/${MAXD}일째예요` : '🔴 하늘이 주황빛이에요. 감자 싹은 오늘도 무사해요', 3200); },
});
</script></body></html>
