      if (sit) for (const s of [-1, 1]) for (const zz of [-0.6, 0.55]) { const l = ball(0.3, FUR, s * 0.5, 0.2, zz, g); l.scale.set(0.5, 0.38, 1.2); }

      const tail = new THREE.Group(); tail.position.set(0, by + 0.2, -1.2); g.add(tail); cyl(0.04, 0.03, 0.8, DKT, 0, -0.35, 0, tail, 6);
      solid(x, z, 2.4, 2.4); const q = {g, body, hg, jaw, tail, by, ph: Math.random() * 6, sit}; camels.push(q); return q; }
    const DKT = 0x7a5530;
    const c1 = camel(-7, 0.9, Math.PI / 2, true); camel(-12, -3.4, 0.5, false);
    fx.push((dt, t) => { S.look = Math.max(0, S.look - dt);
      for (const q of camels) { q.body.scale.y = 0.8 + Math.sin(t * 1.6 + q.ph) * 0.015;
        const lk = q === c1 && S.look > 0;
        q.hg.rotation.x += ((lk ? 0.28 : Math.sin(t * 0.5 + q.ph) * 0.07) - q.hg.rotation.x) * Math.min(1, dt * 3);
        q.hg.rotation.y += ((lk ? -0.7 : Math.sin(t * 0.37 + q.ph) * 0.25) - q.hg.rotation.y) * Math.min(1, dt * 3);
        q.jaw.position.x = Math.sin(t * 5 + q.ph) * 0.05; q.tail.rotation.z = Math.sin(t * 1.2 + q.ph) * 0.25; } });

    // ── 오아시스: 연못 + 야자나무 둘 + 갈대·돌
    { const wm = new THREE.MeshLambertMaterial({color: 0x2a6a9a, emissive: 0x143a5c}); const pond = cyl(2.2, 2.2, 0.06, wm, 8.5, 0.03, 7); pond.castShadow = false; solid(8.5, 7, 4.4, 4.4);
      for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, s = ball(0.3 + (i % 3) * 0.08, 0x6a6258, 8.5 + Math.cos(a) * 2.35, 0.12, 7 + Math.sin(a) * 2.35); s.scale.y = 0.6; }
      for (let i = 0; i < 9; i++) { const a = 3.4 + i * 0.28, h = 0.9 + (i % 3) * 0.3; cyl(0.025, 0.04, h, 0x4a7a3a, 8.5 + Math.cos(a) * 2.4, h / 2, 7 + Math.sin(a) * 2.4, undefined, 5); }
      for (let i = 0; i < 7; i++) { const r = rng(5 + i); glowBall(0.045, 0xdfeaff, 8.5 + (r() - 0.5) * 3.2, 0.08, 7 + (r() - 0.5) * 2.6, 0); }
      for (let i = 0; i < 3; i++) { const m = new THREE.Mesh(new THREE.TorusGeometry(1, 0.03, 6, 28), new THREE.MeshBasicMaterial({color: 0xdfeaff, transparent: true, opacity: 0})); m.rotation.x = Math.PI / 2; m.visible = false; scene.add(m); S.rings.push({m, t: -1}); }
      S.ripple = (x, z) => { const r = S.rings.find(q => q.t < 0) || S.rings[0]; r.t = 0; r.m.position.set(x, 0.09, z); r.m.visible = true; };
      fx.push(dt => { for (const r of S.rings) if (r.t >= 0) { r.t += dt; const s = 0.2 + r.t * 1.0; r.m.scale.set(s, s, s); r.m.material.opacity = 0.7 * Math.max(0, 1 - r.t / 1.4); if (r.t > 1.4) { r.t = -1; r.m.visible = false; } } }); }
    const crowns = [];
    function palm(x, z, h, lean) {
      const g = grp(x, 0, z); const tr = cyl(0.14, 0.24, h, 0x7a5a3a, Math.sin(lean) * h / 2, h / 2, 0, g, 8); tr.rotation.z = -lean;
      const cr = new THREE.Group(); cr.position.set(Math.sin(lean) * h, h, 0); g.add(cr);
      for (let i = 0; i < 8; i++) { const pv = new THREE.Group(); pv.rotation.y = i * Math.PI / 4; cr.add(pv); const lp = new THREE.Group(); lp.rotation.x = 0.35 + (i % 2) * 0.25; pv.add(lp); box(0.45, 0.04, 2.1, i % 2 ? 0x3f7a3a : 0x4f8a42, 0, 0, 1.05, lp); }
      ball(0.2, 0x5a3a22, 0.15, -0.1, 0.1, cr); ball(0.2, 0x5a3a22, -0.15, -0.1, -0.1, cr); solid(x, z, 0.8, 0.8); crowns.push(cr); }
    palm(11.6, 5.6, 4.4, 0.12); palm(5.0, 8.6, 3.6, -0.15);
    fx.push((dt, t) => crowns.forEach((cr, i) => { cr.rotation.z = Math.sin(t * 0.9 + i * 2) * 0.03; cr.rotation.x = Math.sin(t * 0.7 + i) * 0.03; }));

    // ── 물통(물 길어다 붓는 곳) — 오늘 길은 만큼 물이 차오른다
    { const TX = 4.6, TZ = 3.0; box(2.0, 0.08, 1.0, 0x6a4a2e, TX, 0.04, TZ);
      box(2.0, 0.8, 0.09, 0x7a5a3a, TX, 0.4, TZ - 0.46); box(2.0, 0.8, 0.09, 0x7a5a3a, TX, 0.4, TZ + 0.46); box(0.09, 0.8, 1.0, 0x7a5a3a, TX - 0.96, 0.4, TZ); box(0.09, 0.8, 1.0, 0x7a5a3a, TX + 0.96, 0.4, TZ);

    // ── 별 보는 담요 + 마른 풀·돌·낙타 짐
    box(1.7, 0.05, 3.0, 0xa8452f, 4, 0.03, -6.2); for (const dx of [-0.5, 0, 0.5]) box(0.12, 0.052, 3.0, 0xe8d8b0, 4 + dx, 0.032, -6.2);
    for (const [x, z, r] of [[-1.5, 6.8, 0.35], [14, 8, 0.5], [-14, 6, 0.4], [-9.5, 6, 0.3], [2.5, -9, 0.45], [15, -9.5, 0.4]]) { const m = ball(r, 0x7a7266, x, 0.12, z); m.scale.y = 0.6; }
    for (const [x, z] of [[-4.5, 4.8], [14.5, 2], [-14, 1.5], [1, 8.8]]) for (let i = 0; i < 5; i++) { const t = cyl(0.01, 0.035, 0.5, 0x8a7a44, x + (i - 2) * 0.08, 0.25, z + (i % 2) * 0.08, undefined, 4); t.rotation.z = (i - 2) * 0.22; }
    for (const [x, z, ry] of [[-9.2, 3.6, 0.5], [-8.4, 3.9, 1.2]]) { box(0.7, 0.45, 0.45, 0x8a5a2a, x, 0.23, z).rotation.y = ry; }

    // ── 사람 둘 — 불 옆에 한 명, 천막과 낙타 사이를 오가는 한 명
    const look = {coat: 0x8a5a2a, pants: 0x4a3f34, hat: {type: 'bandana', c: 0x2f4a6a}, scarf: 0xe0d0a8};
    npc(look, [[1.8, -1.4]], {face: -2.06, idle: ['sip', 'wave']});
    npc({...look, coat: 0x3f6a5a, hairStyle: 'bob', hair: 0x2a2018, hat: {type: 'bandana', c: 0xc9a050}}, [[-3, -0.6], [-9.6, -1.4]], {speed: 1.3, idle: ['stretch']});

    // 가끔 별똥별 하나 — 오늘 밤하늘 구경만(기록엔 안 남음)
    setInterval(() => { if (document.visibilityState === 'visible' && Math.random() < 0.5) meteor(); }, 28000);
  },
  lamps: [],
  onTime() { S.setSky && S.setSky(); },
  acts: [
    {id: 'camel', icon: '🐪', label: '낙타 곁', spot: [-5.2, 2.3], face: Math.PI, run(c, done) {
      const D = daily(c.now()), n = c.count('camel'); c.doAct(c.player, 'crouch'); S.look = 4; c.beep(160, .5, 0, 'sine', .03);
      setTimeout(() => c.dialog('낙타 곁에서', `${c.hm(c.now())} · 오늘 ${n}번째 쉼`,
        `<p>${CAMEL[(n - 1) % CAMEL.length]}</p><p style="font-size:16px">「${D.fact}」</p>` + (n > 1 ? '<p style="color:#7a6e5e;font-size:13px">오늘의 한마디는 하루에 하나. 내일은 다른 이야기.</p>' : ''),
        [['일어나기', () => { if (n === 3) c.stamp('낙타 단짝', '오늘 세 번째 쉼'); done(); }, 'main']]), 1300); }},
    {id: 'slide', icon: '🏜', label: '언덕 미끄럼', spot: [11.5, 3.6], face: Math.PI, run(c, done) {
      const P = c.player, board = c.box(0.55, 0.07, 1.5, 0x8a4a2a, 0, 0.04, 0.05, P), T = 18;
      const place = (x, z) => P.position.set(x, hD(x, z) + 0.02, z);
      const back = (z0, after) => { const x0 = P.position.x; P.rotation.z = 0; tw(900, u => place(x0 + (DUNE.x - x0) * u, z0 + (3.6 - z0) * u), () => { P.rotation.set(0, Math.PI, 0); P.position.set(DUNE.x, 0, 3.6); P.remove(board); after(); }); };
      c.toast('🏜 언덕 위까지 올라가요. 판을 들고', 1800);
      tw(1600, u => { place(DUNE.x, 3.6 - 6.6 * u); P.rotation.y = Math.PI; }, () => { P.rotation.y = 0; c.doAct(P, 'cheer');
        c.play(`<h3>모래 언덕 미끄럼</h3>
          <p style="font-size:13px;color:#7a6e5e;margin:2px 0 8px">판이 한쪽으로 기울지 않게 ◀ ▶ 로 잡아 주세요(방향키도 돼요). 18초만 버티면 끝!</p>
          <div style="position:relative;height:40px;background:linear-gradient(90deg,#d98a6a 0 15%,#e8d49a 15% 33.5%,#8fc58a 33.5% 66.5%,#e8d49a 66.5% 85%,#d98a6a 85%);border:1.5px solid #2b2620;border-radius:6px;overflow:hidden"><div id="bd" style="position:absolute;top:10px;left:50%;width:46px;height:14px;margin-left:-23px;background:#8a4a2a;border:1.5px solid #2b2620;border-radius:7px"></div></div>
          <div style="height:6px;background:#e0d4bc;border-radius:3px;margin:10px 0 4px"><div id="pg" style="height:100%;width:0;background:#c9472f;border-radius:3px"></div></div>
          <p id="msg" style="min-height:22px;font-size:14px;margin:4px 0"></p><div class="row" id="ro" style="justify-content:center"><button class="btn main" id="go">출발</button><button class="btn" id="qt">그만두기</button></div>`,
        (el, close) => {
          el.style.alignItems = 'flex-start'; el.style.paddingTop = '64px';
          const bd = el.querySelector('#bd'), pg = el.querySelector('#pg'), msg = el.querySelector('#msg'), ro = el.querySelector('#ro');
          const end = () => { el.style.alignItems = ''; el.style.paddingTop = ''; close(); c.busy = true; };
          let alive = false, dir = 0, x = 0, v = 0, w = 0, t = 0, green = 0, last = 0, fin = false;
          const kd = e => { const k = e.key.toLowerCase(); if (k === 'arrowleft' || k === 'a') dir = -1; if (k === 'arrowright' || k === 'd') dir = 1; };
          const ku = e => { const k = e.key.toLowerCase(); if ((k === 'arrowleft' || k === 'a') && dir < 0) dir = 0; if ((k === 'arrowright' || k === 'd') && dir > 0) dir = 0; };

            ro.innerHTML = ''; if (fell) { c.doAct(P, 'crouch'); c.beep(150, .3, 0, 'sawtooth', .04); msg.innerHTML = `<b>엉덩방아!</b> ${sec.toFixed(1)}초 버텼어요<br><span style="font-size:12px;color:#7a6e5e">모래는 푹신해요</span>`; }
            else { c.beep(880, .08); c.beep(1180, .1, .1); msg.innerHTML = `<b>끝까지 탔어요!</b> 한가운데 ${green.toFixed(1)}초`; }
            setTimeout(() => { end(); const cur = P.position.z; back(Math.min(cur, 3.6), () => { if (!fell) { c.doAct(P, 'cheer'); c.stamp('쭈우욱', `한가운데 ${green.toFixed(1)}초`); } else c.toast(`🏜 ${sec.toFixed(1)}초. 최고 ${best.toFixed(1)}초`); setTimeout(done, fell ? 600 : 1300); }); }, 1700); };
          const hold = (id, d) => { const b = el.querySelector(id); b.onpointerdown = e => { e.preventDefault(); dir = d; }; for (const ev of ['onpointerup', 'onpointerleave', 'onpointercancel']) b[ev] = () => { if (dir === d) dir = 0; }; };

          el.querySelector('#go').onclick = () => { ro.innerHTML = `<button class="btn" id="bl" style="width:110px;height:54px;font-size:22px;touch-action:none;user-select:none">◀</button><button class="btn" id="br" style="width:110px;height:54px;font-size:22px;touch-action:none;user-select:none">▶</button>`;
            hold('#bl', -1); hold('#br', 1); msg.textContent = '쭈우욱 내려가는 중…'; alive = true; last = performance.now(); P.rotation.z = 0; requestAnimationFrame(frame); };
        }); }); }},
    {id: 'star', icon: '🌠', label: '별 보기', spot: [4, -3.6], face: Math.PI, run(c, done) {
      const D = daily(c.now()), P = c.player, day = c.today(), seen = day.met || 0, left = D.met - seen, n = c.count('star');
      const shadow = P.children.find(o => o.geometry && o.geometry.type === 'CircleGeometry');

        if (shadow) shadow.visible = false; S.bright = 1; S.setSky(); c.toast('🌠 누워서 하늘을 봐요. 눈이 어둠에 익는 중', 2400);
        const batch = Math.min(left, 2 + (Math.random() * 2 | 0));

        setTimeout(() => {
          if (batch) { day.met = seen + batch; c.DB.meteors = (c.DB.meteors || 0) + batch; c.save(); }

            setTimeout(done, 1200); }); }, 1600 + Math.max(batch, 1) * 2400 + 800);
      })); }},
    {id: 'water', icon: '🪣', label: '물 긷기', spot: [8.5, 4.1], face: 0, run(c, done) {
      const n = c.count('water'), bk = new c.THREE.Group(); c.cyl(0.11, 0.08, 0.2, 0x7a5a3a, 0, 0.12, 0, bk); c.cyl(0.095, 0.095, 0.01, 0x3a78b0, 0, 0.225, 0, bk);

    return `<p style="font-size:13px;color:#7a6e5e">오늘 밤하늘: ${D.moon} · 본 별똥별 ${seen}/${D.met}개<br>물통 ${Math.min(6, w)}/6 · 언덕 최고 ${(c.DB.slideBest || 0).toFixed(1)}초 · 지금까지 별똥별 ${c.DB.meteors || 0}개</p><p style="font-size:13px">${D.fact}</p>`; },
