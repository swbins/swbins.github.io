<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>붕어빵 노점</title></head><body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import {start} from '../mini.js';

const LOOKS = [{coat: 0x6b5a4a, hairStyle: 'bob'}, {coat: 0x3a4a3a, glasses: true}, {coat: 0xd9c29a, hairStyle: 'bun', hair: 0x141414}, {coat: 0x7a3a3a, hat: {type: 'beanie', c: 0xc9472f}}, {coat: 0x44506a, scarf: 0xe0b040}];
let queue = [], filling = '팥';

start({
  key: 'bungeo', title: '붕어빵 노점', enter: '노점 앞으로', nickIcon: '🐟',
  nick: [['따끈한', '바삭한', '꼬리부터 먹는', '머리부터 먹는', '팥 듬뿍', '슈크림파'], ['붕어빵', '틀', '종이봉투', '반죽', '천 원', '호빵']],
  intro: '<p>겨울 길모퉁이 붕어빵 노점.<br>타이밍 맞춰 뒤집고, 줄 선 손님에게 건네요.</p>',
  floor: {w: 26, d: 22, c1: '#9a948a', c2: '#a8a298', around: 0x7a766e},
  startPos: [0, 6], cam: {h: 9, back: 11},
  build(c) {
    const {box, cyl, sign, solid, npc, fx, THREE, scene, glowBall} = c;
    // 수레 노점
    box(5, 1.1, 2, 0x2b4a8a, 0, 0.55, -3); box(5.2, 0.1, 2.2, 0xb8bcc2, 0, 1.12, -3); solid(0, -3, 5, 2);
    for (const x of [-2.4, 2.4]) box(0.1, 2.6, 0.1, 0x888888, x, 2.4, -3.9);
    const aw = box(5.6, 0.12, 2.6, 0xc9472f, 0, 3.7, -3.2); aw.rotation.x = 0.15;
    sign(['붕어빵', '3개 2천 원'], 3, 1, '#f4ecdc', '#c9472f', 0, 3.1, -3.95, 0, [80, 40]);
    // 틀 6칸
    c.molds = [];
    for (let i = 0; i < 6; i++) { const m = box(0.55, 0.12, 0.8, 0x2b2b2b, -1.6 + i * 0.64, 1.25, -3); c.molds.push(m);
      const f = c.box(0.42, 0.06, 0.66, 0xd9a050, -1.6 + i * 0.64, 1.33, -3); f.visible = i % 2 === 0; }
    // 김
    const steam = []; for (let i = 0; i < 10; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: .25})); m.userData.t = Math.random() * 2; scene.add(m); steam.push(m); }
    fx.push(dt => steam.forEach((m, i) => { m.userData.t += dt; const k = m.userData.t % 2; m.position.set(-1.6 + (i % 6) * 0.64, 1.5 + k * 1.3, -3); m.material.opacity = .3 * (1 - k / 2); m.scale.setScalar(1 + k); }));
    // 사장님
    c.boss = npc({coat: 0x55606e, hat: {type: 'beanie', c: 0x2b2b2b}, apron: 0xf4ecdc}, [[0, -4.5]], {face: 0, idle: ['wave']});
    // 눈 내리는 길
    const N = 500, g = new THREE.BufferGeometry(), p = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { p[i * 3] = (Math.random() - .5) * 30; p[i * 3 + 1] = Math.random() * 12; p[i * 3 + 2] = (Math.random() - .5) * 26; }
    g.setAttribute('position', new THREE.BufferAttribute(p, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({color: 0xffffff, size: 3, sizeAttenuation: false})));
    fx.push(dt => { for (let i = 0; i < N; i++) { p[i * 3 + 1] -= dt * 1.2; if (p[i * 3 + 1] < 0) p[i * 3 + 1] = 12; } g.attributes.position.needsUpdate = true; });
    // 가게 벽·가로등
    box(26, 6, 0.5, 0x8a7a6a, 0, 3, -10); box(1, 6, 0.5, 0x6a5a4a, -6, 3, -9.7);
    cyl(0.1, 0.1, 5, 0x333333, 6, 2.5, 2); glowBall(0.3, 0xffe2a0, 6, 5.1, 2, 0);
    // 줄 선 손님 — 3명까지
    for (let i = 0; i < 3; i++) queue.push(npc(LOOKS[i], [[1.2 + i * 1.3, -0.6]], {face: Math.PI}));
  },
  lamps: [[6, 2], [0, -2]],
  acts: [
    {id: 'bake', icon: '🔥', label: '굽기', spot: [0, -4.4 + 2.6], face: Math.PI, run(c, done) {
      c.player.rotation.y = Math.PI;
      c.play(`<h3>뒤집기 타이밍</h3><p style="font-size:13px;color:#7a6e5e">막대가 노란 칸에 들어왔을 때 「뒤집기」 — 두 번</p>
        <div style="position:relative;height:28px;border:2px solid #2b2620;border-radius:4px;background:#e6dcc8;margin:14px 0">
          <div style="position:absolute;left:62%;width:16%;top:0;bottom:0;background:#e0b040"></div>
          <div id="bar" style="position:absolute;left:0;width:4px;top:-4px;bottom:-4px;background:#c9472f"></div></div>
        <p id="msg" style="min-height:24px"></p><div class="row" style="justify-content:center"><button class="btn main" id="flip">뒤집기</button></div>`,
        (el, close) => {
          let x = 0, sp = 0.45 + Math.random() * 0.25, round = 0, good = 0, alive = true, last = performance.now();
          const bar = el.querySelector('#bar'), msg = el.querySelector('#msg');
          (function tick(t) { if (!alive) return; x += (t - last) / 1000 * sp; last = t; if (x > 1) { x = 0; } bar.style.left = (x * 100) + '%'; requestAnimationFrame(tick); })(last);
          el.querySelector('#flip').onclick = () => {
            const ok = x >= 0.62 && x <= 0.78; c.beep(ok ? 1200 : 300, .1); if (ok) good++;
            msg.textContent = ok ? '치익— 딱 좋아요' : x < 0.62 ? '아직 덜 익었어요' : '앗, 좀 탔어요'; round++; x = 0; sp *= 1.25;
            if (round === 2) { alive = false;
              const r = good === 2 ? ['황금 붕어빵', 'gold'] : good === 1 ? ['그럭저럭 붕어빵', 'ok'] : ['살짝 탄 붕어빵', 'burnt'];
              const n = c.count('bake'); if (good === 2) c.count('gold');
              setTimeout(() => { close(); c.stamp(good === 2 ? '황금!' : good === 1 ? '구웠다' : '탔다…', `${r[0]} · 오늘 ${n}판`); c.doAct(c.boss.o, good === 2 ? 'cheer' : 'wave'); done(); }, 700); }
          };
        });
    }},
    {id: 'fill', icon: '🫘', label: '팥/슈크림', run(c, done) {
      filling = filling === '팥' ? '슈크림' : '팥'; c.count('fill');
      c.toast(filling === '팥' ? '🫘 팥으로 — 원조는 역시 팥' : '🍮 슈크림으로 — 달달한 쪽', 2000); done(); }},
    {id: 'sell', icon: '🛍', label: '건네기', spot: [0.6, 0.4], face: 0, run(c, done) {
      const g = queue.shift(); if (!g) { c.toast('줄이 비었어요. 곧 또 와요'); done(); return; }
      c.player.rotation.y = Math.atan2(g.o.position.x - c.player.position.x, g.o.position.z - c.player.position.z);
      c.doAct(c.player, 'throw'); c.doAct(g.o, 'cheer'); const n = c.count('sell');
      const said = ['고마워요!', `${filling} 맞죠? 좋아요`, '따뜻하다~', '하나 더 넣어 주셨네요?'][Math.random() * 4 | 0];
      c.toast(`🛍 「${said}」 · 오늘 ${n}봉지`);
      // 손님은 떠나고 잠시 뒤 줄 끝에 새 손님
      g.path = [[g.o.position.x, g.o.position.z], [12, 8]]; g.seg = 0; g.wait = 0.4; g.speed = 2.2;
      setTimeout(() => { g.path = [[1.2 + 2 * 1.3, -0.6]]; g.o.position.set(12, 0, 8); g.face = Math.PI;
        g.path = [[12, 8], [1.2 + 2 * 1.3, -0.6]]; g.seg = 0; g.wait = 0;
        setTimeout(() => { g.path = [[g.o.position.x, g.o.position.z]]; }, 6000); queue.push(g);
        queue.forEach((q, i) => { if (q !== g) { q.path = [[q.o.position.x, q.o.position.z], [1.2 + i * 1.3, -0.6]]; q.seg = 0; q.wait = 0.2; setTimeout(() => q.path = [[1.2 + i * 1.3, -0.6]], 1500); } });
      }, 3500);
      setTimeout(done, 1000); }},
    {id: 'eat', icon: '😋', label: '호호', run(c, done) {
      c.doAct(c.player, 'sip'); const n = c.count('eat');
      c.toast(n === 1 ? (filling === '팥' ? '😋 꼬리부터. 팥이 꼬리까지 찼어요' : '😋 슈크림이 흘러요') : `😋 ${n}개째… 사장님이 보고 있어요`); setTimeout(done, 2200); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">황금 붕어빵 모두 ${c.DB.total.gold || 0}판</p>`,
  onEnter(c) { c.toast('🐟 「어서 와요. 틀 좀 봐 줄래요?」', 3000); },
});
</script></body></html>
