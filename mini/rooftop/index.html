<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>옥상 별 캠핑</title></head><body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import {start} from '../mini.js';

// 별자리 — 점(0~100 좌표)과 잇는 순서. 날짜마다 하나
const SKY = [
  {n: '북두칠성', p: [[10, 30], [24, 26], [36, 32], [48, 38], [56, 56], [76, 58], [80, 38]]},
  {n: '카시오페이아', p: [[10, 40], [28, 62], [46, 42], [64, 64], [86, 38]]},
  {n: '오리온 허리띠', p: [[20, 20], [30, 50], [44, 48], [58, 46], [70, 80]]},
  {n: '백조자리', p: [[50, 10], [50, 34], [50, 58], [50, 86], [22, 40], [78, 40]]},
  {n: '작은곰', p: [[80, 14], [66, 24], [54, 36], [44, 52], [30, 60], [24, 80], [44, 82]]},
  {n: '거문고자리', p: [[50, 14], [40, 40], [62, 44], [66, 74], [44, 70]]},
  {n: '사자자리', p: [[80, 20], [66, 16], [56, 26], [60, 40], [46, 54], [24, 60], [16, 44]]},
];

start({
  key: 'rooftop', title: '옥상 별 캠핑', enter: '옥상 문 열기', time: 'night', nickIcon: '🌙',
  nick: [['잠 못 드는', '별 세는', '라면 끓이는', '조용한', '소원 많은', '옥상의'], ['텐트', '랜턴', '침낭', '망원경', '버너', '별똥별']],
  intro: '<p>도시 옥상의 작은 텐트.<br>별 잇고, 라면 끓이고, 소원 하나 날려요.</p>',
  floor: {w: 22, d: 18, c1: '#6a7a6a', c2: '#748474'},
  bg: {night: 0x070b1c}, startPos: [0, 5], cam: {h: 9, back: 11},
  build(c) {
    const {box, cyl, ball, solid, fx, THREE, scene, glowBall} = c;
    // 난간·물탱크·옥상 문
    for (const [w, x, z, ry] of [[22, 0, -9, 0], [18, -11, 0, Math.PI / 2], [18, 11, 0, Math.PI / 2]]) { const r = box(w, 0.08, 0.08, 0xb8bcc2, x, 1.1, z); r.rotation.y = ry; }
    for (let i = -10; i <= 10; i += 2) { box(0.06, 1.1, 0.06, 0xb8bcc2, i, 0.55, -9); }
    cyl(1.4, 1.4, 2.6, 0x4a7ab0, 8, 1.3, -6); solid(8, -6, 2.8, 2.8);
    box(2.4, 3, 2, 0xd9d2c4, -8.6, 1.5, 6.5); box(1, 2, 0.06, 0x6b4424, -8.6, 1.1, 5.48); solid(-8.6, 6.5, 2.4, 2);
    // 텐트(사각뿔)·매트·랜턴·버너
    const tent = new THREE.Mesh(new THREE.ConeGeometry(2.2, 2.6, 4), new THREE.MeshLambertMaterial({color: 0xe0b040, emissive: 0x403010})); tent.position.set(-3.5, 1.3, -4.5); tent.rotation.y = Math.PI / 4; tent.castShadow = true; scene.add(tent); solid(-3.5, -4.5, 3, 3);
    const door = new THREE.Mesh(new THREE.PlaneGeometry(1, 1.4), new THREE.MeshBasicMaterial({color: 0xffd27a})); door.position.set(-3.5, 0.7, -3.0); scene.add(door);
    box(3, 0.05, 2, 0x3a6ab0, 1.5, 0.03, -2.5);
    c.lantern = glowBall(0.22, 0xffd27a, 0.2, 0.4, -3.3, 10, 8);
    cyl(0.35, 0.4, 0.3, 0x555555, 2.8, 0.15, -3.2); c.pot = cyl(0.3, 0.28, 0.3, 0xc9a060, 2.8, 0.45, -3.2);
    // 별 하늘
    const N = 900, g = new THREE.BufferGeometry(), p = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { const a = Math.random() * Math.PI * 2, e = Math.random() * 1.1 + 0.03, R = 90; p[i * 3] = Math.cos(a) * Math.cos(e) * R; p[i * 3 + 1] = Math.sin(e) * R; p[i * 3 + 2] = Math.sin(a) * Math.cos(e) * R - 20; }
    g.setAttribute('position', new THREE.BufferAttribute(p, 3)); const stars = new THREE.Points(g, new THREE.PointsMaterial({color: 0xffffff, size: 2, sizeAttenuation: false, transparent: true})); scene.add(stars);
    fx.push((dt, t) => { stars.material.opacity = 0.75 + Math.sin(t * 2) * 0.2; });
    // 아래 도시 불빛(옥상 바깥, 낮게)
    const cg = new THREE.BufferGeometry(), cp = new Float32Array(1500 * 3);
    for (let i = 0; i < 1500; i++) { const a = Math.random() * Math.PI * 2, r = 16 + Math.random() * 70; cp[i * 3] = Math.cos(a) * r; cp[i * 3 + 1] = -8 - Math.random() * 3; cp[i * 3 + 2] = Math.sin(a) * r; }
    cg.setAttribute('position', new THREE.BufferAttribute(cp, 3)); scene.add(new THREE.Points(cg, new THREE.PointsMaterial({color: 0xffc070, size: 2, sizeAttenuation: false})));
    // 이따금 별똥별
    const met = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.25, 8, 6), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true})); met.visible = false; scene.add(met);
    let mt = 4; c.meteor = () => { mt = 0; };
    fx.push(dt => { mt += dt; if (mt > 14) mt = 0; met.visible = mt < 1.2; if (met.visible) { met.position.set(-30 + mt * 50, 40 - mt * 18, -50); met.rotation.z = 1.2; met.material.opacity = 1 - mt / 1.2; } });
    // 고양이 친구 대신 옆집 옥상 이웃 하나
    c.npc({coat: 0x6b5a4a, hairStyle: 'long', hair: 0x2a2018}, [[6, 2]], {face: -Math.PI / 2, idle: ['wave', 'stretch']});
  },
  lamps: [],
  acts: [
    {id: 'stars', icon: '✨', label: '별 잇기', spot: [0, -0.5], face: Math.PI, run(c, done) {
      const d = c.now(), S = SKY[(d.getDate() + d.getMonth() * 3) % SKY.length];
      c.play(`<h3>오늘의 별자리</h3><p style="font-size:13px;color:#7a6e5e">밝은 별부터 차례로 눌러 이어요 (1번이 깜빡여요)</p>
        <svg id="sv" viewBox="0 0 100 100" style="width:100%;max-width:320px;background:#0b1030;border-radius:6px;touch-action:none"></svg><p id="msg"></p>`,
        (el, close) => {
          const sv = el.querySelector('#sv'); let k = 0;
          const draw = () => { sv.innerHTML = S.p.slice(0, k).map((q, i) => i ? `<line x1="${S.p[i - 1][0]}" y1="${S.p[i - 1][1]}" x2="${q[0]}" y2="${q[1]}" stroke="#ffd27a" stroke-width="1"/>` : '').join('')
            + S.p.map((q, i) => `<circle data-i="${i}" cx="${q[0]}" cy="${q[1]}" r="${i === k ? 3.4 : 2.4}" fill="${i < k ? '#ffd27a' : '#ffffff'}"><animate attributeName="opacity" values="1;.4;1" dur="${i === k ? .8 : 3}s" repeatCount="indefinite"/></circle>
              <circle data-i="${i}" cx="${q[0]}" cy="${q[1]}" r="8" fill="transparent"/>`).join(''); };
          draw();
          sv.onclick = e => { const i = +e.target.dataset.i; if (isNaN(i)) return;
            if (i !== k) { c.beep(220, .08); el.querySelector('#msg').textContent = '그 별 말고, 깜빡이는 별'; return; }
            k++; c.beep(600 + k * 90, .1, 0, 'sine'); draw();
            if (k === S.p.length) { const got = new Set(c.DB.sky || []); const isNew = !got.has(S.n); got.add(S.n); c.DB.sky = [...got]; c.count('stars');
              el.querySelector('#msg').innerHTML = `<b>${S.n}</b>${isNew ? ' — 새로 찾았어요!' : ''}<br><span style="font-size:13px;color:#7a6e5e">모은 별자리 ${got.size}/${SKY.length} · 내일은 다른 별자리</span>`;
              setTimeout(() => { close(); c.stamp('✨', S.n); done(); }, 1800); } };
        }); }},
    {id: 'ramen', icon: '🍜', label: '라면', spot: [2.8, -1.9], face: Math.PI, run(c, done) {
      c.beep(200, .5, 0, 'sine', .04); c.toast('🔥 물 끓이는 중…', 1500);
      setTimeout(() => { c.doAct(c.player, 'sip'); const n = c.count('ramen'); c.toast(n === 1 ? '🍜 밤에 먹는 라면이 제일 맛있어요' : `🍜 ${n}그릇째… 내일 얼굴 부어요`); setTimeout(done, 2200); }, 1600); }},
    {id: 'wish', icon: '🏮', label: '소원', run(c, done) {
      c.dialog('소원 하나', '이 기기에만 남아요 · 하늘로 올라가요', `<input id="wsh" maxlength="40" placeholder="예: 이번 주는 칼퇴" style="width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1.5px solid #2b2620;border-radius:4px;font-family:inherit">`,
        [['그만두기', done], ['날리기', () => {
          const w = (document.getElementById('wsh')?.value || '').trim() || '오늘보다 내일';
          c.DB.wishes = [...(c.DB.wishes || []), {d: c.dkey(c.now()), w}].slice(-30); c.count('wish');
          const l = c.glowBall(0.35, 0xffb070, c.player.position.x, 2.2, c.player.position.z, 6, 6); let t = 0;
          c.fx.push(dt => { t += dt; l.position.y = 2.2 + t * 1.6; l.position.x += Math.sin(t) * dt * 0.6; l.visible = t < 14; });
          c.doAct(c.player, 'cheer'); c.toast(`🏮 「${w}」 — 올라가요`, 3200); setTimeout(done, 1500); }, 'main']]);
      setTimeout(() => document.getElementById('wsh')?.focus(), 50); }},
    {id: 'lie', icon: '🌠', label: '올려다보기', spot: [1.5, -2.5], run(c, done) {
      c.doAct(c.player, 'crouch'); c.meteor(); const n = c.count('lie');
      setTimeout(() => c.toast(n % 3 === 1 ? '🌠 방금 별똥별! 소원 빌었어요?' : ['🌙 바람이 시원해요', '🌙 멀리 차 소리', '🌙 내일 걱정은 내일'][n % 3]), 900); setTimeout(done, 1600); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">모은 별자리: ${(c.DB.sky || []).join(' · ') || '아직 없음'}</p>` + ((c.DB.wishes || []).length ? `<p style="font-size:13px">최근 소원: 「${c.DB.wishes.at(-1).w}」</p>` : ''),
  onEnter(c) { c.toast('🌙 바람 좋다. 오늘 별 잘 보여요', 3000); },
});
</script></body></html>
