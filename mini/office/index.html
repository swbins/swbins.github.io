function now(){

const SOLAR=['01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25'];

const shift=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return dkey(d);};
function holiday(d){   // → {name, kind:'seol'|'chu'|'day', off, eve}  eve = 연휴 앞 사흘(꾸미기만)
  const k=dkey(d);
  for(const kind of ['seol','chu'])for(const s of LUNAR[kind]){
    if([-1,0,1].some(n=>shift(s,n)===k))return {name:kind==='seol'?'설 연휴':'추석 연휴',kind,off:true};
    if([-4,-3,-2].some(n=>shift(s,n)===k))return {name:kind==='seol'?'설':'추석',kind,off:false,eve:true};
  }
  if(SOLAR.includes(k.slice(5)))return {name:'공휴일',kind:'day',off:true};
  return null;
}

  const d=now(),h=d.getHours()+d.getMinutes()/60;

    const tgt=r[Math.min(m.seg+1,r.length-1)],dx=tgt[0]-m.o.position.x,dz=tgt[1]-m.o.position.z,dist=Math.hypot(dx,dz);
    if(dist<0.15){
      m.seg++;
      if(m.seg>=r.length-1){                       // 끝 — 멈춰 있는 길(2점)은 그대로, 아니면 처음부터 다시

        m.seg=0;m.wait=3+Math.random()*6;m.o.visible=false;m.o.position.set(r[0][0],0,r[0][1]);continue;
      }
    }else{const s=Math.min(dist,2.6*dt);m.o.position.x+=dx/dist*s;m.o.position.z+=dz/dist*s;m.o.rotation.y=Math.atan2(dx,dz);}

  }
}

/* ── 걷기 ─────────────────────── */
let target=null,onArrive=null,busy=false;const keys={};
function goTo(x,z,then){target=new THREE.Vector3(x,0,z);onArrive=then||null;}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{
  if(busy)return;
  mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,camera);
  const h=ray.intersectObject(floorHit)[0];if(h)goTo(h.point.x,h.point.z);
});

/* ── 동작 넷 ─────────────────────── */
function nearestGate(){return GATES.reduce((a,b)=>Math.abs(b.x-player.position.x)<Math.abs(a.x-player.position.x)?b:a);}
const ACTS={
  in(){
    const d=now(),t=today();
    if(isOff(d)){toast('🛋 오늘은 쉬는 날이에요. 출근 찍기는 평일만');return;}
    if(t.in){toast(`오늘은 ${t.in} 에 이미 찍었어요`);return;}
    if(t.out){toast('오늘은 이미 퇴근했어요');return;}
    const g=nearestGate();const before=player.position.z>GATE_Z;
    busy=true;
    goTo(g.x,before?GATE_Z+1.6:GATE_Z-1.6,()=>{
      player.rotation.y=before?Math.PI:0;doAct(player,'wave');
      setTimeout(()=>{
        beep(1320);beep(1760,.12,.13);g.t=1.2;
        const tm=hm(now());t.in=tm;save();
        const late=mins(tm)>9*60;
        stamp('출근',tm,late?'지각… 아무도 못 봤어요':'연속 '+streak()+'일째');
        refreshState();
        count('/in').then(r=>{if(r&&r.rank)setTimeout(()=>toast(`🪪 오늘 전국 ${r.rank}번째 출근`,3200),1900);});
        setTimeout(()=>goTo(g.x,GATE_Z-2.4,()=>{busy=false;}),700);
      },500);
    });
  },
  coffee(){
    busy=true;goTo(COFFEE.x,COFFEE.z,()=>{
      player.rotation.y=-Math.PI/2;beep(520,.3);
      setTimeout(()=>{cup.visible=true;player.rotation.y=Math.PI/2;doAct(player,'sip');
        const t=today();t.coffee=(t.coffee||0)+1;save();
        toast(['☕ 오늘 '+t.coffee+'잔째','☕ 살 것 같다','☕ 아아 한 잔 — 오늘 '+t.coffee+'잔째','☕ 이게 없으면 일 못 해요'][t.coffee>3?3:Math.random()*3|0]);
        setTimeout(()=>{cup.visible=false;busy=false;},2300);},600);
    });
  },
  stretch(){
    target=null;doAct(player,'stretch');
    const h=now().getHours();
    const MENU=['김치찌개','제육볶음','돈가스','국밥','쌀국수','비빔밥','짜장면','샐러드','칼국수','순두부'];
    toast(isLunch()?'🙆 오늘 점심은… '+MENU[(now().getDate()*7+now().getMonth())%MENU.length]+'?':FRIDAY&&h>=15?'🙆 불금까지 조금만':h<11?'🙆 아직 오전이라니…':h<14?'🙆 점심 먹고 졸려요':h<18?'🙆 퇴근까지 '+(18-h)+'시간쯤':'🙆 이제 집에 가요');
  },
  out(){
    const d=now(),t=today();
    if(t.out){toast('오늘은 '+t.out+' 에 퇴근했어요');return;}
    const E=ELEV.reduce((a,b)=>Math.abs(b.x-player.position.x)<Math.abs(a.x-player.position.x)?b:a);
    busy=true;
    goTo(E.x,-11.6,()=>{
      player.rotation.y=Math.PI;E.want=1;beep(880,.25);
      setTimeout(()=>goTo(E.x,-13.2,()=>{
        player.rotation.y=0;
        const tm=hm(now()),m=mins(tm);
        if(!isOff(d)&&t.in){t.out=tm;save();outCount=count('/out');}else outCount=null;
        if(m>=18*60&&m<=18*60+30)doAct(player,'cheer');else doAct(player,'wave');
        setTimeout(()=>{E.want=0;},900);
        setTimeout(()=>{
          $('fade').style.opacity=.92;
          setTimeout(()=>leaveCard(tm,m,d,t),900);
        },1900);
      }),900);
    });
  }
};
document.querySelectorAll('#acts .btn').forEach(b=>b.onclick=()=>{if(busy&&b.dataset.a!=='stretch')return;ACTS[b.dataset.a]();});

function leaveCard(tm,m,d,t){
  let title,line;
  if(isOff(d)){title='주말 출근…?';line='쉬는 날인데 로비까지 왔네요. 오늘 기록은 남기지 않아요.';}
  else if(!t.in){title='퇴근';line='출근 도장을 안 찍었어요. 내일은 게이트에서 꼭 찍어요.';}
  else if(m<17*60){title='조퇴…? 🤫';line=`아직 ${tm}. 아무한테도 말 안 할게요.`;}
  else if(m<18*60){title='살짝 일찍 🫢';line=`${tm} 퇴근. 이 정도는 괜찮아요.`;}
  else if(m<=18*60+30){title='칼퇴 성공 🎉';line=`${tm} 퇴근! 오늘 저녁은 내 거예요.`;}
  else{const o=m-18*60;title='오늘도 고생했어요';line=`${tm} 퇴근 · 야근 ${o/60|0}시간 ${o%60}분`;}
  if(FRIDAY&&!isOff(d)&&t.in)line+=m>18*60+30?'<br>불금인데… 주말엔 푹 쉬어요.':'<br>🎉 불금! 좋은 주말 보내요.';
  const work=t.in&&t.out?((mins(t.out)-mins(t.in))):0;
  dialog(title,'주식회사 오늘도 · 퇴근 기록',`<p>${line}</p>`+(work>0?`<p style="color:#7a6e5e;font-size:13px">출근 ${t.in} → 퇴근 ${t.out} · 회사에 ${work/60|0}시간 ${work%60}분${t.coffee?' · 커피 '+t.coffee+'잔':''}</p>`:''),
    [['📒 내 기록',()=>{back();showRec();}],['로비로 돌아가기',back,'main']]);
  if(outCount)outCount.then(r=>{if(!r||!r.rank)return;const p=document.createElement('p');p.style.cssText='color:#7a6e5e;font-size:13px';
    p.textContent=`🛗 오늘 전국 ${r.rank}번째 퇴근`+(r.working?` · 아직 ${r.working}명 근무 중`:' · 이제 다 퇴근했어요');$('dlgB').appendChild(p);});
}

/* ── 전국 숫자 (Cloudflare Workers, workers/office-count) ───────
   기록은 이 기기에만, 서버엔 「오늘 몇 명」 숫자만. 서버가 안 되면 조용히 숨긴다.
   시험 주소(로컬)는 세지 않는다 — ?count=1 이면 셈 */
const API='https://office-count.swbins.workers.dev';
const COUNT_OK=location.hostname==='swbins.github.io'||Q.has('count');
let outCount=null;
async function api(path,method='GET'){
  try{const c=new AbortController();setTimeout(()=>c.abort(),4000);
    const r=await fetch(API+path,{method,signal:c.signal});if(!r.ok)return null;const j=await r.json();showCrowd(j);return j;}catch(e){return null;}
}
function count(path){return COUNT_OK?api(path,'POST'):Promise.resolve(null);}
function showCrowd(j){
  if(!j||isOff(now())){$('crowd').style.display='none';return;}
  $('crowd').textContent=j.in?`👥 오늘 출근 ${j.in}명 · 근무 중 ${j.working}명`:'👥 오늘 첫 출근을 기다려요';
  $('crowd').style.display='';
}
api('/stats');setInterval(()=>{if(!document.hidden)api('/stats');},60000);
function back(){$('fade').style.opacity=0;player.position.set(0,0,10);player.rotation.y=Math.PI;busy=false;refreshState();}

/* ── 내 기록 ─────────────────────── */
function showRec(){
  const d=now(),ym=dkey(d).slice(0,7),list=Object.entries(DB.days).filter(([k,v])=>k.startsWith(ym)&&v.in);
  const early=list.filter(([k,v])=>v.out&&mins(v.out)>=18*60&&mins(v.out)<=18*60+30).length;
  const outs=list.filter(([k,v])=>v.out).map(([k,v])=>mins(v.out));
  const avg=outs.length?outs.reduce((a,b)=>a+b,0)/outs.length:0;
  const first=new Date(d.getFullYear(),d.getMonth(),1),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  let cal='<i>일</i><i>월</i><i>화</i><i>수</i><i>목</i><i>금</i><i>토</i>'+'<div class="off"></div>'.repeat(first.getDay());
  for(let i=1;i<=days;i++){const k=ym+'-'+pad(i),v=DB.days[k]||{},wd=(first.getDay()+i-1)%7;
    const cls=v.out&&mins(v.out)>=18*60&&mins(v.out)<=18*60+30?'early':v.in?'in':(wd===0||wd===6?'off':'');
    cal+=`<div class="${cls}" title="${v.in?v.in+' → '+(v.out||'-'):''}">${i}</div>`;}
  dialog('📒 내 기록',DB.nick+' · '+(d.getMonth()+1)+'월',
    `<div class="stat"><div><b>${streak()}일</b><span>연속 출근</span></div><div><b>${list.length}일</b><span>이번 달 출근</span></div>
     <div><b>${early}일</b><span>칼퇴 (18:00~18:30)</span></div><div><b>${avg?pad(avg/60|0)+':'+pad(Math.round(avg%60)):'-'}</b><span>평균 퇴근</span></div></div>
     <div class="cal">${cal}</div><p style="font-size:12px;color:#7a6e5e">진한 칸 = 칼퇴한 날 · 기록은 이 기기에만 있어요</p>`,
    [['🖼 카드 이미지',shareCard],['기록 복사',()=>{navigator.clipboard?.writeText(`[출근 도장] ${d.getMonth()+1}월 출근 ${list.length}일 · 칼퇴 ${early}일 · 연속 ${streak()}일 — 주식회사 오늘도`);toast('복사했어요');}],['닫기',null,'main']]);
}
$('recBtn').onclick=showRec;

/* 공유 카드 — 이번 달 기록 한 장 (1080×1350, 종이 노트 결) */
function monthStats(d){
  const ym=dkey(d).slice(0,7),list=Object.entries(DB.days).filter(([k,v])=>k.startsWith(ym)&&v.in);
  const isEarly=v=>v.out&&mins(v.out)>=18*60&&mins(v.out)<=18*60+30;
  const outs=list.filter(([k,v])=>v.out).map(([k,v])=>mins(v.out));
  const avg=outs.length?outs.reduce((a,b)=>a+b,0)/outs.length:0;
  const coffee=list.reduce((a,[k,v])=>a+(v.coffee||0),0);
  return {ym,list,isEarly,early:list.filter(([k,v])=>isEarly(v)).length,avg,coffee};
}
function drawCard(){
  const d=now(),S=monthStats(d),W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const F=(w,s)=>`${w} ${s}px "Pretendard","Malgun Gothic",sans-serif`;
  x.fillStyle='#f4ecdc';x.fillRect(0,0,W,H);
  x.strokeStyle='#e2d6bf';x.lineWidth=2;for(let y=120;y<H;y+=54){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();}   // 노트 줄
  x.strokeStyle='#2b2620';x.lineWidth=6;x.strokeRect(40,40,W-80,H-80);
  x.fillStyle='#2b2620';x.font=F(800,40);x.textAlign='left';x.fillText('주식회사 오늘도 · 출근 도장',90,130);
  x.font=F(800,96);x.fillText(`${d.getMonth()+1}월의 나`,90,250);
  x.font=F(600,40);x.fillStyle='#7a6e5e';x.fillText(DB.nick,90,315);
  // 도장
  x.save();x.translate(W-230,230);x.rotate(-0.25);x.strokeStyle='#c9472f';x.lineWidth=10;x.beginPath();x.arc(0,0,120,0,7);x.stroke();
  x.lineWidth=3;x.beginPath();x.arc(0,0,104,0,7);x.stroke();x.fillStyle='#c9472f';x.textAlign='center';x.font=F(800,58);x.fillText(S.early?'칼퇴':'출근',0,10);
  x.font=F(700,30);x.fillText(S.early?S.early+'회':S.list.length+'일',0,56);x.restore();
  // 숫자 넷
  const cells=[[streak()+'일','연속 출근'],[S.list.length+'일','이번 달 출근'],[S.early+'일','칼퇴 18:00~18:30'],[S.avg?pad(S.avg/60|0)+':'+pad(Math.round(S.avg%60)):'-','평균 퇴근']];
  cells.forEach(([v,l],i)=>{const cx=90+(i%2)*460,cy=380+(i/2|0)*200;x.fillStyle='#fffaf0';x.fillRect(cx,cy,440,170);x.strokeStyle='#2b2620';x.lineWidth=4;x.strokeRect(cx,cy,440,170);
    x.fillStyle='#2b2620';x.textAlign='left';x.font=F(800,72);x.fillText(v,cx+30,cy+95);x.font=F(600,32);x.fillStyle='#7a6e5e';x.fillText(l,cx+30,cy+145);});
  // 달력
  const first=new Date(d.getFullYear(),d.getMonth(),1),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),cw=128,top=820;
  x.font=F(700,28);x.textAlign='center';'일월화수목금토'.split('').forEach((w,i)=>{x.fillStyle='#7a6e5e';x.fillText(w,90+i*cw+cw/2-6,top);});
  for(let i=1;i<=days;i++){const k=S.ym+'-'+pad(i),v=DB.days[k]||{},p=first.getDay()+i-1,cx=90+(p%7)*cw,cy=top+20+(p/7|0)*72;
    x.fillStyle=S.isEarly(v)?'#c9472f':v.in?'#e9a48f':((p%7===0||p%7===6)?'rgba(0,0,0,0)':'#e6dcc8');x.fillRect(cx,cy,cw-12,62);
    x.fillStyle=S.isEarly(v)?'#fff':'#2b2620';x.font=F(600,26);x.fillText(i,cx+(cw-12)/2,cy+41);}
  x.fillStyle='#2b2620';x.textAlign='left';x.font=F(600,32);
  x.fillText(`☕ 커피 ${S.coffee}잔`,90,H-90);x.textAlign='right';x.fillStyle='#7a6e5e';x.fillText('swbins.github.io/mini/office',W-90,H-90);
  return c;
}
function shareCard(){
  const c=drawCard(),url=c.toDataURL('image/png'),name=`출근도장-${dkey(now()).slice(0,7)}.png`;
  dialog('🖼 이번 달 카드','길게 눌러 저장하거나 아래 단추로',`<img src="${url}" alt="이번 달 출근 기록 카드" style="width:100%;border:1.5px solid #2b2620;border-radius:4px">`,
    [['내려받기',()=>{const a=document.createElement('a');a.href=url;a.download=name;a.click();}],
     ['공유',()=>c.toBlob(async b=>{const f=new File([b],name,{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'출근 도장'});}catch(e){}}else toast('이 브라우저는 바로 공유가 안 돼요 — 내려받기로');}),'main']]);
}
$('start').onclick=()=>{$('intro').style.display='none';beep(660,.08);
  const d=now(),t=today();
  if(isOff(d))toast('🛋 오늘은 쉬는 날 — 로비만 구경해요',3200);
  else if(!t.in)toast((MONDAY?'☔ 월요일인데 비까지… ':'')+'🪪 게이트에서 출근부터 찍어요',3400);};

/* 시험용: ?do=in,coffee,out — 소개 창 건너뛰고 동작을 차례로(각 4.5초 간격), ?rec=1 기록 창 */
if(Q.has('do')||Q.has('rec')){$('intro').style.display='none';
  (Q.get('do')||'').split(',').filter(Boolean).forEach((a,i)=>setTimeout(()=>ACTS[a](),600+i*4500));
  if(Q.has('rec'))setTimeout(showRec,800);}
if(Q.has('shot'))for(const s of ['.hud','#acts','#intro'])document.querySelector(s).style.display='none';   // 표지 그림용
if(Q.has('card')){$('intro').style.display='none';setTimeout(shareCard,800);}

/* ── 돌리기 ─────────────────────── */
applyTime();refreshState();setInterval(()=>{applyTime();},20000);
// 같이 있는 사람들(live.js) — 로비에 들어온 다른 사람. ?solo=1 · ?shot=1 이면 혼자
const live=startLive({THREE,scene,player,person,key:'office',nick:DB.nick,look:MY_LOOK,baseLook:BASE_LOOK,toast,doAct,animateChibi,
  crowdEl:$('together'),waveBtn:$('waveBtn'),off:Q.has('solo')||Q.has('shot')});
const clock=new THREE.Clock();let tt=0;const camPos=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);tt+=dt;
  // 방향키
  let kx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0),kz=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
  let walking=false;
  if(!busy&&(kx||kz)){target=null;const l=Math.hypot(kx,kz),nx=player.position.x+kx/l*5*dt,nz=player.position.z+kz/l*5*dt;
    if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz;
    player.rotation.y=Math.atan2(kx,kz);walking=true;}
  else if(target){
    const dx=target.x-player.position.x,dz=target.z-player.position.z,dist=Math.hypot(dx,dz);
    if(dist<0.12){target=null;const f=onArrive;onArrive=null;f&&f();}
    else{const s=Math.min(dist,5*dt),nx=player.position.x+dx/dist*s,nz=player.position.z+dz/dist*s;
      // 걸어가는 길: 일반 걷기는 막히면 멈춤, 동작 이동(busy)은 엘리베이터 안까지 들어가도록 통과
      if(busy||!blocked(nx,nz)){player.position.x=nx;player.position.z=nz;}else{target=null;onArrive=null;}
      player.rotation.y=Math.atan2(dx,dz);walking=true;}
  }
  animateChibi(player,tt,dt,{walk:walking});
  tickMates(dt,tt);live.tick(dt,tt);
  for(const f of fx)f(dt);
  // 게이트 불빛·막대
  for(const g of GATES){if(g.t>0){g.t-=dt;g.led.material.color.setHex(0x3ee07a);g.bar.rotation.y=Math.min(1,g.t)*Math.PI/2;}else{g.led.material.color.setHex(0x335577);g.bar.rotation.y=0;}}
  // 엘리베이터 문
  for(const E of ELEV){E.open+=(E.want-E.open)*Math.min(1,dt*4);E.doors[0].position.x=E.x-0.75-E.open*1.4;E.doors[1].position.x=E.x+0.75+E.open*1.4;
    E.lamp.material.color.setHex(E.want?0xffb347:0x555555);}
  // 카메라 — 뒤에서 내려다보기
  const far=camera.aspect<0.8?1.45:1;   // 폰 세로 화면은 더 멀리서
  camPos.set(player.position.x*0.85,12*far,player.position.z+14*far);camera.position.lerp(camPos,Math.min(1,dt*3));
  camera.lookAt(player.position.x*0.9,1,player.position.z-2);
  renderer.render(scene,camera);
}
loop();
</script>
