            msg.textContent = `${rd + 1}번째 신호 · 잘 보고 들어요`; let t = 500;
            for (const s of pat) { const len = s === 'd' ? 180 : 480;
              setTimeout(() => { if (!alive()) return; lampOn(true); c.beep(700, len / 1000, 0, 'sine', .06); pt.textContent += (pt.textContent ? ' ' : '') + sym(s); }, t);
              setTimeout(() => alive() && lampOn(false), t + len); t += len + 260; }
            setTimeout(() => { if (!alive()) return; phase = 'in'; key.style.display = ''; msg.textContent = '이제 똑같이 눌러요';
              if (rd === 2) pt.textContent = pat.map(() => '?').join(' '); tm = setTimeout(() => judge(pat), 6500); }, t + 100); }
          key.onpointerdown = e => { if (phase !== 'in') return; e.preventDefault(); t0 = performance.now(); lampOn(true); c.beep(700, .09, 0, 'sine', .06); };
          const up = () => { if (phase !== 'in' || !t0) return; const dur = performance.now() - t0; t0 = 0; lampOn(false); inp.push(dur < 260 ? 'd' : 'l'); me.textContent = inp.map(sym).join(' ');
            if (inp.length >= rounds[rd][1].length) judge([...rounds[rd][1]]); };
          key.onpointerup = up; key.onpointerleave = up; key.onpointercancel = up;
          function finish() {
            dead = true; c.count('morse'); close();
            if (score === 3) { c.DB.morseOk = (c.DB.morseOk || 0) + 1; c.save(); c.doAct(c.player, 'cheer'); c.stamp('전신 완벽', '세 번 모두 맞혔어요'); }
            else c.toast(`📡 전신 ${score}/3 — 손가락이 조금 느렸나 봐요`);
            setTimeout(done, 1500); }
          $('#go').onclick = () => { $('#go').remove(); round(); };
        }); }},
    {id: 'star', icon: '⭐', label: '별 보기', spot: [-8.9, 5.65], face: -Math.PI / 2, run(c, done) {
      const d = c.now(), D = daily(d); c.doAct(c.player, 'stretch'); const n = c.count('star');
      setTimeout(() => c.dialog('별 보기', `${c.hm(d)} · ${WX[D.wx][0]}`, skySvg(D) + `<p style="font-size:15px">「${SKY[(D.dn + n - 1) % SKY.length]}」</p>`,
        [['고개 내리기', () => { if (n % 3 === 0) c.stamp('별 구경', `오늘 ${n}번째`); done(); }, 'main']]), 900); }},
    {id: 'tea', icon: '🍵', label: '식당칸 홍차', spot: [8, -5.2], face: Math.PI, run(c, done) {
      const D = daily(c.now()), n = c.count('tea'), t = TEA[(D.dn + n - 1) % TEA.length], got = new Set(c.DB.teas || []);
      const cup = c.cyl(0.06, 0.045, 0.1, 0xf4f0e6, 0, -0.02, 0.06, c.hand); c.doAct(c.player, 'sip'); c.beep(520, .05, .3, 'sine', .03);
      got.add(t); c.DB.teas = [...got]; c.save();
      setTimeout(() => { c.toast(`🍵 ${t}`, 3000); if (n % 3 === 0) c.stamp('홍차 세 잔', `오늘 ${n}번째`); }, 700);
      setTimeout(() => { c.hand.remove(cup); done(); }, 2800); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">전신 세 번 모두 맞힌 횟수 ${c.DB.morseOk || 0}번<br>맛본 홍차 ${(c.DB.teas || []).length}/${TEA.length}종: ${(c.DB.teas || []).join(' · ') || '아직 없음'}</p>`,
  onEnter(c) { const D = daily(c.now()); c.toast(c.visits() > 1 ? `🚢 항해 ${D.day}일째 밤. 오늘도 바다는 조용해요` : '🚢 밤 갑판. 멀리서 기관 소리만 낮게 들려요', 3000); },
});
</script></body></html>
