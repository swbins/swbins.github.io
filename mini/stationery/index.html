        anim(c, 0.55, k => { m.position.set(sx + (-5.5 - sx) * k, 1.5 - 1.4 * k + Math.sin(k * Math.PI) * 1.6, sz + (3.9 - sz) * k); m.rotation.y = k * 9; }, () => {
          m.position.set(-5.5, 0.1, 3.9); m.rotation.y = 0.3; c.beep(110, .14, 0, 'sine', .09);
          if (win) anim(c, 0.6, k => { T.rotation.x = k * Math.PI; T.position.y = 0.05 + Math.sin(k * Math.PI) * 0.6; }, () => T.position.y = 0.05);
          else anim(c, 0.5, k => { T.rotation.z = Math.sin(k * 14) * 0.16 * (1 - k); }, () => T.rotation.z = 0);
          const n = c.count('ddakji'); if (win) c.count('dwin');
          setTimeout(() => { if (win) c.stamp('넘어갔다', `${col.n} 딱지로 한 장`); c.toast((n === 1 ? '「' : `${n}번째. 「`) + (win ? DK_WIN : DK_LOSE)[Math.random() * 3 | 0] + '」', 3000); }, 700);
          setTimeout(() => { T.rotation.set(0, 0, 0); T.position.y = 0.05; c.scene.remove(m); done(); }, 2300); }); }, 280); }},
    {id: 'snack', icon: '🍬', label: '간식', spot: [-4.8, -4.8], face: Math.PI, run(c, done) {
      const d = c.now(), s = SNACKS[dayN(d) % SNACKS.length], it = c.box(0.22, 0.14, 0.12, s.c, 0, 0.05, 0, c.hand);
      c.beep(1400, .05, 0, 'square', .04); c.beep(1800, .08, .08, 'square', .04); c.player.rotation.y = 0; c.doAct(c.player, 'sip');
      const n = c.count('snack'); c.DB.snacks = c.DB.snacks || {}; c.DB.snacks[s.n] = (c.DB.snacks[s.n] || 0) + 1; c.save();
      c.toast(n === 1 ? `🍬 오늘은 「${s.n}」 ${s.p}` : `🍬 「${s.n}」 ${n}번째. 용돈이 줄어든다`, 2600);
      setTimeout(() => c.toast('「' + s.t + '」', 3200), 2300); setTimeout(() => { c.hand.remove(it); done(); }, 3000); }},
    {id: 'talk', icon: '👴', label: '할아버지', spot: [0.6, -6.2], face: Math.PI, run(c, done) {
      c.player.rotation.y = Math.PI; c.grandpa.talk = true; c.doAct(c.grandpa.o, 'wave'); const d = c.now(), first = !c.today().talk, line = HALMOEONI[(dayN(d) * 5 + 3) % HALMOEONI.length];
      c.count('talk');
      setTimeout(() => { c.grandpa.talk = false; c.dialog('할아버지의 오늘 한마디', `${c.hm(d)} · ${c.visits()}번째 온 날`, `<p style="font-size:17px">「${line}」</p>` + (first ? '' : '<p style="color:#7a6e5e;font-size:13px">한마디는 하루에 하나. 내일 또 와요.</p>'), [['네', done, 'main']]); }, 900); }},
  ],
  recExtra: c => { const d = c.now(), t = c.today(), caps = c.DB.caps || [0, 0, 0, 0], sn = c.DB.snacks || {}, s = SNACKS[dayN(d) % SNACKS.length];
    return `<p style="font-size:13px;color:#7a6e5e">오늘 들어온 간식<br><span style="color:#2b2620;font-size:14px">${s.n} · ${s.p}</span></p>`
      + `<p style="font-size:13px;color:#7a6e5e">모은 캡슐<br><span style="color:#2b2620;font-size:14px">${GR.map((g, i) => `<span style="display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #2b2620;background:${g.css};margin:0 3px 0 6px"></span>${caps[i]}`).join('')}</span></p>`
      + `<p style="font-size:13px;color:#7a6e5e">딱지 · 오늘 ${t.dwin || 0}번 넘어감 / ${t.ddakji || 0}번 던짐<br>먹어 본 간식 ${Object.keys(sn).length}/${SNACKS.length}종</p>`; },
  onEnter(c) { const d = c.now(); c.doAct(c.grandpa.o, 'wave'); c.toast(c.visits() > 1 ? `✏️ 또 왔구나. ${c.visits()}번째` : '✏️ 「' + ENTER[dayN(d) % ENTER.length] + '」', 3200); },
});
</script></body></html>
