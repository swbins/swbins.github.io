    for (const a of [0, Math.PI]) cyl(0.3, 0.3, 0.5, 0x3a6ab0, 6.5 + Math.cos(a) * 1.3, 0.25, -6.2, undefined, 10);
    // 다른 돗자리 손님들
    box(4, 0.05, 3, 0x4a7ab0, -9, 0.03, -1.5).castShadow = false; box(4, 0.06, 0.3, 0xf4ecdc, -9, 0.04, -1.5).castShadow = false;
    npc({coat: 0xd6a05a, hairStyle: 'long', hair: 0x2a2018}, [[-9.9, -1.6]], {face: Math.PI / 2, idle: ['sip', 'wave']});
    npc({coat: 0x55606e, glasses: true}, [[-8.2, -1.4]], {face: -Math.PI / 2, idle: ['sip', 'stretch']});

    function mkBike(coat, body, z, dir, x0, v) {
      const g = new THREE.Group(); scene.add(g);
      for (const zz of [-0.55, 0.55]) { const w = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.05, 6, 16), new THREE.MeshLambertMaterial({color: 0x222222})); w.rotation.y = Math.PI / 2; w.position.set(0, 0.35, zz); g.add(w); }

        <div style="font-size:12px;text-align:left">바람 <span style="color:#7a6e5e">(${lvl}단계 ${WIND[lvl - 1]})</span></div>
        <div style="height:10px;background:#e4d9c2;border:1.5px solid #2b2620;border-radius:4px;margin:2px 0 6px"><div id="wd" style="height:100%;background:#4a7ab0"></div></div>
        <div style="font-size:12px;text-align:left">줄 <span style="color:#7a6e5e">(초록 띠 안에 맞춰요)</span></div>
        <div style="position:relative;height:10px;background:#e4d9c2;border:1.5px solid #2b2620;border-radius:4px;margin:2px 0 6px"><div id="bd" style="position:absolute;top:0;height:100%;background:rgba(106,160,112,.55)"></div><div id="ln" style="position:relative;height:100%;background:#c9472f"></div></div>
        <div style="height:6px;background:#e4d9c2;border-radius:3px;margin:6px 0"><div id="tm" style="height:100%;width:100%;background:#7a6e5e"></div></div>
        <p id="msg" style="font-size:14px;min-height:22px;margin:4px 0"></p>
        <div class="row" style="justify-content:center;user-select:none;touch-action:none"><button class="btn" id="rw" style="width:90px">감기</button><button class="btn main" id="ou" style="width:90px">풀기</button><button class="btn" id="gu">그만</button></div>`,
        (el, close) => {
          const $ = s => el.querySelector(s); let L = 0.5, H = 35, dir = 0, air = 0, t = 0, over = false;
          k.on = true; k.g.visible = true; k.line.visible = true; k.h = H;
          const hold = (b, v) => { const off = () => { if (dir === v) dir = 0; }; b.onpointerdown = e => { e.preventDefault(); dir = v; }; b.onpointerup = off; b.onpointerleave = off; b.onpointercancel = off; };
          hold($('#rw'), -1); hold($('#ou'), 1);
          const end = () => { over = true; clearInterval(tick); k.on = false; k.g.visible = false; k.line.visible = false; };
          const tick = setInterval(() => {
            if (over) return; t += 0.05;
            const w = Math.max(0.08, Math.min(0.95, base + Math.sin(t * 1.1 + ph) * 0.26 + Math.sin(t * 2.7 + ph * 2) * 0.1));
            L = Math.max(0, Math.min(1, L + dir * 0.5 * 0.05)); const m = L - w, inb = Math.abs(m) < 0.14;
            H = inb ? Math.min(100, H + 22 * 0.05) : Math.max(0, H - (14 + 40 * (Math.abs(m) - 0.14)) * 0.05);
            if (H >= 45) air += 0.05; k.h = H;
            $('#wd').style.width = w * 100 + '%'; $('#ln').style.width = L * 100 + '%'; $('#bd').style.left = Math.max(0, w - 0.14) * 100 + '%'; $('#bd').style.width = Math.min(0.28, 1 - Math.max(0, w - 0.14)) * 100 + '%';
            $('#kt').style.bottom = H * 0.7 + '%'; $('#tm').style.width = (1 - t / LIMIT) * 100 + '%';
            $('#msg').textContent = inb ? '좋아요. 연이 바람을 탄다' : m > 0 ? '줄이 처졌다 — 감아요' : '줄이 팽팽하다 — 풀어요';
            if (t >= LIMIT || (H <= 0 && t > 1)) { end(); const a = +air.toFixed(1); c.count('kite'); if (!c.DB.kiteBest || a > c.DB.kiteBest) { c.DB.kiteBest = a; c.save(); }
              $('#msg').textContent = H <= 0 ? `연이 떨어졌다 — ${a}초 떠 있었다` : `연이 하늘에 ${a}초 떠 있었다`;
              setTimeout(() => { close(); c.stamp(a >= 18 ? '둥실' : a >= 9 ? '팔랑' : '털썩', a >= 9 ? `${a}초 떠 있었다` : '바람이 오늘 좀 그렇다'); done(); }, 1400); }
          }, 50);
          $('#gu').onclick = () => { if (over) return; end(); close(); done(); };
        }); }},
    {id: 'sunset', icon: '🌇', label: '노을', spot: [0.2, 3.4], face: Math.PI, run(c, done) {
      const d = c.now(), sm = sunsetMin(d), cur = d.getHours() * 60 + d.getMinutes(), left = sm - cur, key = c.dkey(d);
      c.doAct(c.player, 'crouch'); c.count('sunset'); const sd = new Set(c.DB.sunDays || []); sd.add(key); c.DB.sunDays = [...sd]; c.save();
      c.toast(`🌇 오늘 해는 ${fmt(sm)} 즈음 진다`, 2400);
      setTimeout(() => c.toast(left > 120 ? '아직 한참 남았다. 일단 앉아 본다' : left > 20 ? '조금 있으면 하늘이 물든다' : left > -30 ? '지금이 제일 좋은 때다' : '해는 졌다. 이제 강 위 불빛 시간', 2600), 2600);
      setTimeout(() => c.toast('「' + pick(MONO, seedOf(d), 7) + '」', 2800), 5400);
      setTimeout(() => { c.stamp('노을', `${fmt(sm)} 즈음`); done(); }, 8200); }},
    {id: 'ramen', icon: '🍜', label: '라면', spot: [8.7, -3.2], face: Math.PI / 2, run(c, done) {
      const d = c.now(), top = pick(TOP, seedOf(d), 3), cup = new c.THREE.Group();
      c.cyl(0.16, 0.11, 0.26, 0xe8e0d0, 0, 0, 0, cup); c.cyl(0.162, 0.112, 0.1, 0xc9472f, 0, 0.02, 0, cup); c.hand.add(cup);
      c.toast('🍜 컵을 기계에 놓는다', 1500); c.beep(500, .1);
      setTimeout(() => { c.toast('뜨거운 물이 나온다. 선 아래까지', 1500); c.beep(300, .8, 0, 'sine', .06); }, 1500);
      setTimeout(() => c.toast(`오늘의 토핑: ${top}`, 1400), 3000);
      setTimeout(() => c.toast('3분 기다리는 중… 강만 본다', 1500), 4400);
      setTimeout(() => { c.toast('젓가락으로 한 번 휘젓는다', 1300); c.doAct(c.player, 'sip'); }, 5900);
      setTimeout(() => c.doAct(c.player, 'sip'), 7300);
      setTimeout(() => { c.hand.remove(cup); const n = c.count('ramen'); c.stamp('후루룩', n === 1 ? '한강에선 이 맛' : `오늘 ${n}번째 라면`); done(); }, 8600); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">노을 본 날 ${(c.DB.sunDays || []).length}일${c.DB.kiteBest ? ` · 연 최고 ${c.DB.kiteBest}초` : ''}</p>`,
  onEnter(c) { const d = c.now(), l = windLevel(d), s = `바람 ${l}단계(${WIND[l - 1]}) · 강에는 「${shipOf(d)}」`;
    c.toast(c.visits() > 1 ? `🧺 또 왔네요. ${c.visits()}번째 — ${s}` : `🧺 돗자리 깔기 좋은 자리다. ${s}`, 3800); },
});
</script></body></html>
