<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>지하 오락실</title></head><body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import {start, THREE, doAct} from '../mini.js';

const BRO = ['버튼 연타하지 마. 손목 나가.','천천히 하는 놈이 제일 빨리 끝나더라. 동전은 안 아껴져.','연습 판은 한 번 더 해. 지는 것도 연습이야.',
  '화면 말고 신호만 봐. 눈이 먼저고 손은 따라오는 거야.','뽑기는 기계가 정해. 우린 구경하는 거야.','형 어릴 땐 동전 하나로 한 시간 놀았다. 거짓말 아님. 반쯤은.',
  '지고 나서 화내면 두 판 지는 거야.','손에 힘 빼. 스틱 부러져.','마지막 동전은 아껴 둬. 그래야 또 오게 돼.','잘하는 거 말고 재밌는 걸 해.',
  '옆 사람 화면 쳐다보면 네 화면이 진다.','출출하면 집 가서 라면 먹어. 여기서 먹으면 손이 끈적해.','오늘은 일찍 들어가. 오락기는 어디 안 가.'];
const MISS = ['아깝다. 집게가 인형 어깨만 쓰다듬었어요','집게가 놓쳤어요. 기계 탓이에요. 아마도','거의 닿았어요. 거의.','인형이 「다음에」라고 한 것 같아요','힘이 약한 날이에요. 기계가요'];
const MEMO = ['동전 소리가 이렇게 컸었나','그땐 이 불빛이 세상 전부 같았는데','학교 끝나고 곧장 내려오던 계단','주머니에 동전 몇 개면 부자였지'];
const BODY = [0x2a2a4a, 0x3a2440, 0x24383a, 0x3a3024];
const tw = (o, k, to, ms) => new Promise(r => { const f = o[k], t0 = performance.now();
  (function s() { const p = Math.min(1, (performance.now() - t0) / ms); o[k] = f + (to - f) * p; p < 1 ? requestAnimationFrame(s) : r(); })(); });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const spend = c => { if ((c.DB.coins | 0) < 1) return false; c.DB.coins--; c.save(); return true; };
const NOCOIN = '동전이 없어요. 교환기에서 바꿔 와요';

start({
  key: 'arcade', title: '지하 오락실', enter: '계단 내려가기', time: 'night', nickIcon: '🕹',
  nick: [['동전 쥔','신기록 노리는','지하 단골','방과 후','손목 풀린','눈 빠른'],['스틱','단추','동전','인형','깜빡이','오락기']],
  intro: '<p>계단을 내려가면 동전 소리.<br>화면 불빛 아래서 한 판 하고 가요.</p>',
  floor: {w: 28, d: 22, c1: '#2a2638', c2: '#34304a', pattern: 'tile', around: 0x0d0c14},
  bg: {night: 0x07060d},
  startPos: [0, 8], cam: {h: 9, back: 11},
  playerLook: {coat: 0x3a4a6a, pants: 0x33363f, hair: 0x2a2018},
  build(c) {
    const {box, cyl, ball, sign, solid, npc, fx, THREE, scene} = c;
    c.DB.coins = c.DB.coins ?? 3; c.save();
    const L = (col, i, d, x, y, z) => { const l = new THREE.PointLight(col, i, d); l.position.set(x, y, z); scene.add(l); };
    const glow = col => new THREE.MeshBasicMaterial({color: col});
    // 벽 + 네온 띠 + 간판·포스터(뒤쪽)
    box(28, 7, 0.5, 0x241f36, 0, 3.5, -11); box(0.5, 7, 22, 0x241f36, -14, 3.5, 0); box(0.5, 7, 22, 0x241f36, 14, 3.5, 0);
    box(28, 0.1, 0.1, glow(0xff4fa0), 0, 3.7, -10.7); box(0.1, 0.1, 22, glow(0x4fd8ff), -13.7, 3.4, 0); box(0.1, 0.1, 22, glow(0xff4fa0), 13.7, 3.4, 0);
    sign(['지하 오락실', '동전 환영 · 양보 필수'], 7, 1.5, '#1a0f2a', '#ff7ad0', 0, 5.7, -10.7, 0, [64, 28]);
    sign(['신기록', '랭킹 1위 ???'], 1.7, 1.2, '#f4ecdc', '#c9472f', -9, 4.6, -10.72, 0, [54, 26]);
    sign(['한 판에', '동전 하나'], 1.7, 1.2, '#2b2620', '#f2c14e', -5, 4.6, -10.72, 0, [54, 54]);
    sign(['고장 난 건', '곧 고칩니다'], 1.7, 1.2, '#f4ecdc', '#2b2620', 5, 4.6, -10.72, 0, [44, 44]);
    sign(['뛰지 마세요', '(뛰게 됨)'], 1.7, 1.2, '#24383a', '#fff8ec', 9, 4.6, -10.72, 0, [44, 36]);
    // 색 불빛
    L(0xff4fa0, 25, 16, -6, 4.5, -6); L(0x4fd8ff, 25, 16, 6, 4.5, -6); L(0xb08aff, 18, 14, 0, 4, 3); L(0xff9ad0, 22, 14, 9, 3.6, 0); L(0x4fd8ff, 18, 14, -10, 4, 0);

    // 오락기 줄 — 화면은 fx 로 색이 바뀐다(실제 게임 화면 아님, 그냥 색 판)
    const screens = []; let ci = 0;
    const cabinet = (x, z, ry, off) => {
      const i = ci++, hue = (i * 0.137) % 1, g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
      box(1.3, 2.3, 1.1, BODY[i % 4], 0, 1.15, 0, g); box(1.05, 0.85, 0.06, 0x08080c, 0, 1.75, 0.55, g);
      const sm = new THREE.MeshBasicMaterial({color: 0xffffff}); sm.color.setHSL(hue, .9, .55);
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.7), sm); scr.position.set(0, 1.75, 0.6); g.add(scr);
      const mm = new THREE.MeshBasicMaterial({color: 0xffffff}); mm.color.setHSL((hue + .5) % 1, .9, .6); box(1.3, 0.35, 1.15, mm, 0, 2.48, 0, g);
      const cp = box(1.2, 0.1, 0.55, 0x2a2640, 0, 1.1, 0.75, g); cp.rotation.x = 0.15;
      cyl(0.025, 0.025, 0.2, 0x999999, -0.3, 1.22, 0.74, g); ball(0.06, 0xff3050, -0.3, 1.34, 0.74, g);
      for (let k = 0; k < 3; k++) cyl(0.06, 0.06, 0.04, [0xf2c14e, 0x4fa0ff, 0x6fe08a][k], 0.05 + k * 0.17, 1.17, 0.78, g);
      const gm = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: .22, depthWrite: false}); gm.color.setHSL(hue, .9, .5);
      const gl = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2.2), gm); gl.rotation.x = -Math.PI / 2; gl.position.set(0, 0.03, 1.5); g.add(gl);
      if (off) { const s = sign(['고장'], 0.6, 0.3, '#f4ecdc', '#c9472f', 0, 1.75, 0.63, 0, [110]); g.add(s); }
      screens.push({sm, gm, mm, hue, t: Math.random(), off});
    };
    for (let k = 0; k < 9; k++) { const x = -8.8 + k * 2.2; cabinet(x, -9.8, 0, k === 7); solid(x, -9.8, 1.4, 1.8); }
    for (let k = 0; k < 6; k++) { const z = -6.6 + k * 2.2; cabinet(-12.8, z, Math.PI / 2, false); solid(-12.7, z, 1.8, 1.4); }
    fx.push(dt => { for (const s of screens) { s.t -= dt; if (s.t > 0) continue; s.t = 0.2 + Math.random() * 0.8;
      if (s.off) { const v = Math.random() < .08 ? .35 : .04; s.sm.color.setHSL(.6, .2, v); s.gm.opacity = v * .3; continue; }
      s.hue = (s.hue + .1 + Math.random() * .35) % 1; s.sm.color.setHSL(s.hue, .9, .55); s.gm.color.setHSL(s.hue, .9, .5); s.mm.color.setHSL((s.hue + .5) % 1, .9, .6); } });

    // 의자(동그란 스툴)
    for (const [x, z] of [[-6.6, -7.3], [-2.2, -7.3], [4.4, -7.3], [8.8, -7.3], [-11.2, -2.2], [-11.2, 2.2]]) {
      cyl(0.27, 0.27, 0.1, 0xc9472f, x, 0.58, z); cyl(0.05, 0.05, 0.5, 0x888888, x, 0.3, z); cyl(0.2, 0.24, 0.04, 0x777777, x, 0.03, z); solid(x, z, 0.6, 0.6); }

    // 동전 교환기 (오른쪽 벽)
    box(1.0, 2.3, 1.2, 0x8a3a3a, 12.3, 1.15, -5.5); solid(12.3, -5.5, 1.0, 1.2);
    sign(['동전', '교환'], 0.9, 0.7, '#f2c14e', '#2b2620', 11.79, 1.9, -5.5, -Math.PI / 2, [64, 64]);
    box(0.1, 0.5, 0.5, 0x222222, 11.78, 1.1, -5.5); const tray = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), glow(0xffd24a)); tray.position.set(11.7, 0.8, -5.5); scene.add(tray); tray.userData.f = 0; c.chg = tray;
    fx.push(dt => { tray.userData.f = Math.max(0, tray.userData.f - dt * 1.5); tray.scale.setScalar(1 + tray.userData.f * 1.2); });

    // 인형 뽑기 기계 두 대 (오른쪽) — 하나만 움직인다
    const PRIZE = [0xff6fa0, 0x6fd8ff, 0xf2c14e, 0x8fe08a, 0xb08aff, 0xffffff];
    const mkClaw = (mx, mz) => {
      const cl = {x: mx, z: mz, down: 0, open: 1, auto: true, ph: Math.random() * 6, held: null, g: new THREE.Group()}, M = col => new THREE.MeshLambertMaterial({color: col});
      const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1, 6), M(0x444444)); cl.g.add(rope);
      const head = new THREE.Group(); cl.g.add(head); head.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.3), M(0xbfc3cc)));
      const pv = [-1, 1].map(s => { const p = new THREE.Group(); p.position.set(s * 0.14, -0.05, 0); const b = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.4, 0.2), M(0xe0e3ea)); b.position.y = -0.2; p.add(b); head.add(p); p.userData.s = s; return p; });
      scene.add(cl.g);
      fx.push((dt, t) => {
        if (cl.auto) { const k = Math.min(1, dt * 2); cl.x += (mx + Math.sin(t * 0.5 + cl.ph) * 0.55 - cl.x) * k; cl.z += (mz + Math.cos(t * 0.37 + cl.ph) * 0.45 - cl.z) * k; cl.down += (0.05 - cl.down) * k; cl.open += (1 - cl.open) * k; }
        const len = 0.1 + cl.down * 1.35; cl.g.position.set(cl.x, 2.75, cl.z); rope.scale.y = len; rope.position.y = -len / 2; head.position.y = -len;
        for (const p of pv) p.rotation.z = p.userData.s * (-0.12 + cl.open * 0.6);
        if (cl.held) cl.held.position.set(cl.x, 2.75 - len - 0.3, cl.z); });
      return cl;
    };
    const clawMachine = (mz, body, label, lbg) => {
      const mx = 11.4, prizes = [];
      box(2.2, 1.0, 2.0, body, mx, 0.5, mz);
      const gl = box(2.0, 1.9, 1.8, new THREE.MeshLambertMaterial({color: 0x9ad8ff, transparent: true, opacity: .16}), mx, 1.95, mz); gl.castShadow = false;
      for (const [dx, dz] of [[-1, -0.9], [1, -0.9], [-1, 0.9], [1, 0.9]]) box(0.08, 1.9, 0.08, 0xdadde6, mx + dx, 1.95, mz + dz);
      box(2.2, 0.5, 2.0, body, mx, 3.15, mz); sign([label], 1.8, 0.4, lbg, '#fff8ec', mx - 1.12, 3.15, mz, -Math.PI / 2, [60]);
      box(0.5, 0.12, 1.2, 0x2a2640, mx - 1.3, 1.05, mz); ball(0.07, 0xff3050, mx - 1.3, 1.15, mz - 0.3); cyl(0.025, 0.025, 0.25, 0x999999, mx - 1.3, 1.25, mz + 0.3); ball(0.07, 0x3050ff, mx - 1.3, 1.4, mz + 0.3);
      for (let i = 0; i < 16; i++) { const p = ball(0.2, PRIZE[i % PRIZE.length], mx - 0.8 + Math.random() * 1.6, 1.2, mz - 0.7 + Math.random() * 1.4); p.castShadow = false; prizes.push(p); }
      solid(mx - 0.1, mz, 2.4, 2.2); return {prizes, mx, mz, cl: mkClaw(mx, mz)};
    };
    c.claw = clawMachine(-1.5, 0xd9558f, '인형뽑기', '#d9558f'); clawMachine(2.2, 0x3a6ab0, '인형뽑기', '#3a6ab0');

    // 손님·옆자리 형
    c.bro = npc({coat: 0x6b3a2a, hat: {type: 'cap', c: 0x222222}, hairStyle: 'short', hair: 0x2a2018}, [[2.2, -7.7]], {face: Math.PI, idle: ['cheer', 'stretch']});
    npc({coat: 0x55606e, glasses: true}, [[-4.4, -7.7]], {face: Math.PI, idle: ['cheer', 'crouch']});
    npc({coat: 0x8a5a7a, hairStyle: 'bob', hair: 0x2a2018}, [[-11.2, 0]], {face: Math.PI / 2, idle: ['cheer']});
    npc({coat: 0x44506a, hat: {type: 'beanie', c: 0x777777}}, [[-8, 5], [8, 5]], {wait: 5, speed: 1.7});
  },
  acts: [
    {id: 'coin', icon: '🪙', label: '동전', spot: [10.4, -5.5], face: Math.PI / 2, run(c, done) {
      const st = new c.THREE.Group(); for (let i = 0; i < 3; i++) c.cyl(0.1, 0.1, 0.03, 0xf2c14e, 0, 0.1 + i * 0.04, 0, st); c.hand.add(st);
      c.doAct(c.player, 'throw'); c.beep(1400, .05); c.beep(1900, .1, .07); c.beep(1600, .06, .2); c.beep(2100, .1, .27);
      const n = c.count('coin'); c.DB.coins = Math.min(99, (c.DB.coins | 0) + 5); c.save(); c.chg.userData.f = 1;
      setTimeout(() => { c.hand.remove(st);
        c.toast(n === 1 ? '🪙 지폐 한 장이 동전 다섯 개. 주머니가 묵직해요' : n < 4 ? `🪙 동전 ${c.DB.coins}개 — 짤랑` : `🪙 또 바꿨어요. 「${MEMO[n % MEMO.length]}」`); done(); }, 1500); }},
    {id: 'game', icon: '🕹', label: '한 판', spot: [0, -7.6], face: Math.PI, run(c, done) {
      if ((c.DB.coins | 0) < 1) { c.toast(NOCOIN); done(); return; }
      c.play(`<h3>번쩍 누르기</h3><p style="font-size:13px;color:#7a6e5e">화면이 초록으로 번쩍이면 바로 누르세요(스페이스도 돼요).<br>세 번, 동전 한 개. 너무 일찍 누르면 다시.</p>
        <div id="scr" style="height:120px;border-radius:6px;border:3px solid #2b2620;background:#15121f;color:#9a94b8;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;cursor:pointer;user-select:none;touch-action:manipulation;margin:8px 0">준비</div>
        <p id="msg" style="min-height:44px;font-size:14px;line-height:1.5">동전 ${c.DB.coins}개 가지고 있어요</p><div class="row" id="ro" style="justify-content:center"><button class="btn main" id="go">시작 (동전 1)</button><button class="btn" id="qt">그만두기</button></div>`,
      (el, close) => {
        const scr = el.querySelector('#scr'), msg = el.querySelector('#msg'), ro = el.querySelector('#ro');
        let dead = false, state = 'idle', t0 = 0, timer = 0, fouls = 0; const rounds = [];
        const later = (fn, ms) => { clearTimeout(timer); timer = setTimeout(() => { if (!dead) fn(); }, ms); };
        const kd = e => { if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); press(); } };
        const off = () => removeEventListener('keydown', kd);
        const paint = (bg, fg, txt) => { scr.style.background = bg; scr.style.color = fg; scr.textContent = txt; };
        const quit = () => { dead = true; clearTimeout(timer); off(); close(); done(); };
        el.querySelector('#qt').onclick = quit;
        const finish = () => { state = 'end'; off();
          const ok = rounds.filter(r => r < 1500), avg = Math.round(rounds.reduce((a, b) => a + b, 0) / rounds.length), best = ok.length ? Math.min(...ok) : null; let rec = false;
          if (best != null && (!c.DB.bestMs || best < c.DB.bestMs)) { c.DB.bestMs = best; rec = true; }
          const t = c.today(); if (best != null && (!t.bestMs || best < t.bestMs)) t.bestMs = best; c.count('game');
          const v = !ok.length ? '졸았어요? 괜찮아요, 동전 하나일 뿐' : avg < 220 ? '손이 눈보다 빠른 날이에요' : avg < 320 ? '아주 좋아요. 동전 값 이상' : avg < 450 ? '보통이에요. 동전 값은 했어요' : '조금 졸린 날인가 봐요';
          paint('#15121f', '#f2c14e', ok.length ? avg + 'ms' : '—');
          msg.innerHTML = rounds.map((r, i) => `${i + 1}번째 ${r >= 1500 ? '놓침' : r + 'ms'}`).join(' · ') + `<br>${v}${rec ? ' · 새 최고 기록!' : ''}<br><span style="color:#7a6e5e">내 최고 ${c.DB.bestMs ? c.DB.bestMs + 'ms' : '기록 없음'} · 동전 ${c.DB.coins}개 남음</span>`;
          ro.innerHTML = '<button class="btn main" id="ex">나가기</button>';
          el.querySelector('#ex').onclick = () => { close(); done(); if (rec) c.stamp('신기록', best + 'ms'); }; };
        const ready = () => { if (rounds.length >= 3) return finish(); state = 'wait'; paint('#15121f', '#9a94b8', '기다리세요…'); msg.textContent = `${rounds.length + 1} / 3`; later(fire, 1000 + Math.random() * 2200); };
        const fire = () => { state = 'go'; t0 = performance.now(); paint('#2fbf5f', '#fff8ec', '지금!'); c.beep(1200, .08, 0, 'square', .05);
          later(() => { if (state !== 'go') return; rounds.push(1500); state = 'lock'; paint('#6a2a2a', '#fff8ec', '너무 느려요'); later(ready, 900); }, 1500); };
        const press = () => {
          if (state === 'wait') { state = 'lock'; paint('#a83a2a', '#fff8ec', '너무 일러요'); c.beep(180, .2, 0, 'sine'); if (++fouls > 2) rounds.push(1500); later(ready, 1000); }
          else if (state === 'go') { const ms = Math.round(performance.now() - t0); rounds.push(ms); state = 'lock'; paint('#15121f', '#f2c14e', ms + 'ms'); c.beep(900, .08, 0, 'sine'); later(ready, 900); } };
        scr.onpointerdown = press;
        el.querySelector('#go').onclick = () => { if (state !== 'idle') return; if (!spend(c)) { c.toast(NOCOIN); quit(); return; }
          state = 'lock'; addEventListener('keydown', kd); ro.innerHTML = '<button class="btn" id="qt2">그만두기</button>'; el.querySelector('#qt2').onclick = quit; c.beep(1500, .05); later(ready, 400); };
      }); }},
    {id: 'claw', icon: '🧸', label: '뽑기', spot: [9.3, -1.5], face: Math.PI / 2, run(c, done) {
      if (!spend(c)) { c.toast(NOCOIN); done(); return; }
      const {cl, prizes, mx, mz} = c.claw, pr = prizes[Math.random() * prizes.length | 0], win = Math.random() < .12, slip = Math.random() < .5, off = (Math.random() < .5 ? -1 : 1) * (0.3 + Math.random() * .25);
      c.doAct(c.player, 'throw'); c.beep(700, .08); c.beep(900, .08, .1); cl.auto = false;
      (async () => { try {
        const tx = clamp(pr.position.x + (win ? 0 : off), mx - 0.8, mx + 0.8), tz = clamp(pr.position.z + (win ? 0 : off * 0.6), mz - 0.7, mz + 0.7);
        await Promise.all([tw(cl, 'x', tx, 1100), tw(cl, 'z', tz, 1100)]); await tw(cl, 'down', 0.85, 900); await tw(cl, 'open', 0, 500);
        const y0 = pr.position.y;
        if (win) {
          cl.held = pr; await tw(cl, 'down', 0.05, 900); await Promise.all([tw(cl, 'x', mx - 0.75, 900), tw(cl, 'z', mz + 0.65, 900)]); await tw(cl, 'open', 1, 300); cl.held = null;
          await tw(pr.position, 'y', y0, 350); pr.visible = false; const w = c.count('claw_win'); c.count('claw');
          c.beep(1000, .1); c.beep(1300, .1, .1); c.beep(1700, .2, .2); c.doAct(c.player, 'cheer'); c.stamp('뽑았다!', w === 1 ? '오늘 첫 인형. 기계가 봐줬어요' : `오늘 ${w}번째. 이게 되네`);
          setTimeout(() => { pr.position.set(tx, y0, tz); pr.visible = true; }, 1500);
        } else if (slip) {
          cl.held = pr; await tw(cl, 'down', 0.4, 600); await tw(cl, 'open', 1, 150); cl.held = null; await tw(pr.position, 'y', y0, 350); c.count('claw'); c.beep(200, .25, 0, 'sine');
          c.toast('🧸 ' + MISS[Math.random() * MISS.length | 0]); await tw(cl, 'down', 0.05, 500);
        } else { await tw(cl, 'down', 0.05, 900); await tw(cl, 'open', 1, 300); c.count('claw'); c.beep(200, .25, 0, 'sine'); c.toast('🧸 ' + MISS[Math.random() * MISS.length | 0]); }
      } finally { cl.held = null; cl.auto = true; done(); } })(); }},
    {id: 'bro', icon: '🧑', label: '훈수', spot: [1.0, -7.6], face: Math.PI / 2, run(c, done) {
      c.bro.talk = true; c.doAct(c.bro.o, 'wave'); const d = c.now(), first = !c.today().bro, line = BRO[(d.getDate() * 3 + d.getMonth() * 5) % BRO.length]; c.count('bro');
      setTimeout(() => { c.bro.talk = false; c.dialog('옆자리 형의 오늘 한마디', `${c.hm(d)} · ${c.visits()}번째 온 날`, `<p style="font-size:17px">「${line}」</p>` + (first ? '' : '<p style="color:#7a6e5e;font-size:13px">훈수는 하루에 하나. 내일 또 와요.</p>'), [['알겠어요', done, 'main']]); }, 900); }},
  ],
  recExtra(c) { const t = c.today();
    return `<p style="font-size:13px;color:#7a6e5e">동전 ${c.DB.coins | 0}개 · 내 최고 ${c.DB.bestMs ? c.DB.bestMs + 'ms' : '기록 없음'}${t.bestMs ? ' · 오늘 ' + t.bestMs + 'ms' : ''} · 뽑은 인형 ${c.DB.total.claw_win || 0}개</p>`; },
  onEnter(c) { const d = c.now().getDate(); c.toast(c.visits() > 1 ? `🕹 또 왔네. ${c.visits()}번째. 「${MEMO[d % MEMO.length]}」` : '🕹 동전 소리, 깜빡이는 불빛. 3개는 있어요', 3400); },
});
