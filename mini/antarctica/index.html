        const got = new Set(c.DB.cores || []), left = CORE.filter(s => !got.has(s[0])), s = (left.length ? left : CORE)[Math.random() * (left.length || CORE.length) | 0], isNew = !got.has(s[0]);
        got.add(s[0]); c.DB.cores = [...got]; c.count('core'); c.save();
        const tube = new c.THREE.Group(); c.cyl(0.07, 0.07, 0.7, 0xbfe3f2, 0, 0.1, 0, tube); tube.rotation.z = 0.3; c.hand.add(tube); c.doAct(c.player, 'cheer');
        c.toast(`🧊 ${s[0]} — ${s[1]}`, 3600); if (isNew && got.size === CORE.length) setTimeout(() => c.stamp('샘플 5종', '얼음 속 층을 다 모았어요'), 700);
        setTimeout(() => { c.hand.remove(tube); done(); }, 2400); }, 2400); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">모은 얼음 샘플 ${(c.DB.cores || []).length}/${CORE.length}종: ${(c.DB.cores || []).join(' · ') || '아직 없음'}<br>펭귄 세기 맞힌 횟수 ${c.DB.pgOk || 0}번</p>`,
  onEnter(c) { c.toast(c.visits() > 1 ? `🐧 ${c.visits()}번째 근무. 오늘도 하얘요` : '🐧 밖은 영하. 펭귄들은 오늘도 한가해요', 3000); },
});
