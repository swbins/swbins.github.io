<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>북극 오로라</title></head><body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import {start} from '../mini.js';

// 하루에 하나 — 오로라 색·세기, 그리고 오늘의 사실
const PAL = [
  {n: '초록·보라', a: 0x3dffa0, b: 0x8a5cff}, {n: '초록', a: 0x4dff8a, b: 0x2fd0a0}, {n: '청록·파랑', a: 0x30f0d8, b: 0x3a7aff},
  {n: '붉은 기운 도는 초록', a: 0x5dff90, b: 0xff4d6d}, {n: '분홍·보라', a: 0xff6ad0, b: 0x8a5cff}, {n: '연두·노랑', a: 0xb8ff4a, b: 0x3dffa0}];
const LVL = [['잔잔함', 0.6], ['보통', 0.85], ['강함', 1.1]];
const FACT = [
  '오로라의 초록빛은 보통 지상 100km 안팎에서 산소 원자가 내는 빛이에요.',
  '붉은 오로라는 200km 넘게 높은 곳의 산소가 내서 드물고 흐릿해요.',
  '오로라는 태양에서 온 입자가 지구 자기장을 따라 극지방 하늘로 들어오며 생겨요.',
  '남극 하늘에도 오로라가 있어요. 이름은 남극광.',
  '북극곰의 털은 속이 비고 투명해요. 하얗게 보이는 건 빛이 흩어져서예요.',
  '북극곰의 피부는 사실 검은색이에요.',
  '눈은 공기를 많이 머금어서 단열이 잘 돼요. 이글루 안이 바깥보다 훨씬 따뜻한 이유예요.',
  '썰매개는 눈 위에서 몸을 동그랗게 말고 꼬리로 코를 덮고 자요.'];
const seed = d => d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate();
const daily = d => { const s = seed(d); return {pal: PAL[s % 6], lvl: LVL[((s >> 1) + s * 7) % 3], fact: FACT[(s * 3) % FACT.length]}; };
const rgba = (h, a) => `rgba(${h >> 16 & 255},${h >> 8 & 255},${h & 255},${a})`;
const grade = b => b >= 0.85 ? 'S' : b >= 0.65 ? 'A' : b >= 0.4 ? 'B' : 'C';
const GCOM = {S: '하늘이 터진 순간이에요', A: '색이 또렷하게 남았어요', B: '은은하게 나왔어요', C: '아쉽지만 이것도 기록'};
const AUR = {boost: 1, cur: 1, k: 0.85}, FIRE = {boost: 1, cur: 1}, IGL = {light: null};

start({
  key: 'arctic', title: '북극 오로라', enter: '눈 속으로 들어가기', time: 'night', nickIcon: '❄️',
  nick: [['눈 맞은', '코 빨간', '털모자 쓴', '잠 안 오는', '오로라 기다리는', '입김 나는'], ['순록', '썰매', '허스키', '이글루', '눈덩이', '북극여우']],
  intro: '<p>눈밖에 없는 밤, 이글루 하나와 모닥불 하나.<br>오로라 기다리다 가요.</p>',
  floor: {w: 30, d: 26, c1: '#cfdced', c2: '#b8cadf', around: 0x4a5e80},
  bg: {night: 0x0a1230},
  startPos: [0, 7], cam: {h: 9, back: 11},
  playerLook: {coat: 0x2e6f9e, pants: 0x3a3f4a, hair: 0x2a2018, hat: {type: 'beanie', c: 0xc9472f}, scarf: 0xf4ecdc, camera: true},
  build(c) {
    const {box, cyl, ball, glowBall, sign, solid, npc, fx, THREE, scene} = c;
    const D = daily(c.now()); AUR.k = D.lvl[1];
    // ── 오로라: 뒤쪽 높이 반투명 띠 세 겹(위쪽이 카메라 쪽으로 기울어 보이게), 물결치며 흐른다
    const mkTex = (lo, hi) => { const cv = document.createElement('canvas'); cv.width = 128; cv.height = 256; const g = cv.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, rgba(hi, 0)); gr.addColorStop(0.45, rgba(hi, 0.35)); gr.addColorStop(0.8, rgba(lo, 0.85)); gr.addColorStop(0.94, rgba(lo, 1)); gr.addColorStop(1, rgba(lo, 0));
      g.fillStyle = gr; g.fillRect(0, 0, 128, 256); g.globalCompositeOperation = 'destination-out';
      for (let x = 0; x < 128; x += 2) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.7})`; g.fillRect(x, 0, 2, 256); }
      const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t; };
    const layers = [{x: 0, z: -16, w: 52, h: 6.5, lo: D.pal.a, hi: D.pal.b, op: 0.9, ph: 0}, {x: -3, z: -18.5, w: 60, h: 7.5, lo: D.pal.b, hi: D.pal.a, op: 0.55, ph: 2.1},
      {x: 6, z: -14.3, w: 40, h: 4, lo: D.pal.a, hi: D.pal.a, op: 0.45, ph: 4.2}].map(L => {
      const geo = new THREE.PlaneGeometry(L.w, L.h, 48, 4); geo.translate(0, L.h / 2, 0);
      const mat = new THREE.MeshBasicMaterial({map: mkTex(L.lo, L.hi), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, opacity: L.op, fog: false});
      const m = new THREE.Mesh(geo, mat), g = new THREE.Group(); g.position.set(L.x, 1, L.z); g.rotation.x = 0.42; g.add(m); scene.add(g);
      return {...L, geo, mat, base: Array.from(geo.attributes.position.array)}; });
    const aurLight = new THREE.PointLight(D.pal.a, 0, 45); aurLight.position.set(0, 6, -9); scene.add(aurLight);
    fx.push((dt, t) => {
      AUR.cur += (AUR.boost - AUR.cur) * Math.min(1, dt * 4);
      for (const L of layers) { const p = L.geo.attributes.position.array, b = L.base;
        for (let i = 0; i < p.length; i += 3) { const x = b[i], u = b[i + 1] / L.h;
          p[i + 2] = (Math.sin(x * 0.22 + t * 0.5 + L.ph) * 1.6 + Math.sin(x * 0.5 - t * 0.8 + L.ph * 2) * 0.5) * (0.4 + 0.6 * u);
          p[i + 1] = b[i + 1] + Math.sin(x * 0.3 + t * 0.7 + L.ph) * 0.35 * u; }
        L.geo.attributes.position.needsUpdate = true;
        L.mat.opacity = Math.min(1, L.op * AUR.cur * AUR.k * (0.8 + 0.2 * Math.sin(t * 0.4 + L.ph))); }
      aurLight.intensity = 30 * AUR.k * AUR.cur * (0.85 + 0.15 * Math.sin(t * 0.6)); });
    // 떨어지는 눈가루
    const N = 160, dg = new THREE.BufferGeometry(), dp = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { dp[i * 3] = (Math.random() - 0.5) * 28; dp[i * 3 + 1] = Math.random() * 9; dp[i * 3 + 2] = (Math.random() - 0.5) * 24; }
    dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
    scene.add(new THREE.Points(dg, new THREE.PointsMaterial({color: 0xdfeeff, size: 2, sizeAttenuation: false, transparent: true, opacity: 0.6})));
    fx.push((dt, t) => { for (let i = 0; i < N; i++) { dp[i * 3 + 1] -= dt * 0.5; dp[i * 3] += Math.sin(t * 0.7 + i) * dt * 0.25; if (dp[i * 3 + 1] < 0) dp[i * 3 + 1] = 9; } dg.attributes.position.needsUpdate = true; });
    // 눈더미·얼음 조각·이정표
    for (const [x, z, r] of [[-12, 6, 1.7], [12, 8, 1.3], [-12, -9.5, 2.2], [13, -9, 1.6], [-2, -10, 1.3], [-11, -1, 1.2]]) { const m = ball(r, 0xe3ecf6, x, 0, z); m.scale.set(1, 0.42, 1.25); }
    for (const [x, z, h] of [[-12.5, 2, 1.8], [-11.5, 2.6, 1.2], [12.5, -4, 1.6], [-4, -11.5, 1.4]]) { const m = new THREE.Mesh(new THREE.ConeGeometry(0.35, h, 5), new THREE.MeshLambertMaterial({color: 0xa8dcff, emissive: 0x204060})); m.position.set(x, h / 2, z); m.castShadow = true; scene.add(m); }
    cyl(0.07, 0.07, 2.6, 0x5a3a22, -2, 1.3, -9);
    sign(['북극권 안쪽', '북위 78° 어디쯤'], 2.4, 0.8, '#c9472f', '#fff8ec', -2, 2.45, -8.9, 0, [44, 26]);
    cyl(0.06, 0.06, 1.6, 0x5a3a22, 9.5, 0.8, -6.9); sign(['곰 조심'], 1.5, 0.9, '#e0b040', '#2b2620', 9.5, 1.7, -6.85, 0, [78]);
    // ── 이글루: 반구 + 짧은 입구 + 눈 블록 줄 + 안에서 새는 불빛
    const snow = new THREE.MeshLambertMaterial({color: 0xeef4fa, emissive: 0x1a2438});
    const dome = new THREE.Mesh(new THREE.SphereGeometry(2.5, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), snow); dome.position.set(-7, 0, -5); dome.castShadow = dome.receiveShadow = true; scene.add(dome);
    for (const y of [0.6, 1.2, 1.8]) { const r = new THREE.Mesh(new THREE.TorusGeometry(Math.sqrt(6.25 - y * y), 0.025, 6, 40), new THREE.MeshLambertMaterial({color: 0xb5c8dc})); r.rotation.x = Math.PI / 2; r.position.set(-7, y, -5); scene.add(r); }
    box(1.6, 1.3, 1.9, 0xeef4fa, -7, 0.65, -2.35); solid(-7, -5, 5.2, 5.2); solid(-7, -2.35, 1.8, 1.9);
    const dk = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 1), new THREE.MeshBasicMaterial({color: 0x20180f})); dk.position.set(-7, 0.5, -1.39); scene.add(dk);
    const gl = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.8), new THREE.MeshBasicMaterial({color: 0xffc070})); gl.position.set(-7, 0.45, -1.38); scene.add(gl);
    IGL.light = new THREE.PointLight(0xffa860, 6, 9); IGL.light.position.set(-7, 1, -1); scene.add(IGL.light);
    // ── 모닥불: 돌 둘레, 장작, 불꽃 셋, 불똥, 흔들리는 불빛
    const FX = 3, FZ = -1.5;
    for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, s = ball(0.24, 0x7a8088, FX + Math.cos(a) * 0.95, 0.14, FZ + Math.sin(a) * 0.95); s.scale.y = 0.7; }
    for (const r of [0.5, -0.5]) { const l = cyl(0.11, 0.11, 1.3, 0x5a3a22, FX, 0.2, FZ); l.rotation.z = Math.PI / 2; l.rotation.y = r; }
    solid(FX, FZ, 2, 2);
    const fl = [[0xff6a1a, 0.45, 1.3], [0xffa828, 0.32, 1.0], [0xffe070, 0.2, 0.7]].map(([col, r, h]) => { const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), new THREE.MeshBasicMaterial({color: col, transparent: true, opacity: 0.92})); m.position.set(FX, 0.3 + h / 2, FZ); m.userData.h = h; scene.add(m); return m; });
    const fLight = new THREE.PointLight(0xff9040, 22, 18); fLight.position.set(FX, 1.3, FZ); scene.add(fLight);
    const sparks = Array.from({length: 8}, (_, i) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 4), new THREE.MeshBasicMaterial({color: 0xffb050})); m.userData.t = i / 8 * 2; scene.add(m); return m; });
    fx.push((dt, t) => { FIRE.cur += (FIRE.boost - FIRE.cur) * Math.min(1, dt * 3); const e = 1 + (FIRE.cur - 1) * 0.4;
      fl.forEach((m, i) => { const s = (1 + Math.sin(t * 11 + i * 2) * 0.1 + Math.sin(t * 17 + i) * 0.07) * FIRE.cur; m.scale.set(e, s, e); m.position.y = 0.3 + m.userData.h * s / 2; });
      fLight.intensity = 22 * FIRE.cur * (0.9 + Math.sin(t * 13) * 0.1 + Math.sin(t * 23) * 0.05);
      sparks.forEach((m, i) => { m.userData.t += dt; const k = m.userData.t % 2; m.position.set(FX + Math.sin(i * 2 + k * 3) * 0.4, 0.8 + k * 1.3, FZ + Math.cos(i * 3 + k * 2) * 0.4); m.scale.setScalar(1 - k / 2.2); }); });
    cyl(0.18, 0.18, 1.5, 0x6a4a2e, -0.2, 0.18, -1.5).rotation.x = Math.PI / 2;   // 앉는 통나무
    cyl(0.18, 0.18, 1.6, 0x6a4a2e, 3, 0.18, -3.6).rotation.z = Math.PI / 2;
    glowBall(0.2, 0xffe070, FX, 0.5, FZ, 0);
    // 연구하는 사람 하나 — 불 옆에 서서 가끔 손을 흔들고 한 모금
    c.friend = npc({coat: 0xd8903a, pants: 0x3a3f4a, hat: {type: 'beanie', c: 0x44506a}, scarf: 0xe8e8e8, glasses: true}, [[1.0, -1.5]], {face: Math.PI / 2, idle: ['wave', 'sip']});
    // ── 썰매와 허스키
    const sl = new THREE.Group(); sl.position.set(11.4, 0, -1.5); sl.rotation.y = 0.15; scene.add(sl);
    for (const z of [-0.5, 0.5]) box(2.8, 0.1, 0.12, 0x5a3a22, 0, 0.12, z, sl);
    for (let i = 0; i < 6; i++) box(0.3, 0.06, 1.2, 0x8a6a4a, -1 + i * 0.4, 0.28, 0, sl);
    for (const z of [-0.5, 0.5]) box(0.06, 1.1, 0.06, 0x5a3a22, -1.3, 0.8, z, sl);
    box(0.06, 0.06, 1.1, 0x5a3a22, -1.3, 1.35, 0, sl); box(1.2, 0.55, 0.8, 0xa8452f, 0.2, 0.6, 0, sl); box(1.25, 0.06, 0.2, 0xe8d8b0, 0.2, 0.88, 0, sl);
    solid(11.4, -1.5, 3.2, 1.4); box(2.4, 0.02, 0.02, 0x6a5a4a, 9.2, 0.25, -1.5);
    const dog = (x, z, ry, col) => { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
      const b = ball(0.3, col, 0, 0.26, 0, g); b.scale.set(1, 0.75, 1.5); ball(0.17, 0xf0f0f0, 0, 0.34, 0.5, g);
      for (const s of [-0.1, 0.1]) box(0.07, 0.12, 0.05, col, s, 0.5, 0.48, g); ball(0.14, 0xf0f0f0, 0, 0.26, -0.5, g);
      fx.push((dt, t) => { b.scale.y = 0.75 + Math.sin(t * 1.6 + x) * 0.03; }); solid(x, z, 1, 1); };
    dog(8.3, -1.0, -Math.PI / 2, 0x7a8088); dog(8.3, -2.0, -Math.PI / 2, 0x4a4f58); dog(7.3, -1.5, -Math.PI / 2, 0x8a8f98);
    // ── 멀리 북극곰: 흰 덩어리가 천천히 오간다
    const bear = new THREE.Group(); scene.add(bear); const W = 0xf2f5f8;
    const bb = ball(0.8, W, 0, 1.0, 0, bear); bb.scale.set(1, 0.85, 1.6); ball(0.42, W, 0, 1.15, 1.25, bear);
    const sn = ball(0.2, W, 0, 1.05, 1.6, bear); sn.scale.z = 1.3; ball(0.07, 0x111111, 0, 1.1, 1.8, bear);
    for (const s of [-0.25, 0.25]) ball(0.12, W, s, 1.5, 1.1, bear);
    const legs = [[-0.45, 0.7], [0.45, 0.7], [-0.45, -0.7], [0.45, -0.7]].map(([x, z]) => { const lg = new THREE.Group(); lg.position.set(x, 0.8, z); bear.add(lg); cyl(0.2, 0.18, 0.8, W, 0, -0.4, 0, lg); return lg; });
    bear.scale.setScalar(0.9);
    let bx = 4, dir = 1, look = 0; bear.rotation.y = Math.PI / 2;
    fx.push((dt, t) => {
      if (look > 0) { look -= dt; bear.rotation.y += (0 - bear.rotation.y) * Math.min(1, dt * 2.5); legs.forEach(l => l.rotation.x *= 0.9); }
      else { bx += dir * 0.5 * dt; if (bx > 11.5) dir = -1; if (bx < 2.5) dir = 1; const tg = dir > 0 ? Math.PI / 2 : -Math.PI / 2; bear.rotation.y += (tg - bear.rotation.y) * Math.min(1, dt * 2);
        legs.forEach((l, i) => l.rotation.x = Math.sin(t * 3 + (i % 2 ? Math.PI : 0) + (i > 1 ? 1.5 : 0)) * 0.4); }
      bear.position.set(bx, 0, -10.5); });
    c.bearLook = () => { look = 4.5; };
  },
  lamps: [],
  acts: [
    {id: 'wait', icon: '🌌', label: '오로라', spot: [0.4, 3.4], face: Math.PI, run(c, done) {
      const T = daily(c.now());
      c.play(`<h3>오로라 기다리기</h3><p style="font-size:13px;color:#7a6e5e">하늘이 가장 환할 때 셔터! 세 컷 중 제일 잘 나온 한 장이 남아요</p>
        <canvas id="sk" width="320" height="140" style="width:100%;border-radius:6px;background:#0a1230"></canvas><p id="msg" style="font-size:14px;min-height:40px">남은 컷 3</p>
        <div class="row" style="justify-content:center"><button class="btn" id="no">그만두기</button><button class="btn main" id="sh">📷 찰칵</button></div>`,
        (el, close) => {
          const g = el.querySelector('#sk').getContext('2d'), msg = el.querySelector('#msg'); let alive = true, left = 3, best = 0, lock = false, flash = 0, cur = 0; const t0 = performance.now();
          const bright = t => { const u = Math.sin(t * 1.3) * 0.5 + 0.5, v = Math.sin(t * 0.55 + 1) * 0.5 + 0.5; return Math.min(1, 0.05 + Math.pow(u, 3) * (0.6 + 0.4 * v)); };
          const rib = [[T.pal.a, 64, 0], [T.pal.b, 48, 2], [T.pal.a, 84, 4]].map(([col, y0, ph]) => { const gr = g.createLinearGradient(0, -52, 0, 10);
            gr.addColorStop(0, rgba(col, 0)); gr.addColorStop(0.7, rgba(col, 1)); gr.addColorStop(1, rgba(col, 0)); return {gr, y0, ph}; });
          const stars = Array.from({length: 26}, () => [Math.random() * 320, Math.random() * 100, Math.random()]);
          const end = () => { alive = false; AUR.boost = 1; close(); };
          (function frame() { if (!alive) return; const t = (performance.now() - t0) / 1000; cur = bright(t); AUR.boost = 0.45 + cur * 1.1;
            g.fillStyle = '#0a1230'; g.fillRect(0, 0, 320, 140); g.fillStyle = '#dfeaff';
            for (const [x, y, a] of stars) { g.globalAlpha = 0.3 + a * 0.5; g.fillRect(x, y, 1.5, 1.5); }
            for (const R of rib) for (let x = 0; x < 320; x += 5) { g.save(); g.translate(x, R.y0 + Math.sin(x * 0.03 + t * 0.7 + R.ph) * 16); g.fillStyle = R.gr;
              g.globalAlpha = Math.min(1, cur * (0.55 + 0.45 * Math.sin(x * 0.2 + t * 3 + R.ph))); g.fillRect(0, -52, 6, 62); g.restore(); }
            g.globalAlpha = 1; g.fillStyle = '#16203a'; g.fillRect(0, 122, 320, 18);
            if (flash > 0) { g.fillStyle = `rgba(255,255,255,${flash})`; g.fillRect(0, 0, 320, 140); flash -= 0.06; }
            requestAnimationFrame(frame); })();
          el.querySelector('#no').onclick = () => { end(); done(); };
          el.querySelector('#sh').onclick = () => { if (lock || !left) return; lock = true; const b = cur; left--; best = Math.max(best, b); flash = 0.9; c.beep(1500, 0.04); c.beep(900, 0.05, 0.05);
            if (left) { msg.textContent = `${grade(b)} 컷 · 남은 컷 ${left}`; setTimeout(() => lock = false, 500); return; }
            const gr = grade(best); c.count('wait'); c.DB.photos = [...(c.DB.photos || []), {d: c.dkey(c.now()), g: gr, n: T.pal.n}].slice(-30); c.save();
            msg.innerHTML = `<b>가장 잘 나온 컷 ${gr}</b><br><span style="font-size:13px;color:#7a6e5e">${GCOM[gr]}</span>`;
            if (gr === 'S' || gr === 'A') c.doAct(c.player, 'cheer');
            setTimeout(() => { end(); c.stamp(gr, T.pal.n + ' 오로라'); done(); }, 1900); };
        }); }},
    {id: 'fire', icon: '🔥', label: '모닥불', spot: [3, 0.4], face: Math.PI, run(c, done) {
      const mug = new c.THREE.Group(); c.cyl(0.07, 0.06, 0.14, 0xd8d0c0, 0, 0.12, 0, mug); c.hand.add(mug);
      FIRE.boost = 1.7; c.doAct(c.player, 'sip'); c.doAct(c.friend.o, 'wave'); c.beep(180, 0.4, 0, 'sine', 0.04);
      const n = c.count('fire');
      c.toast(n === 1 ? '🔥 불 앞에 서면 얼굴부터 녹아요' : n === 2 ? '🔥 앞은 뜨거운데 등은 아직 영하' : ['🔥 장작 타는 소리', '🔥 코끝이 이제야 돌아와요', '🔥 손을 뒤집어 가며 쬐어요'][n % 3]);
      setTimeout(() => { c.hand.remove(mug); FIRE.boost = 1; if (n % 3 === 0) c.stamp('후끈', `오늘 ${n}번째 쬐기`); done(); }, 2600); }},
    {id: 'bear', icon: '🐻', label: '곰 보기', spot: [7.5, -5.2], face: Math.PI, run(c, done) {
      const bin = new c.THREE.Group(); for (const x of [-0.05, 0.05]) c.cyl(0.035, 0.035, 0.16, 0x222222, x, 0, 0, bin).rotation.x = Math.PI / 2; c.hand.add(bin);
      c.doAct(c.player, 'sip'); const n = c.count('bear'); if (n % 3 === 0) c.bearLook();
      setTimeout(() => c.toast(n === 1 ? '🐻 저 멀리 하얀 덩어리가 걸어요. 가까이 가면 안 돼요 — 눈 위에선 곰이 훨씬 빨라요'
        : n % 3 === 0 ? '🐻 방금 이쪽을 봤어요. 기분 탓이길'
        : n === 2 ? '🐻 곰은 아주 먼 곳의 냄새도 맡아요. 우린 이미 들켰을지도'
        : ['🐻 곰은 오늘도 바쁜 척 걸어요', '🐻 새끼는 안 보여요. 혼자 산책 중', '🐻 털은 사실 투명해요. 하얗게 보이는 건 빛 때문'][n % 3], 3600), 700);
      setTimeout(() => { c.hand.remove(bin); done(); }, 2500); }},
    {id: 'rest', icon: '🛖', label: '이글루', spot: [-7, -0.2], face: Math.PI, run(c, done) {
      const D = daily(c.now());
      c.goTo(-7, -3.6, () => { c.player.visible = false; IGL.light.intensity = 14; c.toast('🛖 안은 바람이 없어요. 눈 벽이 소리까지 먹어요', 3000);
        setTimeout(() => { const n = c.count('rest');
          c.dialog('이글루 안', `${c.hm(c.now())} · 오늘 ${n}번째 쉼`, `<p style="font-size:16px">${D.fact}</p><p style="color:#7a6e5e;font-size:13px">사실은 하루에 하나. 내일은 다른 이야기.</p>`,
            [['나가기', () => { c.player.visible = true; IGL.light.intensity = 6; c.goTo(-7, -0.2, done); }, 'main']]); }, 2600); }); }},
  ],
  recExtra: c => { const D = daily(c.now()), ph = c.DB.photos || [], best = ['S', 'A', 'B', 'C'].find(g => ph.some(p => p.g === g));
    return `<p style="font-size:13px;color:#7a6e5e">오늘의 오로라: ${D.pal.n} · ${D.lvl[0]}</p><p style="font-size:13px">${D.fact}</p>`
      + `<p style="font-size:13px;color:#7a6e5e">찍은 사진 ${ph.length}장${best ? ' · 가장 잘 나온 컷 ' + best : ''}</p>`; },
  onEnter(c) { const D = daily(c.now()); c.toast(`🌌 오늘 오로라: ${D.pal.n} · ${D.lvl[0]}`, 3200); },
});
</script></body></html>
