<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>코인 노래방</title></head><body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import {start} from '../mini.js';

// 곡은 다 지어낸 제목 — 날마다 번호와 함께 바뀐다
const SONGS = ['비 오는 정류장에서','라면 끓는 소리','월요일 아침 송','우리 동네 골목길','첫눈 오면 전화해','퇴근길 이호선','옥탑방 여름밤','편지 한 장','고장 난 자판기','네가 웃던 편의점','막차는 떠나고','택배 아저씨 블루스'];
const DOODLE = ['「여기서 고백함. 실패함.」','「3번 방 마이크 지지직거려요」','「100점 나옴!!! 진짜임」','「시험 끝났다 만세」','「혼코노 30일째」','「다음 주에 또 오자 — 우리 넷」','「탬버린 칠 사람 구함」'];
const seed = c => { const d = c.now(); return d.getFullYear() * 400 + (d.getMonth() + 1) * 32 + d.getDate(); };
let booked = null;

start({
  key: 'karaoke', title: '코인 노래방', enter: '부스 문 열기', time: 'night', nickIcon: '🎤',
  nick: [['혼자 온','고음 자신 있는','박자 놓치는','탬버린 담당','두 곡만 할','목 푼'],['마이크','동전','탬버린','반주','후렴','에코']],
  intro: '<p>오락실 옆 좁은 부스. 동전 넣고 한 곡,<br>박자 맞춰 부르고 점수 받아 가요.</p>',
  floor: {w: 18, d: 16, c1: '#2a2440', c2: '#342c50', pattern: 'tile', around: 0x0b0a12},
  bg: {night: 0x08070f},
  startPos: [0, 5], cam: {h: 8, back: 10},
  playerLook: {coat: 0x3a4a6a, pants: 0x33363f, hair: 0x2a2018},
  build(c) {
    const {box, cyl, ball, sign, solid, npc, fx, THREE, scene} = c;
    const glow = col => new THREE.MeshBasicMaterial({color: col});
    // 방 벽 + 네온 띠
    box(18, 6, 0.4, 0x2b2245, 0, 3, -8); box(0.4, 6, 16, 0x2b2245, -9, 3, 0); box(0.4, 6, 16, 0x2b2245, 9, 3, 0);
    box(18, 0.08, 0.08, glow(0x4fd8ff), 0, 4.6, -7.75); box(0.08, 0.08, 16, glow(0xff4fa0), -8.75, 4.6, 0); box(0.08, 0.08, 16, glow(0xff4fa0), 8.75, 4.6, 0);
    // 큰 화면 — 가사 자리(지어낸 곡 제목)
    box(7.4, 3.6, 0.2, 0x111118, 0, 2.6, -7.7);
    const d = c.now(), s = seed(c), song = SONGS[s % SONGS.length], no = 10000 + (s * 37) % 89999;
    c.screen = sign([`${no}  ${song}`, '♪ ── ── ── ♪', '반주가 시작되면 부르세요'], 7, 3.3, '#1a1a4a', '#f4ecdc', 0, 2.6, -7.58, 0, [36, 40, 26]);
    sign(['동전 노래방', '한 곡 오백 원'], 3, 1, '#1a0f2a', '#ff7ad0', -6, 4.9, -7.55, 0, [60, 34]);
    // 반주기·마이크 스탠드·탁자
    box(1.6, 1.2, 0.8, 0x1a1a22, -5, 0.6, -7); box(1.2, 0.1, 0.4, glow(0x6fe08a), -5, 1.0, -6.58); solid(-5, -7, 1.6, 0.8);
    cyl(0.04, 0.04, 1.6, 0x888888, 1.6, 0.8, -4.6); cyl(0.3, 0.3, 0.04, 0x444444, 1.6, 0.02, -4.6); ball(0.1, 0x222222, 1.6, 1.65, -4.6);
    cyl(1, 1, 0.08, 0x8a6a4a, 0, 0.75, 0); cyl(0.12, 0.12, 0.75, 0x555555, 0, 0.37, 0); solid(0, 0, 2, 2);
    // 탬버린(탁자 위) + 음료 캔
    c.tamb = cyl(0.28, 0.28, 0.07, 0xd9b45a, -0.3, 0.84, 0.1); cyl(0.07, 0.07, 0.22, 0x4fa0ff, 0.4, 0.9, -0.2);
    // ㄷ자 소파
    box(6, 0.6, 1, 0x7a2a4a, 0, 0.3, 3); box(6, 1, 0.3, 0x7a2a4a, 0, 0.8, 3.45); solid(0, 3, 6, 1);
    for (const x of [-3.5, 3.5]) { box(1, 0.6, 4, 0x7a2a4a, x, 0.3, 1); solid(x, 1, 1, 4); }
    // 미러볼 + 도는 색 불빛
    cyl(0.01, 0.01, 1, 0x888888, 4, 5.6, -1); const mb = ball(0.4, 0xd0d8e8, 4, 5.0, -1); mb.material.emissive = new THREE.Color(0x404858);
    const Ls = [0xff4fa0, 0x4fd8ff, 0xf2c14e].map(col => { const l = new THREE.PointLight(col, 14, 12); scene.add(l); return l; });
    fx.push((dt, t) => { mb.rotation.y += dt * 1.2; Ls.forEach((l, i) => { const a = t * 0.9 + i * 2.1; l.position.set(Math.sin(a) * 5, 3.2, -2 + Math.cos(a) * 4); }); });
    // 벽 낙서(옆 벽 쪽지)
    sign(['방명록', '낙서는 여기에만'], 2, 1.2, '#f4ecdc', '#2b2620', -8.75, 2.4, 2, Math.PI / 2, [44, 30]);
    // 같이 온 친구 — 소파에서 박수
    c.pal = npc({coat: 0x6b5a4a, hairStyle: 'bob', hair: 0x2a2018}, [[2.2, 2.2]], {face: Math.PI, idle: ['cheer', 'wave']});
  },
  acts: [
    {id: 'coin', icon: '🪙', label: '동전', spot: [-4.4, -5.6], face: Math.PI, run(c, done) {
      c.player.rotation.y = Math.PI; c.doAct(c.player, 'throw'); c.beep(1500, .05); c.beep(1900, .07, .07);
      const n = c.count('coin'), s = seed(c), song = SONGS[(s + n - 1) % SONGS.length], no = 10000 + ((s + n - 1) * 37) % 89999;
      booked = song; c.toast(`🎵 ${no} 「${song}」 예약 · 오늘 ${n}곡째`); setTimeout(done, 1400); }},
    {id: 'sing', icon: '🎤', label: '부르기', spot: [1.0, -3.8], face: Math.PI, run(c, done) {
      if (!booked) { c.toast('🪙 동전부터 넣어요. 반주기 앞에서'); done(); return; }
      c.player.rotation.y = Math.PI;
      c.play(`<h3>「${booked}」</h3><p style="font-size:13px;color:#7a6e5e">음표가 노란 칸에 들어오면 「♪」 — 네 번</p>
        <div style="position:relative;height:28px;border:2px solid #2b2620;border-radius:4px;background:#e6dcc8;margin:14px 0">
          <div style="position:absolute;left:44%;width:14%;top:0;bottom:0;background:#e0b040"></div>
          <div id="bar" style="position:absolute;left:0;top:-2px;font-size:22px;line-height:28px;margin-left:-8px">♪</div></div>
        <p id="msg" style="min-height:24px"></p><div class="row" style="justify-content:center"><button class="btn main" id="hit">♪</button></div>`,
        (el, close) => {
          const s = seed(c), bpm = 0.42 + (s % 5) * 0.06; let x = 0, sp = bpm, round = 0, good = 0, alive = true, last = performance.now();
          const bar = el.querySelector('#bar'), msg = el.querySelector('#msg'), notes = [523, 587, 659, 784];
          (function tick(t) { if (!alive) return; x += (t - last) / 1000 * sp; last = t; if (x > 1) x = 0; bar.style.left = (x * 100) + '%'; requestAnimationFrame(tick); })(last);
          el.querySelector('#hit').onclick = () => {
            const ok = x >= 0.44 && x <= 0.58; c.beep(ok ? notes[round] : 220, .18, 0, ok ? 'triangle' : 'square', .06); if (ok) good++;
            msg.textContent = ok ? ['딱 맞았어요', '목소리 좋은데요', '이 박자야', '후렴 들어갑니다'][round] : x < 0.44 ? '살짝 빨랐어요' : '반 박자 늦었어요'; round++; x = 0; sp *= 1.12;
            if (round === 4) { alive = false;
              const n = c.count('sing'), score = good === 4 ? 100 : 58 + good * 9 + (s + n * 7) % 8;
              if (score > (c.DB.best || 0)) { c.DB.best = score; c.save(); } booked = null;
              setTimeout(() => { close(); c.stamp(score === 100 ? '100점!' : score + '점', score === 100 ? '빵빠레~ 오늘 ' + n + '곡' : `오늘 ${n}곡 · 최고 ${c.DB.best}점`);
                if (score === 100) [523, 659, 784, 1046].forEach((f, i) => c.beep(f, .15, i * .14, 'triangle', .06));
                c.doAct(c.pal.o, 'cheer'); c.doAct(c.player, score >= 80 ? 'cheer' : 'wave'); done(); }, 700); }
          };
        });
    }},
    {id: 'tamb', icon: '🎶', label: '탬버린', spot: [-0.4, 1.4], face: Math.PI, run(c, done) {
      c.doAct(c.player, 'cheer'); c.doAct(c.pal.o, 'cheer'); const n = c.count('tamb');
      for (let i = 0; i < 6; i++) c.beep(2400 + (i % 2) * 300, .04, i * .12, 'square', .03);
      let k = 0; const sh = setInterval(() => { c.tamb.rotation.z = (k++ % 2 ? .3 : -.3); if (k > 8) { clearInterval(sh); c.tamb.rotation.z = 0; } }, 110);
      c.toast(n === 1 ? '🎶 찰랑찰랑 — 분위기 담당 접수' : `🎶 ${n}번째… 친구가 「이제 그만」 눈빛`); setTimeout(done, 1500); }},
    {id: 'doodle', icon: '✏️', label: '방명록', spot: [-7.6, 2], face: -Math.PI / 2, run(c, done) {
      c.doAct(c.player, 'crouch'); const n = c.count('doodle'), s = seed(c), line = DOODLE[(s + n) % DOODLE.length];
      setTimeout(() => { c.dialog('벽 방명록', `${c.hm(c.now())} · ${c.visits()}번째 온 날`, `<p>누가 남긴 낙서:</p><p style="font-size:17px">${line}</p>` +
        (n === 1 ? '<p style="color:#7a6e5e;font-size:13px">나도 한 줄 — 「' + c.DB.nick + ' 다녀감」</p>' : ''), [['나가기', done, 'main']]); }, 900); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">최고 점수 ${c.DB.best || 0}점</p>`,
  onEnter(c) { c.toast('🎤 「아아, 마이크 테스트… 동전부터 넣어요」', 3000); },
});
</script></body></html>
