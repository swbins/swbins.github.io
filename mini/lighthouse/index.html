<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>외딴섬 등대</title></head><body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import {start} from '../mini.js';

const SEA = [['잔잔', '0.5m', '북서풍 약하게', '수평선이 자로 그은 것 같았다.'], ['너울', '1.5m', '남풍', '바위에 부딪히는 소리가 밤새 컸다.'], ['물안개', '0.5m', '바람 없음', '불빛이 안개 속에서 둥글게 번졌다.'],
  ['높음', '2.5m', '북동풍 강하게', '창문이 덜컹. 배는 한 척도 안 나갔다.'], ['맑음', '1m', '서풍', '별이 바다에 다 비쳤다.'], ['보슬비', '1m', '남서풍', '갈매기들이 등대 처마 밑에 모였다.']];
const SHIP = ['오징어잡이 배 불빛이 줄지어 있어요','화물선 한 척이 천천히 지나가요','작은 통통배가 항구로 들어가요','여객선 창문 불빛이 반짝여요','멀리 배 한 척 — 이쪽으로 불빛을 깜박여요'];
const seed = c => { const d = c.now(); return d.getFullYear() * 400 + (d.getMonth() + 1) * 32 + d.getDate(); };

start({
  key: 'lighthouse', title: '외딴섬 등대', enter: '등대 문 열기', time: 'night', nickIcon: '🗼',
  nick: [['밤새 깨어 있는','바람 맞는','갈매기 친구','수평선 보는','일지 쓰는','외딴섬'],['등대지기','불빛','갈매기','너울','뱃고동','수평선']],
  intro: '<p>육지에서 배로 두 시간, 바위섬 끝 하얀 등대.<br>불을 지키고, 지나가는 배를 세고, 일지를 써요.</p>',
  floor: {w: 22, d: 20, c1: '#6a665e', c2: '#78746a', around: 0x14304a},
  bg: {night: 0x0a1428},
  startPos: [0, 6], cam: {h: 10, back: 12},
  playerLook: {coat: 0x2b3a5a, pants: 0x33363f, hair: 0x2a2018, hat: {type: 'beanie', c: 0x2b2b2b}},
  build(c) {
    const {box, cyl, ball, sign, solid, npc, fx, THREE, scene} = c;
    // 바위 둘레
    for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, r = 9.6 + Math.sin(i * 3) * 0.6; const b = ball(0.8 + (i % 3) * 0.3, 0x4a4842, Math.cos(a) * r, 0.2, Math.sin(a) * r * 0.9); b.scale.y = 0.6; }
    // 등대 — 흰 몸에 빨간 띠, 꼭대기에 불
    const L = {x: -3, z: -4};
    cyl(1.3, 1.7, 8, 0xf4f0e8, L.x, 4, L.z, undefined, 20); for (const y of [2.4, 5.4]) cyl(1.48 - y * 0.035, 1.52 - y * 0.035, 0.8, 0xc9302f, L.x, y, L.z, undefined, 20);
    cyl(1.6, 1.6, 0.2, 0x2b2b2b, L.x, 8.1, L.z); cyl(0.9, 0.9, 1.2, 0x9ad0ff, L.x, 8.8, L.z).material.transparent = true;
    cyl(0.2, 1.1, 0.7, 0xc9302f, L.x, 9.75, L.z); box(0.9, 1.6, 0.1, 0x5a4030, L.x, 0.8, L.z + 1.65); solid(L.x, L.z, 3.4, 3.4);
    c.lamp = c.glowBall(0.5, 0xfff0b0, L.x, 8.8, L.z, 30, 30);
    // 도는 빛줄기 — 반투명 원뿔 두 개
    const beamM = new THREE.MeshBasicMaterial({color: 0xfff4c0, transparent: true, opacity: .18, depthWrite: false, side: THREE.DoubleSide});
    c.beam = new THREE.Group(); c.beam.position.set(L.x, 8.8, L.z); scene.add(c.beam);
    for (const s of [1, -1]) { const m = new THREE.Mesh(new THREE.ConeGeometry(1.6, 26, 16, 1, true), beamM); m.rotation.z = s * Math.PI / 2; m.position.x = s * 13; c.beam.add(m); }
    c.beamSpeed = 0.6; c.blink = null;
    fx.push(dt => { c.beam.rotation.y += dt * c.beamSpeed; });
    // 관사(작은 집) + 일지 책상
    box(4, 2.6, 3, 0xe6dcc8, 4.5, 1.3, -4.5); const r = box(4.6, 0.3, 3.6, 0x2f5a7a, 4.5, 2.75, -4.5); r.rotation.z = 0.05; solid(4.5, -4.5, 4, 3);
    box(0.9, 1.3, 0.1, 0x5a4030, 4.5, 0.65, -2.95); const w = box(0.8, 0.6, 0.06, new THREE.MeshBasicMaterial({color: 0xffd27a}), 5.8, 1.6, -2.95); w.castShadow = false;
    box(1.4, 0.1, 0.8, 0x8a6a4a, 6.4, 0.9, -1.6); for (const [x, z] of [[5.8, -1.3], [7, -1.3], [5.8, -1.9], [7, -1.9]]) box(0.08, 0.9, 0.08, 0x6a4a3a, x, 0.45, z); solid(6.4, -1.6, 1.4, 0.8);
    box(0.5, 0.05, 0.36, 0xf4ecdc, 6.3, 0.97, -1.6);
    sign(['등대 관리소', '1924 —'], 1.8, 0.7, '#f4ecdc', '#2f5a7a', 4.5, 2.1, -2.93, 0, [56, 40]);
    // 난간·벤치·구명환
    for (let i = 0; i < 7; i++) box(0.08, 0.9, 0.08, 0xc8c0b0, -6 + i * 2, 0.45, 7.5); box(12.2, 0.08, 0.08, 0xc8c0b0, 0, 0.88, 7.5);
    box(2, 0.4, 0.6, 0x8a6a4a, 3, 0.4, 5); solid(3, 5, 2, 0.6);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.1, 8, 18), new THREE.MeshLambertMaterial({color: 0xe8732a})); ring.position.set(2.8, 1.7, -2.95); scene.add(ring);
    // 바다 위 배 불빛 — 천천히 지나간다
    c.ships = [];
    for (let i = 0; i < 4; i++) { const g = new THREE.Group(); g.position.set(-40 + i * 22, 0, -24 - i * 5); scene.add(g);
      box(2.4, 0.5, 0.8, 0x2b2b2b, 0, 0.25, 0, g); box(0.8, 0.6, 0.6, 0xe6dcc8, 0.4, 0.8, 0, g);
      const l = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 6), new THREE.MeshBasicMaterial({color: i % 2 ? 0x9affb0 : 0xffe2a0})); l.position.set(-0.6, 0.9, 0); g.add(l);
      c.ships.push({g, v: 0.8 + i * 0.25}); }
    fx.push(dt => c.ships.forEach(s => { s.g.position.x += s.v * dt; if (s.g.position.x > 45) s.g.position.x = -45; }));
    // 갈매기 셋 — 등대 둘레를 돈다
    c.gulls = [];
    for (let i = 0; i < 3; i++) { const g = new THREE.Group(); scene.add(g); const b = ball(0.18, 0xf4f4f0, 0, 0, 0, g); b.scale.set(1.6, 0.8, 0.8);
      const wl = box(0.9, 0.04, 0.3, 0xe8e8e8, 0, 0.05, 0, g); c.gulls.push({g, wl, a: i * 2.1, r: 4 + i, h: 6 + i * 0.8}); }
    fx.push((dt, t) => c.gulls.forEach(o => { o.a += dt * 0.4; o.g.position.set(L.x + Math.cos(o.a) * o.r, o.h + Math.sin(t * 2 + o.a) * 0.3, L.z + Math.sin(o.a) * o.r); o.g.rotation.y = -o.a; o.wl.rotation.x = Math.sin(t * 8 + o.a) * 0.5; }));
    // 늙은 등대지기 — 관사 앞
    c.keeper = npc({coat: 0x3a4a5a, hairStyle: 'short', hair: 0xb8b0a8, glasses: true, hat: {type: 'cap', c: 0x2b3a5a}}, [[4.5, -1.8], [1, 2], [-1, 1]], {wait: 4, speed: 1.2, idle: ['wave']});
  },
  lamps: [[0, 2], [5, -2]],
  acts: [
    {id: 'signal', icon: '💡', label: '불빛 세기', spot: [-3, -1.4], face: Math.PI, run(c, done) {
      c.player.rotation.y = Math.PI; const n0 = c.today().signal || 0, N = 3 + (seed(c) + n0) % 5;
      c.play(`<h3>오늘의 등대 신호</h3><p style="font-size:13px;color:#7a6e5e">등대마다 깜박이는 횟수가 달라요. 몇 번 깜박이는지 세어 보세요</p>
        <div id="lp" style="width:70px;height:70px;border-radius:50%;margin:16px auto;border:2px solid #2b2620;background:#3a3a3a;transition:background .08s"></div>
        <div class="row" style="justify-content:center;visibility:hidden" id="ops"></div><p id="msg" style="min-height:24px"></p>`,
        (el, close) => {
          const lp = el.querySelector('#lp'), ops = el.querySelector('#ops'), msg = el.querySelector('#msg');
          let k = 0; const on = () => { lp.style.background = '#fff0a0'; lp.style.boxShadow = '0 0 30px #ffe060'; c.beep(880, .08, 0, 'sine', .04); c.lamp.scale.setScalar(1.8); },
            off = () => { lp.style.background = '#3a3a3a'; lp.style.boxShadow = 'none'; c.lamp.scale.setScalar(1); };
          (function step() { if (k >= N) { off(); return showOps(); } on(); setTimeout(() => { off(); k++; setTimeout(step, 380 + Math.random() * 120); }, 260); })();
          function showOps() { const opts = [N - 1, N, N + 1].map((v, i, a) => a[(i + N) % 3]); ops.style.visibility = 'visible';
            ops.innerHTML = opts.map(v => `<button class="btn" data-v="${v}">${v}번</button>`).join('');
            ops.querySelectorAll('button').forEach(b => b.onclick = () => { const ok = +b.dataset.v === N, n = c.count('signal'); if (ok) c.count('right');
              ops.querySelectorAll('button').forEach(x => x.disabled = true); c.beep(ok ? 1200 : 300, .12);
              msg.textContent = ok ? `맞아요 — ${N}번. 배들이 이 섬을 알아봐요` : `${N}번이었어요. 다시 보면 보여요`;
              setTimeout(() => { close(); c.stamp(ok ? '반짝!' : '음…', `${N}번 깜박 · 오늘 ${n}번 셌어요`); c.doAct(c.keeper.o, ok ? 'cheer' : 'wave'); done(); }, 1300); }); }
        });
    }},
    {id: 'ship', icon: '🚢', label: '배 보기', spot: [1, -8], face: Math.PI, run(c, done) {
      c.player.rotation.y = Math.PI; const n = c.count('ship'), cnt = 2 + (seed(c) + n) % 6;
      setTimeout(() => { c.toast(`🚢 수평선에 배 ${cnt}척 — ${SHIP[(seed(c) + n) % SHIP.length]}`, 3400); [0, .5].forEach(w => c.beep(110, .5, w, 'sawtooth', .04)); done(); }, 1200); }},
    {id: 'gull', icon: '🕊', label: '갈매기', run(c, done) {
      c.doAct(c.player, 'wave'); const n = c.count('gull'); c.gulls.forEach(o => { o.h -= 2; setTimeout(() => o.h += 2, 2500); });
      c.beep(1400, .1, 0, 'sine', .04); c.beep(1200, .12, .15, 'sine', .04);
      c.toast(n === 1 ? '🕊 갈매기들이 내려와 한 바퀴 돌고 가요' : `🕊 ${n}번째 — 이제 얼굴을 아는 것 같아요`); setTimeout(done, 2000); }},
    {id: 'log', icon: '📖', label: '일지', spot: [6.3, -0.6], face: Math.PI, run(c, done) {
      c.player.rotation.y = Math.PI; c.doAct(c.player, 'crouch'); const d = c.now(), [sky, wave, wind, line] = SEA[seed(c) % SEA.length], first = !c.today().log; c.count('log');
      setTimeout(() => c.dialog('등대 일지', `${d.getMonth() + 1}월 ${d.getDate()}일 ${c.hm(d)} · ${c.visits()}번째 밤`,
        `<div class="stat"><div><b>${sky}</b><span>바다</span></div><div><b>${wave}</b><span>파도 높이</span></div></div><p>바람: ${wind}</p><p style="font-size:16px">「${line}」</p>` +
        (first ? `<p style="color:#7a6e5e;font-size:13px">아래에 한 줄 — 「불 이상 없음. ${c.DB.nick}」</p>` : '<p style="color:#7a6e5e;font-size:13px">오늘 일지는 벌써 썼어요.</p>'), [['덮기', done, 'main']]), 900); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">신호 맞힌 횟수 모두 ${c.DB.total.right || 0}번</p>`,
  onEnter(c) { c.toast('🗼 「바람 세다. 모자 꽉 쓰고 올라와」', 3000); },
});
</script></body></html>
