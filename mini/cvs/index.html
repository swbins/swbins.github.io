        setTimeout(() => { c.hand.remove(cup); c.fx.splice(c.fx.indexOf(anim), 1); done(); }, 2200); }, 5400); }},
    {id: 'tidy', icon: '📦', label: '정리', spot: [-3.6, -4.7], face: -Math.PI / 2, run(c, done) {
      const first = !c.today().tidy; c.doAct(c.player, 'crouch'); c.goods.forEach(m => { if (Math.random() < 0.15) c.setTr(m, true); }); c.beep(420, .06);
      setTimeout(() => { c.goods.forEach(m => c.setTr(m, false)); c.beep(520, .06); c.beep(620, .06, .1); }, 1400);
      setTimeout(() => { const n = c.count('tidy'); c.alba.talk = true; c.doAct(c.alba.o, 'wave'); c.stamp('착착', `진열 끝 · ${n}번째`);
        const dd = c.now(), line = first ? ALBA[(dd.getDate() * 5 + dd.getMonth() * 3) % ALBA.length] : THANKS[Math.random() * THANKS.length | 0];
        c.toast(`알바: 「${line}」`, 3600); setTimeout(() => { c.alba.talk = false; done(); }, 2200); }, 2600); }},
    {id: 'seat', icon: '🪟', label: '창가', spot: [10.6, 2.6], face: Math.PI / 2, run(c, done) {
      const d = c.now(), n0 = c.today().seat || 0, ix = (d.getDate() * 7 + d.getMonth() * 3) % SEAT.length, line = n0 ? SEAT[(ix + n0 * 3) % SEAT.length] : SEAT[ix];
      const can = new c.THREE.Mesh(new c.THREE.CylinderGeometry(0.1, 0.1, 0.3, 10), new c.THREE.MeshLambertMaterial({color: 0xd65a5a})); c.hand.add(can);
      c.doAct(c.player, 'crouch'); c.toast('창가 자리에 앉는다. 창에 편의점이 비친다', 2000);
      setTimeout(() => { c.doAct(c.player, 'sip'); c.beep(260, .2, 0, 'sine', .05); }, 2000);
      setTimeout(() => c.toast(`「${line}」`, 3200), 3600);
      setTimeout(() => { const n = c.count('seat'); c.hand.remove(can); c.stamp('새벽', n === 1 ? '창밖은 아직 어둡다' : `오늘 ${n}번째 멍`); setTimeout(done, 1500); }, 6200); }},
  ],
  recExtra: c => `<p style="font-size:13px;color:#7a6e5e">만난 1+1 상품 ${(c.DB.promos || []).length}/${PROMO.length}${c.DB.pickBest ? ` · 삼각김밥 찾기 최고 ${c.DB.pickBest}초` : ''}</p>`,
  onEnter(c) { const d = c.now(), s = new Set(c.DB.promos || []); s.add(seedOf(d) % PROMO.length); c.DB.promos = [...s]; c.save(); c.beep(1200, .08); c.beep(900, .1, .1);
    c.toast(c.visits() > 1 ? `또 오셨네요. ${c.visits()}번째 — 어서 오세요… (졸린 목소리)` : '띠리링 — 어서 오세요. 새벽이라 조명이 더 하얗다', 3200); },
});
</script></body></html>
